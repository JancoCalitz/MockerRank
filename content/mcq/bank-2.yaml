# testing
- id: test-double-stub
  topic: testing
  difficulty: medium
  stem: |
    A test replaces a currency service with an object that always returns the same rate, and only checks the final
    result. What is this test double usually called?
  options: ['A mock', 'A fixture file', 'A spy on production', 'A stub']
  correctIndexes: [3]
  explanation: |
    A stub supplies canned answers. A mock is used to verify how it was called.
  tags: [test-doubles]
- id: coverage-limits
  topic: testing
  difficulty: medium
  stem: |
    A project has 100% line coverage. What does that prove?
  options:
    - The tests will never need changing
    - Every line ran during the tests, but not that the behaviour is correct
    - All possible inputs were tested
    - The code has no bugs
  correctIndexes: [1]
  explanation: |
    A test can run a line without checking its result, and coverage says nothing about the inputs not tried.
  tags: [coverage]
- id: test-pyramid-shape
  topic: testing
  difficulty: easy
  stem: |
    What does the testing pyramid recommend?
  options:
    - Only manual testing
    - Many fast unit tests, fewer integration tests, and a small number of end-to-end tests
    - Mostly end-to-end tests
    - An equal number of each type
  correctIndexes: [1]
  explanation: |
    Lower-level tests are faster and more reliable, so they should do most of the work.
  tags: [strategy]
- id: arrange-act-assert
  topic: testing
  difficulty: easy
  stem: |
    What does the arrange, act, assert pattern describe?
  options:
    - The stages of a code review
    - A way to sort test files
    - The structure of one test, which sets up, performs the action, and then checks the result
    - The order to deploy services in
  correctIndexes: [2]
  explanation: |
    Keeping these three parts separate makes a test easier to read.
  tags: [structure]
