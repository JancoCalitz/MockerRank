# arrays-strings
- id: two-pointer-sorted-pair
  topic: arrays-strings
  difficulty: medium
  stem: |
    A sorted array must be checked for two values that add up to a target. Using one pointer at each end
    that moves inward, what is the time complexity?
  options: ['O(1)', 'O(log n)', 'O(n)', 'O(n log n)']
  correctIndexes: [2]
  explanation: |
    Each step moves one pointer inward, so there are at most `n` steps. The sorted order tells you which
    pointer to move.
  tags: [two-pointers]
- id: kadane-purpose
  topic: arrays-strings
  difficulty: medium
  stem: |
    What does Kadane's algorithm compute in O(n) time?
  options:
    - The number of inversions in an array
    - The largest sum of a contiguous subarray
    - The median of an array
    - The longest increasing subsequence
  correctIndexes: [1]
  explanation: |
    At each position, it either extends the current subarray or starts a new one, keeping the best sum.
  tags: [subarrays]
- id: python-slice-output
  topic: arrays-strings
  difficulty: easy
  stem: |
    What does this Python code print?

    ```python
    s = "planets"
    print(s[1:4] + s[-1])
    ```
  options: ['lans', 'lanes', 'lane', 'plas']
  correctIndexes: [0]
  explanation: |
    `s[1:4]` takes indexes 1, 2, and 3, which is "lan". `s[-1]` is the last character, "s".
  tags: [python, slicing]
- id: in-place-rotate-technique
  topic: arrays-strings
  difficulty: hard
  stem: |
    An array can be rotated right by `k` positions in O(n) time and O(1) extra space. Which steps do this?
  options:
    - Sort the array, then swap the first `k` elements with the last `k`
    - Reverse the whole array, then reverse the first `k` and the remaining elements separately
    - Shift every element right by one, repeated `k` times
    - Copy the last `k` elements to a new array, then copy them back
  correctIndexes: [1]
  explanation: |
    The three reversals move each element to its final place. Repeated shifting takes O(nk) time, and
    copying uses O(k) extra space.
  tags: [rotation]

# hashing
- id: hash-set-duplicate-check
  topic: hashing
  difficulty: easy
  stem: |
    What is the average time complexity of checking whether a list of `n` values has any duplicate, using
    a hash set?
  options: ['O(1)', 'O(log n)', 'O(n)', 'O(n^2)']
  correctIndexes: [2]
  explanation: |
    Each value needs one average O(1) check and insert. It takes O(n) extra space, whereas sorting
    trades that for O(n log n) time.
  tags: [hash-set]
- id: open-addressing-meaning
  topic: hashing
  difficulty: medium
  stem: |
    How does a hash table that uses open addressing handle a collision?
  options:
    - It looks for another empty slot in the table itself
    - It stores a linked list in each bucket
    - It hashes the whole table again each time
    - It rejects the new key
  correctIndexes: [0]
  explanation: |
    Probing finds another slot, such as the next one along. Chaining is the approach that keeps a list per
    bucket.
  tags: [collisions]
- id: group-anagrams-key
  topic: hashing
  difficulty: medium
  stem: |
    To group words that are anagrams of each other in a hash map, which key works?
  options:
    - The word's length
    - The word's first letter
    - The word's last letter and length
    - The word's letters in sorted order
  correctIndexes: [3]
  explanation: |
    Anagrams have the same letters, so sorting gives each group one identical key. The other choices also
    match words that are not anagrams.
  tags: [anagrams]
- id: hash-map-iteration-order
  topic: hashing
  difficulty: medium
  stem: |
    Why should code not rely on the iteration order of a Java `HashMap`?
  options:
    - Its order is not specified, and can change as it grows
    - It always iterates in reverse order
    - Iterating over it throws an exception
    - It sorts its keys on every insert
  correctIndexes: [0]
  explanation: |
    Order depends on hashes and capacity. `LinkedHashMap` keeps insertion order, and `TreeMap` keeps keys
    sorted.
  tags: [java]

# sorting-searching
- id: counting-sort-condition
  topic: sorting-searching
  difficulty: medium
  stem: |
    When can counting sort beat O(n log n)?
  options:
    - When the keys are long strings
    - When memory is very limited
    - When the keys are integers in a small range
    - When the input is already sorted
  correctIndexes: [2]
  explanation: |
    It takes O(n + k) time for keys in a range of size `k`, without comparing elements, and O(k) extra space.
  tags: [counting-sort]
- id: binary-search-mid-overflow
  topic: sorting-searching
  difficulty: hard
  stem: |
    In C or Java, why is `mid = low + (high - low) / 2` preferred over `mid = (low + high) / 2` for binary search
    on int indexes?
  options:
    - It rounds up instead of down
    - It runs in fewer steps
    - '`low + high` can overflow on very large arrays'
    - It works on unsorted arrays
  correctIndexes: [2]
  explanation: |
    Two large int indexes can add up to more than the int range, and give a negative midpoint.
  tags: [binary-search, overflow]
- id: search-rotated-array
  topic: sorting-searching
  difficulty: hard
  stem: |
    A sorted array of distinct values has been rotated by an unknown amount. What is the best time
    complexity for finding a value?
  options: ['O(1)', 'O(log n)', 'O(n)', 'O(n log n)']
  correctIndexes: [1]
  explanation: |
    After splitting at the middle, one half is always still sorted, which shows whether the value could be
    in it. So a modified binary search works.
  tags: [binary-search]
- id: k-largest-heap
  topic: sorting-searching
  difficulty: medium
  stem: |
    What is the time complexity of finding the `k` largest of `n` values, using a min-heap of size `k`?
  options: ['O(k)', 'O(n + k)', 'O(n log k)', 'O(n^2)']
  correctIndexes: [2]
  explanation: |
    Each of the `n` values may cause one heap operation, which costs O(log k) on a heap of size `k`.
  tags: [heaps]

# stacks-queues
- id: stack-reverse-string
  topic: stacks-queues
  difficulty: easy
  stem: |
    The characters of a string are pushed onto a stack one at a time, and then all popped. What comes out?
  options:
    - The string reversed
    - Only the first character
    - The string in its original order
    - The characters in sorted order
  correctIndexes: [0]
  explanation: |
    The last character pushed is the first one popped.
  tags: [lifo]
- id: postfix-evaluation
  topic: stacks-queues
  difficulty: medium
  stem: |
    What is the value of the postfix expression `3 4 + 2 *`?
  options: ['10', '11', '14', '24']
  correctIndexes: [2]
  explanation: |
    Push 3 and 4, and `+` leaves 7. Push 2, and `*` leaves 14. A stack evaluates this directly.
  tags: [postfix]
- id: sliding-window-maximum-structure
  topic: stacks-queues
  difficulty: hard
  stem: |
    Which data structure finds the maximum of every window of size `k` in O(n) total time?
  options:
    - A hash set
    - A monotonic double-ended queue
    - A binary search tree
    - A plain stack
  correctIndexes: [1]
  explanation: |
    The deque holds candidates in decreasing order. Each index enters and leaves once, so the total is linear.
  tags: [deque, sliding-window]
- id: circular-buffer-benefit
  topic: stacks-queues
  difficulty: medium
  stem: |
    What is the main benefit of implementing a fixed-size queue as a circular buffer over a plain array?
  options:
    - It keeps elements sorted
    - Dequeuing does not need to shift the elements
    - It can grow without limit
    - It removes the need to track the size
  correctIndexes: [1]
  explanation: |
    The head and tail indexes wrap around, so enqueuing and dequeuing are both O(1).
  tags: [queues]

# linked-lists
- id: remove-nth-from-end
  topic: linked-lists
  difficulty: medium
  stem: |
    What is an efficient way to find the `n`-th node from the end of a singly linked list in one pass?
  options:
    - Keep two pointers `n` nodes apart, and move both until the front one reaches the end
    - Reverse the list twice
    - Sort the list first
    - Use binary search
  correctIndexes: [0]
  explanation: |
    When the leading pointer reaches the end, the trailing pointer is `n` nodes behind it.
  tags: [two-pointers]
- id: merge-sorted-lists
  topic: linked-lists
  difficulty: easy
  stem: |
    What is the time complexity of merging two sorted linked lists with lengths `n` and `m`?
  options: ['O(n * m)', 'O(n + m)', 'O(log(n + m))', 'O(1)']
  correctIndexes: [1]
  explanation: |
    Each step moves one node into the result, so there are `n + m` steps.
  tags: [merging]
- id: dummy-head-benefit
  topic: linked-lists
  difficulty: medium
  stem: |
    Why do linked list functions often start with a dummy head node?
  options:
    - It makes the code run faster
    - It removes special cases, such as changing the first node
    - It prevents cycles
    - It stores the length of the list
  correctIndexes: [1]
  explanation: |
    Every real node then has a node before it, so inserting or deleting at the front needs no separate code.
  tags: [technique]
- id: list-vs-array-cache
  topic: linked-lists
  difficulty: hard
  stem: |
    Both an array and a linked list take O(n) to scan. Why is the array usually much faster in practice?
  options:
    - Linked lists must be sorted first
    - Arrays use less precise arithmetic
    - Arrays are always stored on the stack
    - Its elements sit next to each other in memory, which suits the CPU cache
  correctIndexes: [3]
  explanation: |
    Reading neighbours is cheap once they are in cache. A linked list's nodes can be scattered, causing cache misses.
  tags: [performance]

