# debugging-code-reading
- id: python-closure-late-binding
  topic: debugging-code-reading
  difficulty: hard
  stem: |
    What does this Python code print?

    ```python
    fs = [lambda: i for i in range(3)]
    print([f() for f in fs])
    ```
  options: ['[3, 3, 3]', '[0, 1, 2]', '[2, 2, 2]', '[0, 0, 0]']
  correctIndexes: [2]
  explanation: |
    Each lambda looks up `i` when it is called, not when it is created. By then, `i` is 2.
  tags: [python, closures]
- id: javascript-array-sort-default
  topic: debugging-code-reading
  difficulty: medium
  stem: |
