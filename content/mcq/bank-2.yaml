# recursion-dp
- id: memoization-vs-tabulation
  topic: recursion-dp
  difficulty: medium
  stem: |
    How does tabulation differ from memoization?
  options:
    - Memoization does not store anything
    - Tabulation fills a table from small subproblems upward, while memoization caches results of recursive calls
    - Only tabulation has overlapping subproblems
    - Tabulation always uses more memory
  correctIndexes: [1]
  explanation: |
    Both avoid repeated work. Tabulation has no recursion, so it cannot overflow the call stack.
  tags: [dp]
- id: coin-change-greedy-failure
  topic: recursion-dp
  difficulty: medium
  stem: |
    Coins are worth 1, 3, and 4. Always taking the largest coin that fits makes 6 with how many coins, and what is
    the true minimum?
  options:
    - Greedy uses 3 coins, and the minimum is 3
    - Greedy uses 2 coins, and the minimum is 2
    - Greedy uses 4 coins, and the minimum is 3
    - Greedy uses 3 coins, and the minimum is 2
  correctIndexes: [3]
  explanation: |
    Greedy takes 4 + 1 + 1. The best is 3 + 3. This is why coin change generally needs dynamic programming.
  tags: [dp, greedy]
- id: tail-call-note
  topic: recursion-dp
  difficulty: hard
  stem: |
    A function's recursive call is the very last thing it does. What is this called, and what can a compiler that
    supports it do?
  options:
    - Memoization, which caches the result
    - Head recursion, which reverses the call order
    - Mutual recursion, which runs faster on multiple cores
    - Tail recursion, which can reuse the same stack frame
  correctIndexes: [3]
  explanation: |
    No work remains after the call, so its frame is not needed. Note that Java and Python do not do this.
  tags: [recursion]
- id: lcs-complexity
  topic: recursion-dp
  difficulty: medium
  stem: |
    What is the time complexity of the standard dynamic programming solution for the longest common subsequence of
    strings with lengths `n` and `m`?
  options: ['O(n + m)', 'O(n log m)', 'O(n * m)', 'O(2^n)']
  correctIndexes: [2]
  explanation: |
    There is a table entry for each pair of prefixes, and each takes O(1) to fill in.
  tags: [dp]

# big-o
- id: amortized-append
  topic: big-o
  difficulty: medium
  stem: |
    A dynamic array doubles its capacity when full. What is the amortized cost of an append?
  options: ['O(1)', 'O(log n)', 'O(n)', 'O(n log n)']
  correctIndexes: [0]
  explanation: |
    Copies are rare and get paid for by the appends between them. The total copying is less than 2n over `n` appends.
  tags: [amortized]
- id: space-complexity-recursion
