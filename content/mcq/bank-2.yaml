    The recursion is about log n levels deep, and each level takes a stack frame. A loop version uses O(1).
  tags: [space]
- id: subsets-count
  topic: big-o
  difficulty: medium
  stem: |
    What is the time complexity of generating every subset of `n` items?
  options: ['O(n)', 'O(n^2)', 'O(2^n)', 'O(log n)']
