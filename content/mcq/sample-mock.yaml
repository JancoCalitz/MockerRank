- id: reverse-in-place-space
  topic: arrays-strings
  difficulty: easy
  stem: |
    An array of `n` integers is reversed in place by swapping elements from both ends with two
    pointers. How much additional space does this use?
  options:
    - O(1)
    - O(log n)
    - O(n)
    - O(n log n)
  correctIndexes: [0]
  explanation: |
    Only the two indexes and one temporary value are needed, however long the array is.
  tags: [two-pointers]

- id: colliding-hash-lookup
  topic: hashing
  difficulty: medium
  stem: |
    A hash table resolves collisions with chaining. A poor hash function sends all `n` keys to the
    same bucket. What is the time complexity of looking up a key?
  options:
    - O(1)
    - O(log n)
    - O(n)
    - O(n^2)
  correctIndexes: [2]
  explanation: |
    Every key is in one chain, so a lookup may have to walk all `n` entries.
  tags: [collisions]

- id: binary-search-comparisons
  topic: sorting-searching
  difficulty: medium
  stem: |
    About how many comparisons does binary search need, at most, to search a sorted array of one
    million distinct values?
  options:
    - '10'
    - '20'
    - '1,000'
    - '500,000'
  correctIndexes: [1]
  explanation: |
    Each comparison halves the remaining range, and 2^20 is just over one million.
  tags: [binary-search]

- id: stack-pop-order
  topic: stacks-queues
  difficulty: easy
  stem: |
    Starting with an empty stack, these operations run in order:

    `push 1, push 2, push 3, pop, push 4, pop, pop`

    In what order are values popped?
  options:
    - 1, 2, 3
    - 3, 2, 1
    - 3, 4, 2
    - 4, 3, 2
  correctIndexes: [2]
  explanation: |
    The first pop removes 3. Pushing 4 puts it on top, so the next pops remove 4 and then 2.
  tags: [lifo]

- id: detect-list-cycle
  topic: linked-lists
  difficulty: medium
  stem: |
    Which technique detects a cycle in a singly linked list using O(1) extra space?
  options:
    - Storing each visited node in a hash set
    - Moving one slow pointer and one fast pointer through the list
    - Copying the values to an array and sorting it
    - Recursively visiting each node's next pointer
  correctIndexes: [1]
  explanation: |
    If there is a cycle, a pointer moving two steps at a time eventually meets one moving a single
    step. A hash set uses O(n) space, and recursion uses O(n) stack space.
  tags: [two-pointers]

- id: bst-inorder
  topic: trees-graphs
  difficulty: easy
  stem: |
    What does an in-order traversal of a binary search tree with distinct keys produce?
  options:
    - The keys in ascending order
    - The keys in descending order
    - The keys level by level
    - The root followed by the leaves
  correctIndexes: [0]
  explanation: |
    In-order visits the left subtree, then the node, then the right subtree. In a binary search
    tree, that visits smaller keys before larger ones.
  tags: [bst, traversal]

- id: unweighted-shortest-path
  topic: trees-graphs
  difficulty: medium
  stem: |
    Which algorithm finds a path with the fewest edges between two nodes of an unweighted graph in
    O(V + E) time?
  options:
    - Depth-first search
    - Breadth-first search
    - Topological sort
    - Kruskal's algorithm
  correctIndexes: [1]
  explanation: |
    Breadth-first search explores nodes in order of their distance from the start, so the first time
    it reaches a node, it has used the fewest possible edges.
  tags: [bfs]

- id: memoized-fibonacci
  topic: recursion-dp
  difficulty: medium
  stem: |
    The naive recursive `fib(n)` calls `fib(n - 1)` and `fib(n - 2)`. What is its time complexity
    after adding memoization, counting arithmetic as constant time?
  options:
    - O(log n)
    - O(n)
    - O(n^2)
    - O(2^n)
  correctIndexes: [1]
  explanation: |
    Each value from 0 to `n` is computed once and then read from the cache, so the work is linear.
  tags: [memoization]

- id: doubling-inner-loop
  topic: big-o
  difficulty: medium
  stem: |
    What is the time complexity of this code?

    ```python
    for i in range(n):
        j = 1
        while j < n:
            j *= 2
    ```
  options:
    - O(n)
    - O(n log n)
    - O(n^2)
    - O(log n)
  correctIndexes: [1]
  explanation: |
    The inner loop doubles `j`, so it runs about log n times, once for each of the `n` outer
    iterations.
  tags: [loops]

- id: substitutable-subclass
  topic: oop-design
  difficulty: easy
  stem: |
    Which SOLID principle says that objects of a subclass should be usable anywhere the base class
    is expected, without breaking the program?
  options:
    - Single responsibility
    - Open/closed
    - Liskov substitution
    - Dependency inversion
  correctIndexes: [2]
  explanation: |
    Liskov substitution requires subclasses to honor the behavior that users of the base class rely
    on.
  tags: [solid]

- id: left-join-is-null
  topic: sql
  difficulty: medium
  stem: |
    What does this query return?

    ```sql
    SELECT c.name
    FROM customers c
    LEFT JOIN orders o ON o.customer_id = c.id
    WHERE o.id IS NULL;
    ```
  options:
    - All customers, once per order
    - Customers with at least one order
    - Customers with no orders
    - Orders with no customer
  correctIndexes: [2]
  explanation: |
    A left join keeps every customer. Customers without a matching order get NULL order columns, and
    the WHERE clause keeps only those rows.
  tags: [joins]

- id: filter-on-aggregate
  topic: sql
  difficulty: easy
  stem: |
    Which clause filters grouped rows using an aggregate, such as keeping departments where
    `COUNT(*) > 5`?
  options:
    - WHERE
    - HAVING
    - ORDER BY
    - DISTINCT
  correctIndexes: [1]
  explanation: |
    WHERE filters rows before grouping, so it cannot use aggregates. HAVING filters after grouping.
  tags: [group-by]

- id: python-mutable-default
  topic: debugging-code-reading
  difficulty: medium
  stem: |
    What does this Python code print?

    ```python
    def add(value, items=[]):
        items.append(value)
        return items

    add(1)
    print(add(2))
    ```
  options:
    - '[2]'
    - '[1, 2]'
    - '[1]'
    - It raises an error
  correctIndexes: [1]
  explanation: |
    A default argument is created once, when the function is defined, so both calls append to the
    same list.
  tags: [python]

- id: javascript-var-closure
  topic: debugging-code-reading
  difficulty: medium
  stem: |
    What does this JavaScript code print?

    ```javascript
    for (var i = 0; i < 3; i++) {
      setTimeout(() => console.log(i));
    }
    ```
  options:
    - 0 1 2
    - 1 2 3
    - 3 3 3
    - 0 0 0
  correctIndexes: [2]
  explanation: |
    `var` creates one function-scoped `i`. The callbacks run after the loop ends, when `i` is 3.
    Using `let` would create a new binding for each iteration and print 0 1 2.
  tags: [javascript, closures]

- id: java-string-equality
  topic: language-trivia
  difficulty: easy
  stem: |
    What does this Java code print?

    ```java
    String a = new String("hi");
    String b = new String("hi");
    System.out.println((a == b) + " " + a.equals(b));
    ```
  options:
    - true true
    - true false
    - false true
    - false false
  correctIndexes: [2]
  explanation: |
    `==` compares references, and `new` creates two separate objects. `equals` compares the contents.
  tags: [java]

- id: idempotent-http-methods
  topic: rest-http
  difficulty: medium
  stem: |
    According to the HTTP specification, which of these methods are idempotent? Select all that
    apply.
  options:
    - GET
    - POST
    - PUT
    - DELETE
  multiSelect: true
  correctIndexes: [0, 2, 3]
  explanation: |
    Repeating GET, PUT, or DELETE has the same intended effect on the server as sending it once.
    Repeating POST may create a new resource each time.
  tags: [http-methods]

- id: undo-pushed-commit
  topic: git
  difficulty: easy
  stem: |
    A bad commit is already on a branch your team shares. Which command undoes its changes without
    rewriting history?
  options:
    - git revert
    - git reset --hard
    - git commit --amend
    - git stash
  correctIndexes: [0]
  explanation: |
    `git revert` adds a new commit that reverses the bad one, so nobody else's history changes.
  tags: [history]

- id: verify-interactions
  topic: testing
  difficulty: easy
  stem: |
    A unit test replaces an email service with a test double, and then checks that `send` was called
    exactly once. What is this kind of test double usually called?
  options:
    - A fixture
    - A mock
    - A smoke test
    - A linter
  correctIndexes: [1]
  explanation: |
    A mock records how it was called so the test can verify those interactions.
  tags: [test-doubles]
