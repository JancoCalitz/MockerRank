# arrays-strings
- id: java-string-concat-loop
  topic: arrays-strings
  difficulty: medium
  stem: |
    A Java method builds a string of `n` characters by doing `s = s + c` in a loop, where `s` is a
    `String`. What is the total time complexity?
  options: ['O(n)', 'O(n log n)', 'O(n^2)', 'O(1)']
  correctIndexes: [2]
  explanation: |
    Strings are immutable, so each step copies everything so far: 1 + 2 + ... + n characters. A
    `StringBuilder` makes this O(n).
  tags: [strings, immutability]
- id: longest-unique-substring-technique
  topic: arrays-strings
  difficulty: medium
  stem: |
    Which technique finds the longest substring without repeated characters in O(n) time?
  options:
    - A sliding window with a set of the characters in the window
    - Checking every possible substring
    - Sorting the characters first
    - Binary search on the characters
  correctIndexes: [0]
  explanation: |
    The window grows on the right and shrinks on the left when a repeat appears, so each character
    enters and leaves at most once.
  tags: [sliding-window]
- id: prefix-sum-queries
  topic: arrays-strings
  difficulty: medium
  stem: |
    An array never changes, and you must answer many "sum from index `i` to `j`" queries. After O(n)
    preprocessing, what can each query cost with prefix sums?
  options: ['O(1)', 'O(log n)', 'O(j - i)', 'O(n)']
  correctIndexes: [0]
  explanation: |
    With `prefix[k]` as the sum of the first `k` values, a query is `prefix[j + 1] - prefix[i]`.
  tags: [prefix-sums]
- id: insert-front-dynamic-array
  topic: arrays-strings
  difficulty: easy
  stem: |
    What is the time complexity of inserting an element at the front of a dynamic array holding `n`
    elements?
  options: ['O(1)', 'O(log n)', 'O(n)', 'O(n log n)']
  correctIndexes: [2]
  explanation: |
    Every existing element has to shift one position to the right.
  tags: [dynamic-arrays]
- id: dedupe-sorted-output
  topic: arrays-strings
  difficulty: medium
  stem: |
    What does this Python code print?

    ```python
    a = [1, 1, 2, 3, 3]
    w = 1
    for r in range(1, len(a)):
        if a[r] != a[w - 1]:
            a[w] = a[r]
            w += 1
    print(w)
    ```
  options: ['2', '3', '4', '5']
  correctIndexes: [1]
  explanation: |
    `w` counts the distinct values, moved to the front of the sorted array: 1, 2, and 3.
  tags: [two-pointers]

# hashing
- id: hash-map-average-lookup
  topic: hashing
  difficulty: easy
  stem: |
    With a good hash function and a reasonable load factor, what is the average time to look up a key
    in a hash map?
  options: ['O(1)', 'O(log n)', 'O(n)', 'O(n log n)']
  correctIndexes: [0]
  explanation: |
    Keys spread evenly across buckets, so each bucket holds only a few entries on average.
  tags: [complexity]
- id: load-factor-meaning
  topic: hashing
  difficulty: easy
  stem: |
    What is the load factor of a hash table?
  options:
    - The number of entries divided by the number of buckets
    - The number of collisions so far
    - The size of the largest bucket
    - The time taken by the hash function
  correctIndexes: [0]
  explanation: |
    As the load factor rises, collisions become more likely, so tables usually resize past a threshold.
  tags: [load-factor]
- id: first-unique-character
  topic: hashing
  difficulty: medium
  stem: |
    What is the most efficient general way to find the first character in a string that appears only
    once?
  options:
    - Count every character in a map, then scan the string for the first count of 1
    - For each character, scan the whole string for another copy
    - Sort the string, then read the first character
    - Use binary search on the string
  correctIndexes: [0]
  explanation: |
    Two passes take O(n) time. Sorting loses the original order, and comparing all pairs takes O(n^2).
  tags: [counting]
- id: python-unhashable-key
  topic: hashing
  difficulty: medium
  stem: |
    What happens when this Python code runs?

    ```python
    d = {}
    d[[1, 2]] = "x"
    ```
  options:
    - It stores the value under the list
    - It raises a TypeError
    - It stores the value under the key 1
    - It stores the value under the string "[1, 2]"
  correctIndexes: [1]
  explanation: |
    Lists can change, so they are unhashable. A tuple such as `(1, 2)` works as a key.
  tags: [python]
- id: java-equals-hashcode
  topic: hashing
  difficulty: medium
  stem: |
    A Java class overrides `equals` but not `hashCode`. What can go wrong when its objects are keys in
    a `HashMap`?
  options:
    - The class will not compile
    - Equal objects may land in different buckets, so lookups can miss
    - The map will sort keys incorrectly
    - The map will throw an exception on every insert
  correctIndexes: [1]
  explanation: |
    Objects that are equal must have equal hash codes, or the map may search the wrong bucket.
  tags: [java]

# sorting-searching
- id: stable-sort-meaning
  topic: sorting-searching
  difficulty: easy
  stem: |
    What does it mean for a sorting algorithm to be stable?
  options:
    - Elements that compare equal keep their original relative order
    - It always takes the same time on any input
    - It uses no extra memory
    - It never swaps elements
  correctIndexes: [0]
  explanation: |
    Stability matters when sorting by one field after another, such as by name and then by department.
  tags: [stability]
- id: merge-sort-worst-case
  topic: sorting-searching
  difficulty: easy
  stem: |
    What is the worst-case time complexity of merge sort?
  options: ['O(n)', 'O(n log n)', 'O(n^2)', 'O(log n)']
  correctIndexes: [1]
  explanation: |
    It always splits the input in half, giving log n levels with O(n) merging on each.
  tags: [merge-sort]
- id: quicksort-worst-case
  topic: sorting-searching
  difficulty: medium
  stem: |
    What causes quicksort's O(n^2) worst case?
  options:
    - Too many duplicate pivots being swapped into place
    - Pivots that repeatedly split the input very unevenly
    - Running it on an input with an odd length
    - Using recursion instead of a loop
  correctIndexes: [1]
  explanation: |
    If each pivot leaves nearly everything on one side, there are about `n` levels of O(n) work.
    Choosing pivots randomly makes this very unlikely.
  tags: [quicksort]
- id: binary-search-precondition
  topic: sorting-searching
  difficulty: easy
  stem: |
    What must be true of an array for binary search to work?
  options:
    - Its values must be sorted
    - Its length must be a power of two
    - Its values must be distinct
    - Its values must be integers
  correctIndexes: [0]
  explanation: |
    Each comparison discards half of the range, which is only valid if the order tells you which half.
  tags: [binary-search]
- id: lower-bound-index
  topic: sorting-searching
  difficulty: medium
  stem: |
    A lower bound search returns the first index whose value is greater than or equal to the target.
    What does it return for the target 3 in `[1, 3, 3, 5]`, counting indexes from 0?
  options: ['0', '1', '2', '3']
  correctIndexes: [1]
  explanation: |
    Index 1 holds the first 3. An upper bound search would return 3, the first value greater than 3.
  tags: [binary-search]

# stacks-queues
- id: queue-order
  topic: stacks-queues
  difficulty: easy
  stem: |
    Starting with an empty queue, these operations run in order:

    `enqueue 1, enqueue 2, enqueue 3, dequeue, enqueue 4, dequeue`

    Which values are removed, in order?
  options: ['1, 2', '3, 4', '1, 4', '3, 2']
  correctIndexes: [0]
  explanation: |
    A queue removes the oldest value first, so 1 and then 2 leave.
  tags: [fifo]
- id: bfs-data-structure
  topic: stacks-queues
  difficulty: easy
  stem: |
    Which data structure does breadth-first search normally use to hold the nodes it will visit next?
  options: ['A stack', 'A queue', 'A heap', 'A hash map']
  correctIndexes: [1]
  explanation: |
    First in, first out means nearer nodes are visited before farther ones.
  tags: [bfs]
- id: balanced-brackets-structure
  topic: stacks-queues
  difficulty: easy
  stem: |
    Which data structure fits best for checking that brackets in a string are balanced?
  options: ['A stack', 'A queue', 'A sorted array', 'A binary search tree']
  correctIndexes: [0]
  explanation: |
    The most recently opened bracket must close first, which matches last in, first out.
  tags: [lifo]
- id: queue-from-two-stacks
  topic: stacks-queues
  difficulty: medium
  stem: |
    A queue is built from two stacks: push onto the first, and pop from the second, refilling it from
    the first only when it is empty. What is the amortized cost per operation?
  options: ['O(1)', 'O(log n)', 'O(n)', 'O(n^2)']
  correctIndexes: [0]
  explanation: |
    Each element moves between the stacks at most once, so a single expensive refill is paid for by
    the cheap operations around it.
  tags: [amortized]
- id: monotonic-stack-next-greater
  topic: stacks-queues
  difficulty: hard
  stem: |
    A monotonic stack finds the next greater element for every position in an array of `n` values. What
    is its total time complexity?
  options: ['O(n)', 'O(n log n)', 'O(n^2)', 'O(log n)']
  correctIndexes: [0]
  explanation: |
    Each index is pushed once and popped at most once, so the nested loop is still linear overall.
  tags: [monotonic-stack]

# linked-lists
