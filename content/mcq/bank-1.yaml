- id: cpp-reference-parameter
  topic: language-trivia
  difficulty: easy
  stem: |
    What does this C++ code print?

    ```cpp
    void set(int& x) { x = 5; }

    int a = 1;
    set(a);
    std::cout << a;
    ```
  options: ['1', '5', '0', 'It does not compile']
  correctIndexes: [1]
