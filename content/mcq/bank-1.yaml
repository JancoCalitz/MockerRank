- id: dependency-injection-benefit
  topic: oop-design
  difficulty: medium
  stem: |
    What is a main benefit of passing a class its dependencies instead of creating them inside it?
  options:
    - The code runs faster
    - Tests can supply fakes in place of real dependencies
    - The class needs no constructor
    - Dependencies no longer need interfaces
  correctIndexes: [1]
  explanation: |
    The class no longer decides which implementation it uses, so a test can pass one of its own.
  tags: [dependency-injection]

