- id: reverse-list-space
  topic: linked-lists
  difficulty: medium
  stem: |
    How much extra space does reversing a singly linked list iteratively with three pointers use?
  options: ['O(1)', 'O(log n)', 'O(n)', 'O(n^2)']
  correctIndexes: [0]
  explanation: |
    Previous, current, and next pointers are enough. A recursive version uses O(n) stack space.
  tags: [reversal]
- id: list-find-middle
  topic: linked-lists
  difficulty: medium
  stem: |
    A slow pointer moves one node at a time and a fast pointer moves two. Both start at the head. Where
    is the slow pointer when the fast pointer reaches the end?
  options: ['At the head', 'About a quarter of the way along', 'Near the middle', 'At the end']
  correctIndexes: [2]
  explanation: |
    The fast pointer covers twice the distance, so the slow pointer has covered half of the list.
  tags: [two-pointers]
