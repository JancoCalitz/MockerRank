    `int&` is a reference to the caller's variable. A plain `int x` would change only a copy.
  tags: [cpp]
- id: javascript-equality
  topic: language-trivia
  difficulty: medium
  stem: |
    What does this JavaScript code print?

    ```javascript
    console.log(0 == "", 0 === "");
    ```
  options: ['true true', 'true false', 'false true', 'false false']
  correctIndexes: [1]
  explanation: |
    `==` converts types, and an empty string becomes 0. `===` compares types too, so it is false.
  tags: [javascript]
- id: python-floor-division
  topic: language-trivia
  difficulty: medium
  stem: |
    What does `-7 // 2` evaluate to in Python?
  options: ['-3', '-3.5', '-4', '4']
  correctIndexes: [2]
  explanation: |
    `//` rounds down towards negative infinity, not towards zero as C and Java do.
  tags: [python]
- id: typescript-types-erased
  topic: language-trivia
  difficulty: medium
  stem: |
    What happens to a TypeScript `interface` when the code is compiled to JavaScript?
  options:
    - It becomes a JavaScript class
    - It is checked again at run time
    - It is removed, and leaves nothing at run time
    - It becomes a plain object
  correctIndexes: [2]
  explanation: |
    Types only exist while compiling, so `instanceof` cannot be used with an interface.
  tags: [typescript]

# rest-http
- id: http-201-created
  topic: rest-http
  difficulty: easy
  stem: |
    Which status code best fits a POST request that successfully created a new resource?
  options: ['200 OK', '201 Created', '204 No Content', '304 Not Modified']
  correctIndexes: [1]
  explanation: |
    201 says something new now exists, and usually comes with a `Location` header.
  tags: [status-codes]
- id: http-404-meaning
  topic: rest-http
  difficulty: easy
  stem: |
    What does a 404 status code mean?
  options:
    - The server crashed
    - The resource was not found
    - The client must log in
    - The request was too large
  correctIndexes: [1]
  explanation: |
    The server understood the request, but found nothing at that address.
  tags: [status-codes]
- id: http-401-vs-403
  topic: rest-http
  difficulty: medium
  stem: |
    A logged-in user requests a page that only administrators may see. Which status code fits best?
  options: ['400 Bad Request', '401 Unauthorized', '403 Forbidden', '404 Not Found']
  correctIndexes: [2]
  explanation: |
    401 means the server does not know who you are. 403 means it knows, and you are not allowed.
  tags: [status-codes]
- id: safe-http-methods
  topic: rest-http
  difficulty: medium
  stem: |
    Which of these HTTP methods are defined as safe, meaning that they should not change server state?
    Select all that apply.
  options: ['GET', 'HEAD', 'POST', 'PUT']
  multiSelect: true
  correctIndexes: [0, 1]
  explanation: |
    GET and HEAD only read. PUT is idempotent, but it still changes state.
  tags: [http-methods]
- id: http-5xx-meaning
  topic: rest-http
  difficulty: easy
  stem: |
    What do status codes in the 5xx range indicate?
  options:
    - The request succeeded
    - The client should redirect
    - The client sent a bad request
    - The server failed to handle a valid request
  correctIndexes: [3]
  explanation: |
    4xx codes point to a problem with the request, and 5xx codes to a problem on the server.
  tags: [status-codes]

# git
- id: git-add-purpose
  topic: git
  difficulty: easy
  stem: |
    What does `git add` do?
  options:
    - Records a commit
    - Sends commits to the remote
    - Stages changes for the next commit
    - Creates a new branch
  correctIndexes: [2]
  explanation: |
    It puts changes in the staging area, and `git commit` then records what is staged.
  tags: [staging]
- id: git-rebase-rewrites
  topic: git
  difficulty: medium
  stem: |
    How does `git rebase` differ from `git merge`?
  options:
    - Rebase replays commits as new ones, which rewrites history
    - Rebase deletes the other branch
    - Rebase only works on the main branch
    - Rebase always creates a merge commit
  correctIndexes: [0]
  explanation: |
    The replayed commits get new hashes, which is why rebasing shared commits causes trouble.
  tags: [history]
- id: git-stash-purpose
  topic: git
  difficulty: easy
  stem: |
    You have uncommitted work and need to switch branches quickly. Which command sets the work aside so
    you can restore it later?
  options: ['git stash', 'git reset --hard', 'git clean', 'git revert']
  correctIndexes: [0]
  explanation: |
    `git stash pop` brings it back. `git reset --hard` and `git clean` would destroy the work.
  tags: [stash]
- id: git-create-branch
  topic: git
  difficulty: easy
  stem: |
    Which command creates a new branch called `fix`, and switches to it?
  options: ['git branch --list fix', 'git switch -c fix', 'git commit fix', 'git fetch fix']
  correctIndexes: [1]
  explanation: |
    `git checkout -b fix` does the same thing.
  tags: [branches]
- id: git-merge-conflict-cause
  topic: git
  difficulty: easy
  stem: |
    What typically causes a merge conflict?
  options:
    - Two branches changed the same lines in different ways
    - A branch has too many commits
    - A file was added on one branch
    - The remote is unavailable
  correctIndexes: [0]
  explanation: |
    Git combines separate changes by itself, but it cannot choose between competing edits.
  tags: [merging]

# testing
- id: unit-vs-integration
  topic: testing
  difficulty: easy
  stem: |
    What best describes the difference between a unit test and an integration test?
  options:
    - Unit tests check one small piece alone, and integration tests check pieces working together
    - Unit tests only run in production
    - Integration tests never use a database
    - There is no difference
  correctIndexes: [0]
  explanation: |
    Unit tests are fast and precise. Integration tests catch problems where the pieces meet.
  tags: [test-types]
- id: tdd-cycle
  topic: testing
  difficulty: easy
  stem: |
    What is the usual order of the test-driven development cycle?
  options:
    - Write code, write a test, then deploy
    - Write a failing test, make it pass, then refactor
    - Refactor, write code, then write a test
    - Write all of the tests after the feature is finished
  correctIndexes: [1]
  explanation: |
    This is often called red, green, refactor.
  tags: [tdd]
- id: regression-test-purpose
  topic: testing
  difficulty: easy
  stem: |
    What is the purpose of adding a regression test after fixing a bug?
  options:
    - To make the code run faster
    - To stop the same bug from returning unnoticed
    - To replace the code review
    - To measure test coverage
  correctIndexes: [1]
  explanation: |
    The test fails if a later change brings the bug back.
  tags: [regression]
- id: boundary-values
  topic: testing
  difficulty: medium
  stem: |
    A function accepts whole numbers from 1 to 100. Which of these inputs are boundary tests? Select all
    that apply.
  options: ['0', '1', '50', '101']
  multiSelect: true
  correctIndexes: [0, 1, 3]
  explanation: |
    Bugs cluster at the edges, so test on each side of them. 50 is an ordinary value in the middle.
  tags: [boundaries]
- id: flaky-test-cause
  topic: testing
  difficulty: medium
  stem: |
    A test sometimes passes and sometimes fails, with no code changes. Which is a likely cause?
  options:
    - It depends on timing or on state left by another test
    - It has too many assertions
    - Its name is too long
    - It was written before the code
  correctIndexes: [0]
  explanation: |
    Timing, ordering, and shared state are the usual causes of flaky tests.
  tags: [flakiness]
