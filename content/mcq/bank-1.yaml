# big-o
- id: sort-then-scan
  topic: big-o
  difficulty: easy
  stem: |
    An algorithm sorts `n` items with a comparison sort, then scans them once. What is its overall time
    complexity?
  options: ['O(n)', 'O(n log n)', 'O(n^2)', 'O(n^2 log n)']
  correctIndexes: [1]
  explanation: |
    Sequential steps add up: O(n log n) + O(n), and the larger term wins.
  tags: [combining]
- id: triangular-nested-loop
  topic: big-o
  difficulty: easy
  stem: |
    What is the time complexity of this code?

    ```python
    for i in range(n):
        for j in range(i):
            work()
    ```
  options: ['O(n)', 'O(n log n)', 'O(n^2)', 'O(2^n)']
  correctIndexes: [2]
  explanation: |
    `work` runs 0 + 1 + ... + (n - 1) = n(n - 1) / 2 times, which is still quadratic.
  tags: [loops]
- id: halving-loop
  topic: big-o
  difficulty: easy
  stem: |
    What is the time complexity of this code?

    ```python
    while n > 1:
        n = n // 2
    ```
  options: ['O(1)', 'O(log n)', 'O(n)', 'O(n log n)']
  correctIndexes: [1]
  explanation: |
    Halving reaches 1 after about log n steps.
  tags: [loops]
- id: two-separate-loops
  topic: big-o
  difficulty: easy
  stem: |
    A function loops once over a list of length `n`, and afterwards once over a list of length `m`. What
    is its time complexity?
  options: ['O(n)', 'O(n * m)', 'O(n + m)', 'O(max(n, m)^2)']
  correctIndexes: [2]
  explanation: |
    The loops run one after the other, so their costs add. Nested loops would multiply.
  tags: [combining]
- id: fastest-growth
  topic: big-o
  difficulty: easy
  stem: |
    Which of these grows fastest as `n` becomes large?
  options: ['n^3', 'n log n', '2^n', 'n^2']
  correctIndexes: [2]
  explanation: |
    Exponential growth overtakes any polynomial for large enough `n`.
  tags: [growth]

# oop-design
- id: encapsulation-meaning
  topic: oop-design
  difficulty: easy
  stem: |
    What does encapsulation mainly refer to?
  options:
    - Hiding internal state behind a controlled interface
    - A class inheriting from several parents
    - Compiling code into a package
    - Calling a method of the same name on different types
  correctIndexes: [0]
  explanation: |
    Keeping fields private lets a class protect its rules and change its internals freely.
  tags: [principles]
- id: composition-over-inheritance
  topic: oop-design
  difficulty: medium
  stem: |
    Why is composition often preferred over inheritance?
  options:
    - It always runs faster
    - It couples classes less tightly, and behaviour can be swapped more easily
    - It removes the need for interfaces
    - It makes all fields public
  correctIndexes: [1]
  explanation: |
    A subclass depends on its parent's details. A composed object only depends on its collaborator's
    interface.
  tags: [design]
- id: single-responsibility-meaning
  topic: oop-design
  difficulty: easy
  stem: |
    A class parses a file, computes totals, and writes a PDF report. Which principle does this most
    clearly break?
  options:
    - Single responsibility
    - Liskov substitution
    - Interface segregation
    - Don't repeat yourself
  correctIndexes: [0]
  explanation: |
    It has three separate reasons to change, so it should probably be three classes.
  tags: [solid]
- id: virtual-dispatch-output
  topic: oop-design
  difficulty: medium
  stem: |
    What does this Java code print?

    ```java
    class Animal { String speak() { return "generic"; } }
    class Dog extends Animal { @Override String speak() { return "woof"; } }

    Animal pet = new Dog();
    System.out.println(pet.speak());
    ```
  options: ['generic', 'woof', 'It does not compile', 'It throws an exception']
  correctIndexes: [1]
