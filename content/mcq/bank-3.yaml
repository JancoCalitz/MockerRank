    `.gitignore` only affects untracked files. Use `git rm --cached` to stop tracking the file.
  tags: [ignore]
- id: git-bisect-purpose
  topic: git
  difficulty: medium
  stem: |
    What does `git bisect` help you find?
  options:
    - The author of a single line
    - The commit that introduced a bug, using a binary search through history
    - Two branches that can be merged
    - Files larger than a set size
  correctIndexes: [1]
  explanation: |
    You mark commits as good or bad, and it halves the range each time. `git blame` is the one that shows a line's author.
  tags: [history]
- id: git-tag-purpose
  topic: git
  difficulty: easy
  stem: |
    What is a Git tag normally used for?
  options:
    - Merging two branches
    - Listing untracked files
    - Marking a specific commit, such as a release
    - Saving uncommitted changes
  correctIndexes: [2]
  explanation: |
    Unlike a branch, a tag does not move when new commits are added.
  tags: [tags]
- id: git-detached-head
  topic: git
  difficulty: hard
  stem: |
    You check out an old commit directly, and make a new commit. What is the risk?
  options:
    - All other branches are moved to it
    - The commit is pushed automatically
    - The old commit is deleted
    - No branch points to the new commit, so it is easy to lose when you switch away
  correctIndexes: [3]
  explanation: |
    This is a detached HEAD. Create a branch while you are there to keep the work.
  tags: [branches]

# testing
- id: test-isolation-reason
  topic: testing
  difficulty: medium
  stem: |
    Why should tests not depend on each other's state?
  options:
    - The compiler rejects such tests
    - It makes them use more disk space
    - Their results could change with the order they run in
    - Only one test can run per file otherwise
  correctIndexes: [2]
  explanation: |
    Tests that leak state can fail or pass misleadingly, and are hard to run in parallel or alone.
  tags: [structure]
- id: mock-overuse-risk
  topic: testing
  difficulty: medium
  stem: |
    What is a common risk of mocking almost everything in a test?
  options:
    - The test becomes too slow to run
    - The code stops compiling
    - The test can pass while the real parts do not work together
    - Coverage always drops to zero
  correctIndexes: [2]
  explanation: |
    Heavy mocking checks your assumptions about the other parts, and ties the test to implementation details.
  tags: [test-doubles]
- id: property-based-testing
  topic: testing
  difficulty: hard
  stem: |
    What does a property-based test do?
  options:
    - Reads settings from a properties file
    - Generates many inputs, and checks a rule that must hold for all of them
    - Tests only the getters and setters of a class
    - Compares output to one saved example
  correctIndexes: [1]
  explanation: |
    For example, sorting twice must equal sorting once. This often finds edge cases nobody thought to write.
  tags: [strategy]
- id: smoke-test-meaning
  topic: testing
  difficulty: easy
  stem: |
    What is a smoke test?
  options:
    - A test that the code is well formatted
    - A full test of every feature
    - A quick check that the most important functions basically work
    - A test of how the system handles very high load
  correctIndexes: [2]
  explanation: |
    It runs early, such as right after a deployment, to catch major breakage before spending time on more tests.
  tags: [strategy]
