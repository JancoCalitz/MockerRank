# debugging-code-reading
- id: python-dict-resize-iteration
  topic: debugging-code-reading
  difficulty: medium
  stem: |
    What happens when this Python code runs?

    ```python
    prices = {"a": 1, "b": 2}
    for key in prices:
        prices[key + "x"] = 0
    ```
  options:
    - It adds exactly two keys and stops
    - It adds the keys after the loop ends
    - It loops forever
    - It raises a RuntimeError, because the dictionary changes size during the loop
  correctIndexes: [3]
  explanation: |
    To change the keys as you go, loop over a copy, such as `list(prices)`.
  tags: [python]
- id: javascript-float-compare
  topic: debugging-code-reading
  difficulty: easy
  stem: |
    What does this JavaScript code print?

    ```javascript
    console.log(0.1 + 0.2 === 0.3);
    ```
  options: ['true', 'false', 'undefined', 'It throws an error']
  correctIndexes: [1]
  explanation: |
    Neither 0.1 nor 0.2 can be stored exactly in binary, so the sum differs slightly. Compare against a small tolerance.
  tags: [javascript, floating-point]
- id: cpp-size-minus-one
  topic: debugging-code-reading
  difficulty: hard
  stem: |
    What is the bug in this C++ code when `v` is empty?

    ```cpp
    for (size_t i = 0; i < v.size() - 1; i++) {
      use(v[i]);
    }
    ```
  options:
    - The loop does not compile for an empty vector
    - '`v.size() - 1` wraps around to a huge value, so the loop reads out of bounds'
    - The loop body is skipped, so there is no bug
    - The loop runs exactly once
  correctIndexes: [1]
  explanation: |
    `size()` is unsigned, so 0 minus 1 becomes the largest value. Write `i + 1 < v.size()` instead.
  tags: [cpp, unsigned]
- id: java-null-unboxing
  topic: debugging-code-reading
  difficulty: medium
  stem: |
    What happens when this Java code runs?

    ```java
    Map<String, Integer> counts = new HashMap<>();
    int total = counts.get("missing");
    ```
  options:
    - It throws a NullPointerException
    - It does not compile
    - '`total` becomes -1'
    - '`total` becomes 0'
  correctIndexes: [0]
  explanation: |
    `get` returns null for a missing key, and converting null to an int fails. `getOrDefault` avoids this.
  tags: [java]

