    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean);
      const text = [];
      let at = 1;
      for (let i = 0; i < Number(t[0]); i++) {
        if (t[at++] === 'TYPE') text.push(t[at++]);
        else text.pop();
      }
      console.log(text.length > 0 ? text.join('') : 'EMPTY');
