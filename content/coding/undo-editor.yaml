id: undo-editor
title: Undo Editor
type: short
style: stdin
difficulty: easy
statement: |
  A tiny editor starts with empty text and handles two commands:

  - `TYPE c` adds the letter `c` to the end of the text.
  - `UNDO` removes the last letter that is still in the text. If the text is empty, nothing happens.

  Print the final text, or `EMPTY` if the text ends up empty.
inputFormat: |
  The first line contains `q`, the number of commands.

  Each of the next `q` lines contains a command.
outputFormat: |
  The final text, or `EMPTY`.
constraints: |
  - 1 <= q <= 150000
  - `c` is a lowercase letter.
sampleTests:
  - input: |
      4
      TYPE a
      TYPE b
      UNDO
      TYPE c
    output: |
      ac
  - input: |
      2
      UNDO
      TYPE z
    output: |
      z
hiddenTests:
  - input: |
      1
      UNDO
    output: |
      EMPTY
    weight: 2
  - input: |
      3
      TYPE a
      UNDO
      UNDO
    output: |
      EMPTY
  - input: |
      2
      TYPE a
      TYPE a
    output: |
      aa
  - file: undo-editor-large
    weight: 3
checker:
  type: exact
editorial: |
  Treat the text as a stack of letters: `TYPE` pushes, and `UNDO` pops if there is anything to pop. Each command takes O(1) time. Rebuilding an
  immutable string on each command takes O(n) time per command, which can be too slow. Do not forget the empty case, either
  when undoing or when printing.
tags: [stack]
topics: [stacks-queues]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;
      using System.Text;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int q = int.Parse(t[0]), at = 1;
              var text = new StringBuilder();
              for (int i = 0; i < q; i++)
              {
                  if (t[at++] == "TYPE") text.Append(t[at++]);
                  else if (text.Length > 0) text.Length--;
              }
              Console.WriteLine(text.Length > 0 ? text.ToString() : "EMPTY");
          }
      }
  java:
    starter: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              // Read from System.in and write to System.out.
          }
      }
    solution: |
      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int q = Integer.parseInt(t[0]), at = 1;
              StringBuilder text = new StringBuilder();
              for (int i = 0; i < q; i++) {
                  if (t[at++].equals("TYPE")) {
                      text.append(t[at++]);
                  } else if (text.length() > 0) {
                      text.setLength(text.length() - 1);
                  }
              }
              System.out.println(text.length() > 0 ? text.toString() : "EMPTY");
          }
      }
  cpp:
    starter: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          // Read from cin and write to cout.
          return 0;
      }
    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int q;
          cin >> q;
          string text, command, letter;
          for (int i = 0; i < q; i++) {
              cin >> command;
              if (command == "TYPE") {
                  cin >> letter;
                  text += letter;
              } else if (!text.empty()) {
                  text.pop_back();
              }
          }
          cout << (text.empty() ? "EMPTY" : text) << endl;
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <string.h>

      static char text[150002];

      int main(void) {
          int q, length = 0;
          scanf("%d", &q);
          for (int i = 0; i < q; i++) {
              char command[8], letter[4];
              scanf("%7s", command);
              if (strcmp(command, "TYPE") == 0) {
                  scanf("%3s", letter);
                  text[length++] = letter[0];
              } else if (length > 0) {
                  length--;
              }
          }
          text[length] = 0;
          puts(length > 0 ? text : "EMPTY");
          return 0;
      }
