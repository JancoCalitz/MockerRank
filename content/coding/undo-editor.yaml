    solution: |
      import { readFileSync } from 'node:fs';

      const t: string[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean);
      const text: string[] = [];
      let at = 1;
      for (let i = 0; i < Number(t[0]); i++) {
        if (t[at++] === 'TYPE') text.push(t[at++]!);
        else text.pop();
      }
      console.log(text.length > 0 ? text.join('') : 'EMPTY');
  python:
    starter: |
      import sys

      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import sys

      t = sys.stdin.read().split()
      text = []
      at = 1
      for _ in range(int(t[0])):
          command = t[at]
          at += 1
          if command == 'TYPE':
              text.append(t[at])
              at += 1
          elif text:
              text.pop()
      print(''.join(text) if text else 'EMPTY')
