    solution: |
      import sys

      t = [int(x) for x in sys.stdin.read().split()]
      stack = [(1, t[1])]
      best = None
      while stack:
          node, total = stack.pop()
          left, right = t[3 * node - 1], t[3 * node]
          if left == 0 and right == 0 and (best is None or total > best):
              best = total
          if left:
              stack.append((left, total + t[3 * left - 2]))
          if right:
              stack.append((right, total + t[3 * right - 2]))
      print(best)
