    solution: |
      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]), top = 0;
              long best = Long.MIN_VALUE;
              int[] stack = new int[n + 1];
              long[] totals = new long[n + 1];
              stack[top++] = 1;
              totals[1] = Integer.parseInt(t[1]);
              while (top > 0) {
                  int node = stack[--top];
                  int left = Integer.parseInt(t[3 * node - 1]), right = Integer.parseInt(t[3 * node]);
                  if (left == 0 && right == 0) {
                      best = Math.max(best, totals[node]);
                  }
                  if (left != 0) {
                      totals[left] = totals[node] + Integer.parseInt(t[3 * left - 2]);
                      stack[top++] = left;
                  }
                  if (right != 0) {
                      totals[right] = totals[node] + Integer.parseInt(t[3 * right - 2]);
                      stack[top++] = right;
                  }
              }
              System.out.println(best);
          }
      }
  cpp:
    starter: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          // Read from cin and write to cout.
          return 0;
      }
    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n;
          cin >> n;
          vector<int> value(n + 1), left(n + 1), right(n + 1);
          for (int i = 1; i <= n; i++) cin >> value[i] >> left[i] >> right[i];
          long long best = LLONG_MIN;
          vector<pair<int, long long>> stack;
          stack.push_back({1, value[1]});
          while (!stack.empty()) {
              auto [node, total] = stack.back();
              stack.pop_back();
              if (left[node] == 0 && right[node] == 0) best = max(best, total);
              if (left[node] != 0) stack.push_back({left[node], total + value[left[node]]});
              if (right[node] != 0) stack.push_back({right[node], total + value[right[node]]});
          }
          cout << best << endl;
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <limits.h>
      #include <stdio.h>
      #include <stdlib.h>

      int main(void) {
          int n, top = 0;
          scanf("%d", &n);
          int *value = malloc(sizeof(int) * (n + 1)), *left = malloc(sizeof(int) * (n + 1));
          int *right = malloc(sizeof(int) * (n + 1)), *stack = malloc(sizeof(int) * (n + 1));
          long long *totals = malloc(sizeof(long long) * (n + 1));
          for (int i = 1; i <= n; i++) scanf("%d %d %d", &value[i], &left[i], &right[i]);
          long long best = LLONG_MIN;
          stack[top++] = 1;
          totals[1] = value[1];
          while (top > 0) {
              int node = stack[--top];
              if (left[node] == 0 && right[node] == 0 && totals[node] > best) best = totals[node];
              if (left[node] != 0) {
                  totals[left[node]] = totals[node] + value[left[node]];
                  stack[top++] = left[node];
              }
              if (right[node] != 0) {
                  totals[right[node]] = totals[node] + value[right[node]];
                  stack[top++] = right[node];
              }
          }
          printf("%lld\n", best);
          return 0;
      }
  javascript:
    starter: |
      const input = require('fs').readFileSync(0, 'utf8');
      // Parse the input and print the answer with console.log.
    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const value = (node) => t[3 * node - 2];
      const stack = [[1, value(1)]];
      let best = -Infinity;
      while (stack.length > 0) {
        const [node, total] = stack.pop();
        const left = t[3 * node - 1];
        const right = t[3 * node];
        if (left === 0 && right === 0) best = Math.max(best, total);
        if (left !== 0) stack.push([left, total + value(left)]);
        if (right !== 0) stack.push([right, total + value(right)]);
      }
      console.log(best);
