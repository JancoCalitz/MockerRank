    solution: |
      import { readFileSync } from 'node:fs';

      const t: number[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const value = (node: number): number => t[3 * node - 2]!;
      const stack: [number, number][] = [[1, value(1)]];
      let best = -Infinity;
      while (stack.length > 0) {
        const [node, total] = stack.pop()!;
        const left = t[3 * node - 1]!;
        const right = t[3 * node]!;
        if (left === 0 && right === 0) best = Math.max(best, total);
        if (left !== 0) stack.push([left, total + value(left)]);
        if (right !== 0) stack.push([right, total + value(right)]);
      }
      console.log(best);
  python:
    starter: |
