id: heaviest-path
title: Heaviest Path
type: short
style: stdin
difficulty: medium
statement: |
  A binary tree's nodes hold whole numbers, which can be negative. A path starts at the root, node 1, and goes down to a leaf, which is a node with no
  children. Find the largest total of the values along any such path.
inputFormat: |
  The first line contains `n`.

  Each of the next `n` lines describes nodes `1` to `n`, with the node's `value`, `left` child, and `right` child. A child of `0` means there is no such child.
outputFormat: |
  The largest path total.
constraints: |
  - 1 <= n <= 200000
  - -1000 <= value <= 1000
  - The nodes form one binary tree with node 1 as its root.
sampleTests:
  - input: |
      3
      1 2 3
      2 0 0
      3 0 0
    output: |
      4
  - input: |
      1
      -5 0 0
    output: |
      -5
hiddenTests:
  - input: |
      2
      5 0 2
      -9 0 0
    output: |
      -4
    weight: 2
  - input: |
      3
      -1 2 3
      -2 0 0
      -3 0 0
    output: |
      -3
  - input: |
      5
      1 2 3
      10 4 0
      1 0 5
      -20 0 0
      100 0 0
    output: |
      102
    weight: 2
  - file: heaviest-path-large
    weight: 3
checker:
  type: exact
editorial: |
  Search from the root with an explicit stack, carrying the total so far. When you reach a leaf, compare its total with the best one. Start the best at the lowest
  possible value rather than 0, because every path can be negative. Only leaves count, so a path cannot stop early at a higher total. This takes O(n) time. A recursive
  search can overflow the call stack on a very deep tree.
tags: [trees, dfs]
topics: [trees-graphs]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), top = 0;
              long best = long.MinValue;
              var stack = new int[n + 1];
              var totals = new long[n + 1];
              stack[top++] = 1;
              totals[1] = int.Parse(t[1]);
              while (top > 0)
              {
                  int node = stack[--top];
                  int left = int.Parse(t[3 * node - 1]), right = int.Parse(t[3 * node]);
                  if (left == 0 && right == 0) best = Math.Max(best, totals[node]);
                  if (left != 0)
                  {
                      totals[left] = totals[node] + int.Parse(t[3 * left - 2]);
                      stack[top++] = left;
                  }
                  if (right != 0)
                  {
                      totals[right] = totals[node] + int.Parse(t[3 * right - 2]);
                      stack[top++] = right;
                  }
              }
              Console.WriteLine(best);
          }
      }
