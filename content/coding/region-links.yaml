      import { readFileSync } from 'node:fs';

      const t: string[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean);
      const n = Number(t[0]);
      const q = Number(t[1]);
      const parent: number[] = Array.from({ length: n + 1 }, (_, i) => i);
      function find(x: number): number {
        while (parent[x] !== x) {
          parent[x] = parent[parent[x]!]!;
          x = parent[x]!;
        }
        return x;
      }
      const output: string[] = [];
      let groups = n;
      for (let i = 0; i < q; i++) {
        const a = find(Number(t[3 + 3 * i]));
        const b = find(Number(t[4 + 3 * i]));
        if (t[2 + 3 * i] === 'SAME') output.push(a === b ? 'YES' : 'NO');
