id: region-links
title: Region Links
type: long
style: stdin
difficulty: medium
statement: |
  A network starts with `n` separate computers. It handles two commands, in order:

  - `LINK a b` connects computers `a` and `b` with a cable.
  - `SAME a b` prints `YES` if `a` and `b` can currently reach each other through cables, or `NO` if they cannot.

  After all of the commands, print the number of separate groups of computers.
inputFormat: |
  The first line contains `n` and `q`, the number of commands.

  Each of the next `q` lines contains a command.
outputFormat: |
  One line for each `SAME` command, then one line with the number of groups.
constraints: |
  - 1 <= n, q <= 100000
  - 1 <= a, b <= n
sampleTests:
  - input: |
      4 4
      LINK 1 2
      SAME 1 2
      SAME 1 3
      LINK 3 4
    output: |
      YES
      NO
      2
  - input: |
      1 1
      SAME 1 1
    output: |
      YES
      1
hiddenTests:
  - input: |
      3 1
      LINK 1 1
    output: |
      3
  - input: |
      3 3
      LINK 1 2
      LINK 2 1
      SAME 2 3
    output: |
      NO
      2
  - input: |
      5 5
      LINK 1 2
      LINK 3 4
      LINK 2 3
      SAME 1 4
      SAME 5 1
    output: |
      YES
      NO
      2
    weight: 2
  - file: region-links-large
    weight: 3
checker:
  type: exact
editorial: |
  Use a union-find structure. Each group is a tree, and two computers are in the same group when their trees have the
  same root. Path compression, which makes each node visited on the way to the root point closer to it, makes each
  command nearly O(1). Searching the graph for each `SAME` takes O(n) time per command, and relabelling a whole group
  on each `LINK` is just as slow. Linking two computers already in one group must not reduce the count. Write `find`
  with a loop, because a chain of 100000 computers can overflow the call stack with recursion.
tags: [union-find]
topics: [trees-graphs]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;
      using System.Text;

      class Solution
      {
          static int[] parent;

          static int Find(int x)
          {
              while (parent[x] != x)
              {
                  parent[x] = parent[parent[x]];
                  x = parent[x];
              }
              return x;
          }

          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), q = int.Parse(t[1]), groups = n;
              parent = new int[n + 1];
              for (int i = 1; i <= n; i++) parent[i] = i;
              var output = new StringBuilder();
              for (int i = 0; i < q; i++)
              {
                  int a = Find(int.Parse(t[3 + 3 * i])), b = Find(int.Parse(t[4 + 3 * i]));
                  if (t[2 + 3 * i] == "SAME") output.Append(a == b ? "YES\n" : "NO\n");
                  else if (a != b)
                  {
                      parent[a] = b;
                      groups--;
                  }
              }
              output.Append(groups);
              Console.WriteLine(output);
          }
      }
