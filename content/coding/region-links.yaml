    solution: |
      import sys

      t = sys.stdin.read().split()
      n, q = int(t[0]), int(t[1])
      parent = list(range(n + 1))


      def find(x):
          while parent[x] != x:
              parent[x] = parent[parent[x]]
              x = parent[x]
          return x


      groups = n
      output = []
      for i in range(q):
          a, b = find(int(t[3 + 3 * i])), find(int(t[4 + 3 * i]))
          if t[2 + 3 * i] == 'SAME':
              output.append('YES' if a == b else 'NO')
          elif a != b:
              parent[a] = b
              groups -= 1
      output.append(str(groups))
      print('\n'.join(output))
