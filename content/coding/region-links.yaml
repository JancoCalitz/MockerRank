  cpp:
    starter: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          // Read from cin and write to cout.
          return 0;
      }
    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      vector<int> parent;

      int findRoot(int x) {
          while (parent[x] != x) {
              parent[x] = parent[parent[x]];
              x = parent[x];
          }
          return x;
      }

      int main() {
          int n, q;
          cin >> n >> q;
          int groups = n;
          parent.resize(n + 1);
          iota(parent.begin(), parent.end(), 0);
          string output;
          for (int i = 0; i < q; i++) {
              string command;
              int a, b;
              cin >> command >> a >> b;
              a = findRoot(a);
              b = findRoot(b);
              if (command == "SAME") {
                  output += a == b ? "YES\n" : "NO\n";
              } else if (a != b) {
                  parent[a] = b;
                  groups--;
              }
          }
          cout << output << groups << endl;
          return 0;
      }
