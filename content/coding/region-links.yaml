      #include <string.h>

      static int parent[100001];

      static int findRoot(int x) {
          while (parent[x] != x) {
              parent[x] = parent[parent[x]];
              x = parent[x];
          }
          return x;
      }

      int main(void) {
          int n, q;
          scanf("%d %d", &n, &q);
          int groups = n;
          for (int i = 1; i <= n; i++) parent[i] = i;
          for (int i = 0; i < q; i++) {
              char command[8];
              int a, b;
              scanf("%7s %d %d", command, &a, &b);
              a = findRoot(a);
              b = findRoot(b);
              if (strcmp(command, "SAME") == 0) {
                  puts(a == b ? "YES" : "NO");
