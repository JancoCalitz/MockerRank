    solution: |
      import sys

      t = sys.stdin.read().split()
      n = int(t[0])
      temps = [int(x) for x in t[1:1 + n]]
      stack = []
      wait = [0] * n
      for i, temp in enumerate(temps):
          while stack and temps[stack[-1]] < temp:
              day = stack.pop()
              wait[day] = i - day
          stack.append(i)
      print(' '.join(map(str, wait)))
