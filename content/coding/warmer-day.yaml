    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n;
          cin >> n;
          vector<int> temps(n), stack, wait(n);
          for (int i = 0; i < n; i++) {
              cin >> temps[i];
              while (!stack.empty() && temps[stack.back()] < temps[i]) {
                  wait[stack.back()] = i - stack.back();
                  stack.pop_back();
              }
              stack.push_back(i);
          }
          for (int i = 0; i < n; i++) cout << wait[i] << (i + 1 < n ? ' ' : '\n');
          return 0;
      }
