id: warmer-day
title: Next Warmer Day
type: short
style: stdin
difficulty: medium
statement: |
  Given a list of daily temperatures, find out how many days each day must wait for a strictly warmer
  one. If no warmer day follows, the answer for that day is `0`.
inputFormat: |
  The first line contains `n`.

  The second line contains `n` temperatures.
outputFormat: |
  `n` values separated by spaces, one for each day.
constraints: |
  - 1 <= n <= 200000
  - 0 <= temperature <= 100000
sampleTests:
  - input: |
      6
      30 32 31 31 35 20
    output: |
      1 3 2 1 0 0
  - input: |
      1
      5
    output: |
      0
hiddenTests:
  - input: |
      3
      9 8 7
    output: |
      0 0 0
  - input: |
      3
      1 2 3
    output: |
      1 1 0
  - input: |
      4
      5 5 5 6
    output: |
      3 2 1 0
  - file: warmer-day-large
    weight: 3
checker:
  type: exact
editorial: |
  Keep a stack of the days still waiting for a warmer one. Their temperatures never increase from the
  bottom of the stack to the top. For each new day, pop every colder day and record its wait, then push the
  new day. Each day is pushed and popped at most once, so this takes O(n) time. Scanning forward from each
  day takes O(n^2) time when the temperatures fall.
tags: [monotonic-stack]
topics: [stacks-queues]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), top = 0;
              var temps = new int[n];
              var stack = new int[n];
              var wait = new int[n];
              for (int i = 0; i < n; i++)
              {
                  temps[i] = int.Parse(t[1 + i]);
                  while (top > 0 && temps[stack[top - 1]] < temps[i])
                  {
                      top--;
                      wait[stack[top]] = i - stack[top];
                  }
                  stack[top++] = i;
              }
              Console.WriteLine(string.Join(" ", wait));
          }
      }
