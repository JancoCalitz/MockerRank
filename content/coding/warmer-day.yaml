    solution: |
      import { readFileSync } from 'node:fs';

      const t: number[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const n = t[0]!;
      const stack: number[] = [];
      const wait: number[] = new Array<number>(n).fill(0);
      for (let i = 0; i < n; i++) {
        while (stack.length > 0 && t[1 + stack[stack.length - 1]!]! < t[1 + i]!) {
          const day = stack.pop()!;
          wait[day] = i - day;
        }
        stack.push(i);
      }
      console.log(wait.join(' '));
  python:
