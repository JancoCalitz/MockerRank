    solution: |
      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]), top = 0;
              int[] temps = new int[n], stack = new int[n], wait = new int[n];
              for (int i = 0; i < n; i++) {
                  temps[i] = Integer.parseInt(t[1 + i]);
                  while (top > 0 && temps[stack[top - 1]] < temps[i]) {
                      top--;
                      wait[stack[top]] = i - stack[top];
                  }
                  stack[top++] = i;
              }
              StringBuilder out = new StringBuilder();
              for (int i = 0; i < n; i++) {
                  out.append(wait[i]).append(i + 1 < n ? " " : "");
              }
              System.out.println(out);
          }
      }
