    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      int main(void) {
          int n, top = 0;
          scanf("%d", &n);
          int *temps = malloc(sizeof(int) * n), *stack = malloc(sizeof(int) * n);
          int *wait = calloc(n, sizeof(int));
          for (int i = 0; i < n; i++) {
              scanf("%d", &temps[i]);
              while (top > 0 && temps[stack[top - 1]] < temps[i]) {
                  top--;
                  wait[stack[top]] = i - stack[top];
              }
              stack[top++] = i;
          }
          for (int i = 0; i < n; i++) printf("%d%c", wait[i], i + 1 < n ? ' ' : '\n');
          return 0;
      }
  javascript:
    starter: |
