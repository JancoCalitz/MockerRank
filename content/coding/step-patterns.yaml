    solution: |
      import sys

      n, m = map(int, sys.stdin.read().split())
      MOD = 1000000007
      ways = [0] * (n + 1)
      ways[0] = 1
      total = 0
      for i in range(1, n + 1):
          total = (total + ways[i - 1]) % MOD
          if i - m - 1 >= 0:
              total = (total - ways[i - m - 1]) % MOD
          ways[i] = total
      print(ways[n])
