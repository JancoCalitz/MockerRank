      const [n, m] = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const MOD = 1000000007;
      const ways = new Array(n + 1).fill(0);
      ways[0] = 1;
      let window_ = 0;
      for (let i = 1; i <= n; i++) {
        window_ = (window_ + ways[i - 1]) % MOD;
        if (i - m - 1 >= 0) window_ = (window_ - ways[i - m - 1] + MOD) % MOD;
        ways[i] = window_;
      }
      console.log(ways[n]);
