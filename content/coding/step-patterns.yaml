id: step-patterns
title: Step Patterns
type: short
style: stdin
difficulty: medium
statement: |
  You climb a staircase of `n` steps, and each move goes up between `1` and `m` steps. Count the different
  sequences of moves that reach the top exactly. The count can be huge, so print it modulo `1000000007`.
inputFormat: |
  One line containing `n` and `m`.
outputFormat: |
  The number of sequences, modulo `1000000007`.
constraints: |
  - 1 <= n, m <= 200000
sampleTests:
  - input: |
      4 2
    output: |
      5
  - input: |
      3 3
    output: |
      4
hiddenTests:
  - input: |
      1 5
    output: |
      1
  - input: |
      5 1
    output: |
      1
  - input: |
      6 3
    output: |
      24
  - input: |
      50 2
    output: |
      365010934
  - file: step-patterns-large
    weight: 3
checker:
  type: exact
editorial: |
  Let `ways[i]` be the number of sequences that reach step `i`, with `ways[0] = 1`. Then `ways[i]` is the sum of the
  previous `m` values. Adding them up each time takes O(nm) time, which is too slow. Keep a running total of the
  last `m` values instead, adding the newest and subtracting the one that drops out, for O(n) time. Keep the
  total in range when subtracting under the modulus.
tags: [dp, prefix-sums]
topics: [recursion-dp]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), m = int.Parse(t[1]);
              const long Mod = 1000000007;
              var ways = new long[n + 1];
              ways[0] = 1;
              long window = 0;
              for (int i = 1; i <= n; i++)
              {
                  window = (window + ways[i - 1]) % Mod;
                  if (i - m - 1 >= 0) window = (window - ways[i - m - 1] + Mod) % Mod;
                  ways[i] = window;
              }
              Console.WriteLine(ways[n]);
          }
      }
