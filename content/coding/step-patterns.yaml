      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      int main(void) {
          int n, m;
          scanf("%d %d", &n, &m);
          const long long MOD = 1000000007;
          long long *ways = calloc(n + 1, sizeof(long long));
          ways[0] = 1;
          long long window = 0;
          for (int i = 1; i <= n; i++) {
              window = (window + ways[i - 1]) % MOD;
              if (i - m - 1 >= 0) window = (window - ways[i - m - 1] + MOD) % MOD;
              ways[i] = window;
          }
          printf("%lld\n", ways[n]);
          free(ways);
          return 0;
      }
