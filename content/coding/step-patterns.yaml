      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]), m = Integer.parseInt(t[1]);
              final long MOD = 1000000007L;
              long[] ways = new long[n + 1];
              ways[0] = 1;
              long window = 0;
              for (int i = 1; i <= n; i++) {
                  window = (window + ways[i - 1]) % MOD;
                  if (i - m - 1 >= 0) {
                      window = (window - ways[i - m - 1] + MOD) % MOD;
                  }
                  ways[i] = window;
              }
              System.out.println(ways[n]);
          }
      }
