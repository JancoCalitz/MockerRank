      import { readFileSync } from 'node:fs';

      const t: number[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const n = t[0]!;
      const m = t[1]!;
      const MOD = 1000000007;
      const ways: number[] = new Array<number>(n + 1).fill(0);
      ways[0] = 1;
      let total = 0;
      for (let i = 1; i <= n; i++) {
