    solution: |
      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              int n = Integer.parseInt(new String(System.in.readAllBytes()).trim()), count = 0;
              boolean[] composite = new boolean[n + 1];
              for (long i = 2; i <= n; i++) {
                  if (composite[(int) i]) {
                      continue;
                  }
                  count++;
                  for (long j = i * i; j <= n; j += i) {
                      composite[(int) j] = true;
                  }
              }
              System.out.println(count);
          }
      }
