      static char composite[3000001];

      int main(void) {
          int n, count = 0;
          scanf("%d", &n);
          for (long long i = 2; i <= n; i++) {
              if (composite[i]) continue;
              count++;
              for (long long j = i * i; j <= n; j += i) composite[j] = 1;
          }
          printf("%d\n", count);
          return 0;
      }
