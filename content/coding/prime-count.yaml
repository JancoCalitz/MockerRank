id: prime-count
title: Prime Count
type: short
style: stdin
difficulty: medium
statement: |
  Count the prime numbers from `1` to `n`, including `n`. A prime number has exactly two divisors, `1` and itself.
inputFormat: |
  One line containing `n`.
outputFormat: |
  The number of primes up to `n`.
constraints: |
  - 1 <= n <= 3000000
sampleTests:
  - input: |
      10
    output: |
      4
  - input: |
      1
    output: |
      0
hiddenTests:
  - input: |
      2
    output: |
      1
  - input: |
      3
    output: |
      2
  - input: |
      100
    output: |
      25
    weight: 2
  - input: |
      1000
    output: |
      168
  - file: prime-count-large
    weight: 3
checker:
  type: exact
editorial: |
  Use the Sieve of Eratosthenes. Go through the numbers in order, and each time you find a number that is not crossed out, count it as prime and cross out its
  multiples, starting from its square. This takes O(n log log n) time. Testing each number by trial division up to its square root takes about O(n * sqrt(n)) time, which is much slower.
tags: [sieve, math]
topics: [big-o]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              int n = int.Parse(Console.In.ReadToEnd().Trim()), count = 0;
              var composite = new bool[n + 1];
              for (long i = 2; i <= n; i++)
              {
                  if (composite[i]) continue;
                  count++;
                  for (long j = i * i; j <= n; j += i) composite[j] = true;
              }
              Console.WriteLine(count);
          }
      }
