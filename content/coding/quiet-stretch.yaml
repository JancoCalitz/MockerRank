    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const [n, limit] = t;
      let best = 0;
      let run = 0;
      for (let i = 0; i < n; i++) {
        run = t[2 + i] <= limit ? run + 1 : 0;
        best = Math.max(best, run);
      }
      console.log(best);
