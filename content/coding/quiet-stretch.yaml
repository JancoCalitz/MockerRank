    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n, limit, value, best = 0, run = 0;
          cin >> n >> limit;
          for (int i = 0; i < n; i++) {
              cin >> value;
              run = value <= limit ? run + 1 : 0;
              best = max(best, run);
          }
          cout << best << endl;
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int n, limit, value, best = 0, run = 0;
          scanf("%d %d", &n, &limit);
          for (int i = 0; i < n; i++) {
              scanf("%d", &value);
              run = value <= limit ? run + 1 : 0;
              if (run > best) best = run;
          }
          printf("%d\n", best);
          return 0;
      }
