  python:
    starter: |
      import sys

      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import sys

      t = sys.stdin.read().split()
      n, limit = int(t[0]), int(t[1])
      best = run = 0
      for value in t[2:2 + n]:
          run = run + 1 if int(value) <= limit else 0
          best = max(best, run)
      print(best)
