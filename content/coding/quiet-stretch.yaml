    solution: |
      #include <stdio.h>

      int main(void) {
          int n, limit, value, best = 0, run = 0;
          scanf("%d %d", &n, &limit);
          for (int i = 0; i < n; i++) {
              scanf("%d", &value);
              run = value <= limit ? run + 1 : 0;
              if (run > best) best = run;
          }
          printf("%d\n", best);
          return 0;
      }
