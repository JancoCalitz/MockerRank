id: quiet-stretch
title: Quiet Stretch
type: short
style: stdin
difficulty: easy
statement: |
  A library records its noise level once a minute. Find the longest unbroken stretch of minutes
  where every reading is at or below a limit.
inputFormat: |
  The first line contains `n` and `limit`.

  The second line contains `n` readings.
outputFormat: |
  The length of the longest stretch, or `0` if no reading is at or below the limit.
constraints: |
  - 1 <= n <= 200000
  - 0 <= limit, reading <= 1000000
sampleTests:
  - input: |
      6 5
      1 7 3 4 5 9
    output: |
      3
  - input: |
      3 0
      1 2 3
    output: |
      0
hiddenTests:
  - input: |
      4 10
      1 2 3 4
    output: |
      4
  - input: |
      1 5
      5
    output: |
      1
  - input: |
      5 3
      4 3 4 3 3
    output: |
      2
  - input: |
      5 3
      3 3 9 9 9
    output: |
      2
  - file: quiet-stretch-large
    weight: 3
checker:
  type: exact
editorial: |
  Scan once, keeping the length of the current run. Reset it to 0 at any reading over the limit, and
  track the largest value seen. This takes O(n) time and O(1) space. A common mistake is treating
  the limit as exclusive.
tags: [arrays, scanning]
topics: [arrays-strings]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), limit = int.Parse(t[1]), best = 0, run = 0;
              for (int i = 0; i < n; i++)
              {
                  run = int.Parse(t[2 + i]) <= limit ? run + 1 : 0;
                  best = Math.Max(best, run);
              }
              Console.WriteLine(best);
          }
      }
  java:
    starter: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              // Read from System.in and write to System.out.
          }
      }
    solution: |
      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]), limit = Integer.parseInt(t[1]), best = 0, run = 0;
              for (int i = 0; i < n; i++) {
                  run = Integer.parseInt(t[2 + i]) <= limit ? run + 1 : 0;
                  best = Math.max(best, run);
              }
              System.out.println(best);
          }
      }
