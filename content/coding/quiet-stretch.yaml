      import { readFileSync } from 'node:fs';

      const t: number[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const n = t[0]!;
      const limit = t[1]!;
      let best = 0;
      let run = 0;
      for (let i = 0; i < n; i++) {
        run = t[2 + i]! <= limit ? run + 1 : 0;
