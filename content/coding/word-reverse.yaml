id: word-reverse
title: Reverse the Words
type: short
style: stdin
difficulty: easy
statement: |
  A subtitle tool needs a line's words in reverse order, with exactly one space between words. The input can have extra
  spaces, which do not appear in the output.
inputFormat: |
  One line of text containing at least one word.
outputFormat: |
  The words in reverse order, separated by single spaces.
constraints: |
  - 1 <= length of the line <= 200000
  - Words contain only letters and digits.
sampleTests:
  - input: |
      the quick fox
    output: |
      fox quick the
  - input: |
      solo
    output: |
      solo
hiddenTests:
  - input: |
      a   b
    output: |
      b a
    weight: 2
  - input: |
      one two
    output: |
      two one
  - input: |
      x y z w
    output: |
      w z y x
  - file: word-reverse-large
    weight: 3
checker:
  type: exact
editorial: |
  Split the line on any run of spaces, reverse the list of words, and join them with one space. This takes O(n) time. The common
  mistakes are splitting on a single space, which creates empty words, and building the result by repeatedly adding to the
  start of a string.
tags: [strings]
topics: [arrays-strings]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var words = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              Array.Reverse(words);
              Console.WriteLine(string.Join(" ", words));
          }
      }
  java:
    starter: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              // Read from System.in and write to System.out.
          }
      }
    solution: |
      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] words = new String(System.in.readAllBytes()).trim().split("\\s+");
              StringBuilder output = new StringBuilder();
              for (int i = words.length - 1; i >= 0; i--) {
                  output.append(words[i]);
                  if (i > 0) {
                      output.append(' ');
                  }
              }
              System.out.println(output);
          }
      }
  cpp:
    starter: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          // Read from cin and write to cout.
          return 0;
      }
    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          vector<string> words;
          string word;
          while (cin >> word) words.push_back(word);
          for (int i = words.size() - 1; i >= 0; i--) cout << words[i] << (i > 0 ? ' ' : '\n');
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <string.h>

      static char line[200005];
      static char *words[100005];

      int main(void) {
          int count = 0;
          if (!fgets(line, sizeof line, stdin)) return 0;
          for (char *word = strtok(line, " \r\n"); word; word = strtok(NULL, " \r\n")) words[count++] = word;
          for (int i = count - 1; i >= 0; i--) printf("%s%c", words[i], i > 0 ? ' ' : '\n');
          return 0;
      }
  javascript:
    starter: |
      const input = require('fs').readFileSync(0, 'utf8');
      // Parse the input and print the answer with console.log.
    solution: |
      const words = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean);
      console.log(words.reverse().join(' '));
