    solution: |
      public static int LongestRise(int[] values)
      {
          var ends = new int[values.Length];
          int length = 0;
          foreach (int value in values)
          {
              int low = 0, high = length;
              while (low < high)
              {
                  int mid = low + (high - low) / 2;
                  if (ends[mid] < value) low = mid + 1;
                  else high = mid;
              }
              ends[low] = value;
              if (low == length) length++;
          }
          return length;
      }
