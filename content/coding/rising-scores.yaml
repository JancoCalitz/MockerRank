      t = sys.stdin.read().split()
      n = int(t[0])
      values = [int(x) for x in t[1:1 + n]]
      print(longest_rise(values))
    solution: |
      from bisect import bisect_left


      def longest_rise(values):
          ends = []
          for value in values:
              place = bisect_left(ends, value)
              if place == len(ends):
                  ends.append(value)
              else:
                  ends[place] = value
          return len(ends)
