      int longestRise(const vector<int>& values) {
          vector<int> ends;
          for (int value : values) {
              auto place = lower_bound(ends.begin(), ends.end(), value);
              if (place == ends.end()) ends.push_back(value);
              else *place = value;
          }
          return ends.size();
      }
