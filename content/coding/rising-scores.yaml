      int longestRise(const int *values, int n) {
          int *ends = malloc(sizeof(int) * (n + 1));
          int length = 0;
          for (int i = 0; i < n; i++) {
              int low = 0, high = length;
              while (low < high) {
                  int mid = low + (high - low) / 2;
                  if (ends[mid] < values[i]) low = mid + 1;
                  else high = mid;
              }
              ends[low] = values[i];
              if (low == length) length++;
          }
          free(ends);
          return length;
      }
