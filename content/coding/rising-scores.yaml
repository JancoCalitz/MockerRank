id: rising-scores
title: Rising Scores
type: long
style: function
difficulty: hard
statement: |
  A coach has a player's scores in the order they were achieved. The coach can pick any scores, keeping their order,
  and wants each picked score to be strictly higher than the one before it. The picked scores do not have to be next to
  each other.

  Complete the function `longestRise`, which returns the largest number of scores that can be picked.

  The provided code reads the input and prints your function's return value.
inputFormat: |
  The first line contains `n`.

  The second line contains `n` scores.
outputFormat: |
  The largest number of scores.
constraints: |
  - 1 <= n <= 200000
  - 0 <= score <= 1000000000
sampleTests:
  - input: |
      6
      10 9 2 5 3 7
    output: |
      3
  - input: |
      4
      7 7 7 7
    output: |
      1
hiddenTests:
  - input: |
      1
      5
    output: |
      1
  - input: |
      5
      1 2 3 4 5
    output: |
      5
  - input: |
      5
      5 4 3 2 1
    output: |
      1
  - input: |
      8
      0 8 4 12 2 10 6 14
    output: |
      4
    weight: 2
  - file: rising-scores-large
    weight: 3
checker:
  type: exact
editorial: |
  This is the longest increasing subsequence. The usual dynamic programming solution compares each score to all earlier
  ones and takes O(n^2) time, which is too slow here. Instead, keep an array where entry `i` is the smallest score that
  can end a rising run of length `i + 1`. This array is always sorted. For each score, binary search for the first entry at
  or above it and replace that entry, or append the score if there is none. The array's final length is the answer, and
  this takes O(n log n) time. The array itself is not necessarily a valid run of scores.
tags: [dp, binary-search]
topics: [recursion-dp, sorting-searching]
