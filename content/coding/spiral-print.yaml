    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int rows, cols;
          cin >> rows >> cols;
          vector<vector<int>> grid(rows, vector<int>(cols));
          for (auto& row : grid) {
              for (int& cell : row) cin >> cell;
          }
          int top = 0, bottom = rows - 1, left = 0, right = cols - 1;
          vector<int> output;
          while (top <= bottom && left <= right) {
              for (int c = left; c <= right; c++) output.push_back(grid[top][c]);
              top++;
              for (int r = top; r <= bottom; r++) output.push_back(grid[r][right]);
              right--;
              if (top <= bottom) {
                  for (int c = right; c >= left; c--) output.push_back(grid[bottom][c]);
                  bottom--;
              }
              if (left <= right) {
                  for (int r = bottom; r >= top; r--) output.push_back(grid[r][left]);
                  left++;
              }
          }
          for (size_t i = 0; i < output.size(); i++) cout << output[i] << (i + 1 < output.size() ? ' ' : '\n');
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>

      static int grid[500][500], count = 0, total;

      static void show(int value) {
          count++;
          printf("%d%c", value, count < total ? ' ' : '\n');
      }

      int main(void) {
          int rows, cols;
          scanf("%d %d", &rows, &cols);
          total = rows * cols;
          for (int r = 0; r < rows; r++) {
              for (int c = 0; c < cols; c++) scanf("%d", &grid[r][c]);
          }
          int top = 0, bottom = rows - 1, left = 0, right = cols - 1;
          while (top <= bottom && left <= right) {
              for (int c = left; c <= right; c++) show(grid[top][c]);
              top++;
              for (int r = top; r <= bottom; r++) show(grid[r][right]);
              right--;
              if (top <= bottom) {
                  for (int c = right; c >= left; c--) show(grid[bottom][c]);
                  bottom--;
              }
              if (left <= right) {
                  for (int r = bottom; r >= top; r--) show(grid[r][left]);
                  left++;
              }
          }
          return 0;
      }
