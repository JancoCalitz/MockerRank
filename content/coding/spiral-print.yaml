    solution: |
      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int rows = Integer.parseInt(t[0]), cols = Integer.parseInt(t[1]);
              int top = 0, bottom = rows - 1, left = 0, right = cols - 1, count = 0;
              String[] output = new String[rows * cols];
              while (top <= bottom && left <= right) {
                  for (int c = left; c <= right; c++) {
                      output[count++] = t[2 + top * cols + c];
                  }
                  top++;
                  for (int r = top; r <= bottom; r++) {
                      output[count++] = t[2 + r * cols + right];
                  }
                  right--;
                  if (top <= bottom) {
                      for (int c = right; c >= left; c--) {
                          output[count++] = t[2 + bottom * cols + c];
                      }
                      bottom--;
                  }
                  if (left <= right) {
                      for (int r = bottom; r >= top; r--) {
                          output[count++] = t[2 + r * cols + left];
                      }
                      left++;
                  }
              }
              System.out.println(String.join(" ", output));
          }
      }
