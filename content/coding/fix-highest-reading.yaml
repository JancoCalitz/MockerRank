id: fix-highest-reading
title: Fix the Highest Reading
type: short
style: stdin
difficulty: easy
debug: true
statement: |
  A thermometer logs readings, which can be below zero. This program should print the highest reading, but it has a bug.

  Find the bug and fix it. You should only need to change a small part of the code.
inputFormat: |
  The first line contains `n`.

  The second line contains `n` readings.
outputFormat: |
  The highest reading.
constraints: |
  - 1 <= n <= 100000
  - -1000000 <= reading <= 1000000
sampleTests:
  - input: |
      3
      4 9 2
    output: |
      9
  - input: |
      3
      -5 -2 -9
    output: |
      -2
hiddenTests:
  - input: |
      1
      -7
    output: |
      -7
  - input: |
      4
      0 0 0 0
    output: |
      0
  - input: |
      2
      -1 1
    output: |
      1
  - file: fix-highest-reading-large
    weight: 3
checker:
  type: exact
editorial: |
  The running highest value started at 0, so with only negative readings, it never changes. Start from the first reading, or from the lowest possible value. Choosing a starting value that could beat a real answer is a very common bug.
tags: [debugging, arrays]
topics: [debugging-code-reading]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]);
              int best = 0;
              for (int i = 0; i < n; i++) best = Math.Max(best, int.Parse(t[1 + i]));
              Console.WriteLine(best);
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]);
              int best = int.MinValue;
              for (int i = 0; i < n; i++) best = Math.Max(best, int.Parse(t[1 + i]));
              Console.WriteLine(best);
          }
      }
