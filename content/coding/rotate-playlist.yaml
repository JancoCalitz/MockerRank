id: rotate-playlist
title: Rotate the Playlist
type: short
style: stdin
difficulty: easy
statement: |
  A playlist moves its last song to the front each time someone presses a button. Print the playlist
  after the button has been pressed `k` times.
inputFormat: |
  The first line contains `n` and `k`.

  The second line contains `n` song IDs.
outputFormat: |
  The `n` song IDs in their final order, separated by spaces.
constraints: |
  - 1 <= n <= 100000
  - 0 <= k <= 1000000000
  - 1 <= song ID <= 1000000
sampleTests:
  - input: |
      5 2
      1 2 3 4 5
    output: |
      4 5 1 2 3
  - input: |
      3 0
      7 8 9
    output: |
      7 8 9
hiddenTests:
  - input: |
      3 3
      7 8 9
    output: |
      7 8 9
  - input: |
      1 1000000000
      5
    output: |
      5
  - input: |
      4 5
      1 2 3 4
    output: |
      4 1 2 3
  - file: rotate-playlist-large
    weight: 3
checker:
  type: exact
editorial: |
  Pressing the button `n` times returns to the start, so only `k mod n` presses matter. The song at
  position `i` of the result is at position `(i - k mod n + n) mod n` of the input. This takes O(n) time.
  Simulating each press would take O(nk) time.
tags: [arrays, modulo]
topics: [arrays-strings]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]);
              int k = int.Parse(t[1]) % n;
              var result = new string[n];
              for (int i = 0; i < n; i++) result[(i + k) % n] = t[2 + i];
              Console.WriteLine(string.Join(" ", result));
          }
      }
  java:
    starter: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              // Read from System.in and write to System.out.
          }
      }
    solution: |
      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]);
              int k = Integer.parseInt(t[1]) % n;
              String[] result = new String[n];
              for (int i = 0; i < n; i++) {
                  result[(i + k) % n] = t[2 + i];
              }
              System.out.println(String.join(" ", result));
          }
      }
