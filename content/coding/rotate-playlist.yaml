      import { readFileSync } from 'node:fs';

      const t: string[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean);
      const n = Number(t[0]);
      const k = Number(t[1]) % n;
      const result: string[] = new Array<string>(n);
      for (let i = 0; i < n; i++) result[(i + k) % n] = t[2 + i]!;
