    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean);
      const n = Number(t[0]);
      const k = Number(t[1]) % n;
      const result = new Array(n);
      for (let i = 0; i < n; i++) result[(i + k) % n] = t[2 + i];
      console.log(result.join(' '));
