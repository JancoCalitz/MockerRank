          // Read from cin and write to cout.
          return 0;
      }
    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n, k;
          cin >> n >> k;
          k %= n;
          vector<int> result(n);
          for (int i = 0; i < n; i++) cin >> result[(i + k) % n];
          for (int i = 0; i < n; i++) cout << result[i] << (i + 1 < n ? ' ' : '\n');
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      int main(void) {
          int n, k;
          scanf("%d %d", &n, &k);
          k %= n;
          int *result = malloc(sizeof(int) * n);
          for (int i = 0; i < n; i++) scanf("%d", &result[(i + k) % n]);
          for (int i = 0; i < n; i++) printf("%d%c", result[i], i + 1 < n ? ' ' : '\n');
          free(result);
          return 0;
      }
