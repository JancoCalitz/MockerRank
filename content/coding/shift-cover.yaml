id: shift-cover
title: Shift Cover
type: short
style: stdin
difficulty: medium
statement: |
  A help desk has a list of staff shifts, which can overlap. A shift from `start` to `end` covers the time from
  `start` up to, but not including, `end`. Find the total time covered by at least one shift.
inputFormat: |
  The first line contains `n`.

  Each of the next `n` lines contains a shift's `start` and `end`. The shifts are in no particular order.
outputFormat: |
  The total time covered.
constraints: |
  - 1 <= n <= 100000
  - 0 <= start < end <= 1000000000
sampleTests:
  - input: |
      3
      1 4
      2 6
      8 9
    output: |
      6
  - input: |
      2
      5 7
      7 9
    output: |
      4
hiddenTests:
  - input: |
      1
      0 1000000000
    output: |
      1000000000
  - input: |
      3
      1 10
      2 3
      4 5
    output: |
      9
    weight: 2
  - input: |
      2
      8 9
      1 2
    output: |
      2
  - file: shift-cover-large
    weight: 3
checker:
  type: exact
editorial: |
  Sort the shifts by start time, then keep the latest end seen so far. Each shift adds only the part beyond that end.
  This takes O(n log n) time. Note that a shift may sit completely inside an earlier one, so the latest end must
  only ever move forward. Marking every time unit is impossible at this scale.
tags: [intervals, sorting]
topics: [sorting-searching]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]);
              var shifts = new long[n];
              for (int i = 0; i < n; i++)
              {
                  shifts[i] = long.Parse(t[1 + 2 * i]) * (1L << 31) + long.Parse(t[2 + 2 * i]);
              }
              Array.Sort(shifts);
              long total = 0, reached = 0;
              foreach (long shift in shifts)
              {
                  long start = shift >> 31, end = shift & ((1L << 31) - 1);
                  total += Math.Max(0, end - Math.Max(start, reached));
                  reached = Math.Max(reached, end);
              }
              Console.WriteLine(total);
          }
      }
