    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n;
          cin >> n;
          vector<pair<int, int>> shifts(n);
          for (auto& shift : shifts) cin >> shift.first >> shift.second;
          sort(shifts.begin(), shifts.end());
          long long total = 0;
          int reached = 0;
          for (auto& [start, end] : shifts) {
              total += max(0, end - max(start, reached));
              reached = max(reached, end);
          }
          cout << total << endl;
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      typedef struct {
          int start, end;
      } Shift;

      static int byStart(const void *a, const void *b) {
          int x = ((const Shift *)a)->start, y = ((const Shift *)b)->start;
          return (x > y) - (x < y);
      }

      int main(void) {
          int n, reached = 0;
          long long total = 0;
          scanf("%d", &n);
          Shift *shifts = malloc(sizeof(Shift) * n);
          for (int i = 0; i < n; i++) scanf("%d %d", &shifts[i].start, &shifts[i].end);
          qsort(shifts, n, sizeof(Shift), byStart);
          for (int i = 0; i < n; i++) {
              int from = shifts[i].start > reached ? shifts[i].start : reached;
              if (shifts[i].end > from) total += shifts[i].end - from;
              if (shifts[i].end > reached) reached = shifts[i].end;
          }
          printf("%lld\n", total);
          free(shifts);
          return 0;
      }
  javascript:
