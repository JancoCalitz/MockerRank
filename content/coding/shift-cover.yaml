      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]);
              long[] shifts = new long[n];
              for (int i = 0; i < n; i++) {
                  shifts[i] = Long.parseLong(t[1 + 2 * i]) * (1L << 31) + Long.parseLong(t[2 + 2 * i]);
              }
              Arrays.sort(shifts);
              long total = 0, reached = 0;
              for (long shift : shifts) {
                  long start = shift >> 31, end = shift & ((1L << 31) - 1);
                  total += Math.max(0, end - Math.max(start, reached));
