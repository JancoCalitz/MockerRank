    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const shifts = [];
      for (let i = 0; i < t[0]; i++) shifts.push([t[1 + 2 * i], t[2 + 2 * i]]);
      shifts.sort((a, b) => a[0] - b[0]);
      let total = 0;
      let reached = 0;
      for (const [start, end] of shifts) {
        total += Math.max(0, end - Math.max(start, reached));
        reached = Math.max(reached, end);
      }
      console.log(total);
