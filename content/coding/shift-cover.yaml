    solution: |
      import sys

      t = sys.stdin.read().split()
      n = int(t[0])
      shifts = sorted((int(t[1 + 2 * i]), int(t[2 + 2 * i])) for i in range(n))
      total = reached = 0
      for start, end in shifts:
          total += max(0, end - max(start, reached))
          reached = max(reached, end)
      print(total)
