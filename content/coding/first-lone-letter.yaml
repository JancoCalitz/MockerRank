id: first-lone-letter
title: First Lone Letter
type: short
style: function
difficulty: easy
statement: |
  Complete the function `firstLone`, which returns the position, counting from 1, of the first letter
  that appears only once in a word. It returns `0` if every letter repeats.

  The provided code reads the input and prints your function's return value.
inputFormat: |
  One line containing a word of lowercase letters.
outputFormat: |
  The value returned by the function.
constraints: |
  - 1 <= length of the word <= 200000
sampleTests:
  - input: |
      lantern
    output: |
      1
  - input: |
      aabbc
    output: |
      5
hiddenTests:
  - input: |
      aabb
    output: |
      0
  - input: |
      z
    output: |
      1
  - input: |
      abcabd
    output: |
      3
  - input: |
      xxyzz
    output: |
      3
  - file: first-lone-letter-large
    weight: 3
checker:
  type: exact
editorial: |
  Count each letter in one pass, then scan again and return the first position whose letter has a count
  of 1. With a fixed alphabet this takes O(n) time and O(1) space. Remember to return a position
  counting from 1, and to return `0` when no letter qualifies.
tags: [counting, strings]
topics: [hashing]
languages:
  csharp:
    starter: |
      public static int FirstLone(string text)
      {
          // Write your code here.
          return 0;
      }
    harness: |
      using System;
      using System.Collections.Generic;
      using System.Linq;

      class Solution
      {
          {{USER_CODE}}

          public static void Main(string[] args)
          {
              Console.WriteLine(FirstLone(Console.ReadLine() ?? ""));
          }
      }
    solution: |
      public static int FirstLone(string text)
      {
          var counts = new int[26];
          foreach (char c in text) counts[c - 'a']++;
          for (int i = 0; i < text.Length; i++)
          {
              if (counts[text[i] - 'a'] == 1) return i + 1;
          }
          return 0;
      }
