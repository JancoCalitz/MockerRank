      print(first_lone(sys.stdin.readline().rstrip('\r\n')))
    solution: |
      def first_lone(text):
          counts = {}
          for c in text:
              counts[c] = counts.get(c, 0) + 1
          for i, c in enumerate(text):
              if counts[c] == 1:
                  return i + 1
          return 0
