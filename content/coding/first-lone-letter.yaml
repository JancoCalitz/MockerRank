    solution: |
      function firstLone(text: string): number {
        const counts = new Map<string, number>();
        for (const c of text) counts.set(c, (counts.get(c) ?? 0) + 1);
        for (let i = 0; i < text.length; i++) {
          if (counts.get(text[i]!) === 1) return i + 1;
        }
        return 0;
      }
