      int main() {
          int n;
          cin >> n;
          // Read the scans and print the answer.
          return 0;
      }
    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n;
          cin >> n;
          map<string, int> counts;
          for (int i = 0; i < n; i++) {
              string id;
              cin >> id;
              counts[id]++;
          }
          string best;
          int bestCount = 0;
          // A map is sorted by key, so the first badge with the top count wins a tie.
          for (const auto& [id, count] : counts) {
              if (count > bestCount) {
                  best = id;
                  bestCount = count;
              }
          }
          cout << best << " " << bestCount << endl;
          return 0;
      }
  javascript:
    starter: |
      const lines = require('fs').readFileSync(0, 'utf8').trim().split('\n');
      const n = Number(lines[0]);
      // Read the scans and print the answer.
    solution: |
      const lines = require('fs').readFileSync(0, 'utf8').trim().split('\n');
      const n = Number(lines[0]);
      const counts = new Map();
      for (let i = 1; i <= n; i++) {
        const id = lines[i].trim();
        counts.set(id, (counts.get(id) ?? 0) + 1);
      }
      let best = null;
      let bestCount = 0;
      for (const [id, count] of counts) {
        if (count > bestCount || (count === bestCount && id < best)) {
          best = id;
          bestCount = count;
        }
      }
      console.log(`${best} ${bestCount}`);
  typescript:
    starter: |
      import { readFileSync } from 'node:fs';

      const lines: string[] = readFileSync(0, 'utf8').trim().split('\n');
      const n: number = Number(lines[0]);
      // Read the scans and print the answer.
    solution: |
      import { readFileSync } from 'node:fs';

      const lines: string[] = readFileSync(0, 'utf8').trim().split('\n');
      const n: number = Number(lines[0]);
      const counts = new Map<string, number>();
      for (const line of lines.slice(1, n + 1)) {
        const id = line.trim();
        counts.set(id, (counts.get(id) ?? 0) + 1);
      }
      const [best, bestCount] = [...counts].reduce((a, b) =>
        b[1] > a[1] || (b[1] === a[1] && b[0] < a[0]) ? b : a,
      );
      console.log(`${best} ${bestCount}`);
  python:
    starter: |
      import sys

      lines = sys.stdin.read().split()
      n = int(lines[0])
      # Read the scans and print the answer.
    solution: |
      import sys
      from collections import Counter

      tokens = sys.stdin.read().split()
      counts = Counter(tokens[1:int(tokens[0]) + 1])
      best = min(counts, key=lambda badge: (-counts[badge], badge))
      print(best, counts[best])
