id: busiest-badge
title: Busiest Badge
type: short
style: stdin
difficulty: easy
statement: |
  An office door logs the badge ID of everyone who enters. Find the badge that was scanned most
  often, and how many times it was scanned.

  If several badges share the highest count, report the one that comes first when IDs are compared
  character by character using ASCII values. IDs are case-sensitive and are never treated as
  numbers, so `B` comes before `a`, and `10` comes before `9`.
inputFormat: |
  The first line contains an integer `n`, the number of scans.

  Each of the next `n` lines contains one badge ID.
outputFormat: |
  Print the badge ID and its count, separated by a single space.
constraints: |
  - 1 <= n <= 100000
  - Each badge ID has 1 to 20 ASCII letters and digits.
sampleTests:
  - input: |
      5
      a17
      b2
      a17
      c9
      b2
    output: |
      a17 2
  - input: |
      1
      z9
    output: |
      z9 1
hiddenTests:
  - input: |
      3
      X1
      x1
      X1
    output: |
      X1 2
  - input: |
      2
      a
      B
    output: |
      B 1
  - input: |
      3
      10
      9
      100
    output: |
      10 1
  - input: |
      4
      k
      k
      k
      k
    output: |
      k 4
    weight: 2
  - input: |
      6
      q
      r
      s
      s
      r
      p
    output: |
      r 2
    weight: 2
checker:
  type: exact
editorial: |
  Count scans in a hash map, then scan the map for the highest count, breaking ties with the smaller
  ID. This takes O(n) time and O(u) space for `u` distinct badges. Sorting the IDs also works, in
  O(n log n) time. Comparing IDs as numbers is the common mistake.
tags: [hash-map, counting]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              int n = int.Parse(Console.ReadLine());
              // Read the scans and print the answer.
          }
      }
    solution: |
      using System;
      using System.Collections.Generic;

      class Solution
      {
          public static void Main(string[] args)
          {
              int n = int.Parse(Console.ReadLine());
              var counts = new Dictionary<string, int>();
              for (int i = 0; i < n; i++)
              {
                  string id = Console.ReadLine().Trim();
                  counts[id] = counts.GetValueOrDefault(id) + 1;
              }
              string best = null;
              int bestCount = 0;
              foreach (var (id, count) in counts)
              {
                  if (count > bestCount || (count == bestCount && string.CompareOrdinal(id, best) < 0))
                  {
                      best = id;
                      bestCount = count;
                  }
              }
              Console.WriteLine($"{best} {bestCount}");
          }
      }
  java:
    starter: |
      import java.util.*;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int n = Integer.parseInt(scanner.nextLine().trim());
              // Read the scans and print the answer.
          }
      }
    solution: |
      import java.util.*;

      public class Main {
          public static void main(String[] args) {
              Scanner scanner = new Scanner(System.in);
              int n = Integer.parseInt(scanner.nextLine().trim());
              Map<String, Integer> counts = new HashMap<>();
              for (int i = 0; i < n; i++) {
                  counts.merge(scanner.nextLine().trim(), 1, Integer::sum);
              }
              String best = null;
              int bestCount = 0;
              for (Map.Entry<String, Integer> entry : counts.entrySet()) {
                  int count = entry.getValue();
                  if (count > bestCount || (count == bestCount && entry.getKey().compareTo(best) < 0)) {
                      best = entry.getKey();
                      bestCount = count;
                  }
              }
              System.out.println(best + " " + bestCount);
          }
      }
  cpp:
    starter: |
      #include <bits/stdc++.h>
