  python:
    starter: |
      import sys

      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import sys

      t = [int(x) for x in sys.stdin.read().split()]
      n, m, k = t[0], t[1], t[2]
      flights = [(t[3 + 3 * i], t[4 + 3 * i], t[5 + 3 * i]) for i in range(m)]
      unreached = float('inf')
      cost = [unreached] * (n + 1)
      cost[1] = 0
      for _ in range(k):
          next_cost = cost[:]
          for start, end, price in flights:
              if cost[start] + price < next_cost[end]:
                  next_cost[end] = cost[start] + price
          cost = next_cost
      print(-1 if cost[n] == unreached else cost[n])
