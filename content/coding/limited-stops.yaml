    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const [n, m, k] = t;
      let cost = new Array(n + 1).fill(Infinity);
      cost[1] = 0;
      for (let round = 0; round < k; round++) {
        const next = cost.slice();
        for (let i = 0; i < m; i++) {
          const from = t[3 + 3 * i];
          const to = t[4 + 3 * i];
          const total = cost[from] + t[5 + 3 * i];
          if (total < next[to]) next[to] = total;
        }
        cost = next;
      }
      console.log(cost[n] === Infinity ? -1 : cost[n]);
