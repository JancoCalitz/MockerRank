    solution: |
      long long trappedWater(const int *values, int n) {
          int left = 0, right = n - 1, highLeft = 0, highRight = 0;
          long long water = 0;
          while (left < right) {
              if (values[left] < values[right]) {
                  if (values[left] > highLeft) highLeft = values[left];
                  water += highLeft - values[left];
                  left++;
              } else {
                  if (values[right] > highRight) highRight = values[right];
                  water += highRight - values[right];
                  right--;
              }
          }
          return water;
      }
