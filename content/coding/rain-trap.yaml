      import sys

      {{USER_CODE}}

      t = sys.stdin.read().split()
      n = int(t[0])
      values = [int(x) for x in t[1:1 + n]]
      print(trapped_water(values))
    solution: |
      def trapped_water(values):
          left, right = 0, len(values) - 1
          high_left = high_right = water = 0
          while left < right:
              if values[left] < values[right]:
                  high_left = max(high_left, values[left])
                  water += high_left - values[left]
                  left += 1
              else:
                  high_right = max(high_right, values[right])
                  water += high_right - values[right]
                  right -= 1
          return water
