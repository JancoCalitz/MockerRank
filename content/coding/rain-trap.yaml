id: rain-trap
title: Rain Trap
type: long
style: function
difficulty: hard
statement: |
  A row of walls has different heights, and each wall is one unit wide. After heavy rain, water settles between the walls.

  Complete the function `trappedWater`, which returns the total units of water held. Water above a position rises to the lower of the highest walls on its left and its right.

  The provided code reads the input and prints your function's return value.
inputFormat: |
  The first line contains `n`.

  The second line contains `n` wall heights.
outputFormat: |
  The total units of water.
constraints: |
  - 1 <= n <= 200000
  - 0 <= height <= 100000
sampleTests:
  - input: |
      6
      3 0 2 0 4 1
    output: |
      7
  - input: |
      3
      1 2 3
    output: |
      0
hiddenTests:
  - input: |
      1
      5
    output: |
      0
  - input: |
      3
      5 0 5
    output: |
      5
  - input: |
      4
      2 0 0 1
    output: |
      2
    weight: 2
  - input: |
      5
      5 4 3 4 5
    output: |
      4
    weight: 2
  - file: rain-trap-large
    weight: 3
checker:
  type: exact
editorial: |
  The water at a position is `min(highest on the left, highest on the right) - its height`. Prefix and suffix arrays of the highest walls give O(n) time and O(n) space. Two pointers improve this to O(1) space. Move
  in from whichever side has the lower wall, because the water there depends only on that side's highest wall. Recomputing the highest walls at each position takes O(n^2) time. The total can exceed 32 bits.
tags: [two-pointers]
topics: [arrays-strings, stacks-queues]
