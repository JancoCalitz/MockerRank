    harness: |
      using System;
      using System.Collections.Generic;
      using System.Linq;

      class Solution
      {
          {{USER_CODE}}

          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]);
              var values = new int[n];
              for (int i = 0; i < n; i++) values[i] = int.Parse(t[i + 1]);
              Console.WriteLine(TrappedWater(values));
          }
      }
    solution: |
      public static long TrappedWater(int[] values)
      {
          int left = 0, right = values.Length - 1, highLeft = 0, highRight = 0;
          long water = 0;
          while (left < right)
          {
              if (values[left] < values[right])
              {
                  highLeft = Math.Max(highLeft, values[left]);
                  water += highLeft - values[left++];
              }
              else
              {
                  highRight = Math.Max(highRight, values[right]);
                  water += highRight - values[right--];
              }
          }
          return water;
      }
