id: call-burst
title: Call Burst
type: short
style: stdin
difficulty: medium
statement: |
  A support line logs the time of each call. For each call, report how many calls happened in the `w`
  time units up to and including it. That is, count the calls with a time from `t - w` to `t`, including
  the call itself.
inputFormat: |
  The first line contains `n` and `w`.

  The second line contains `n` call times, in order from earliest to latest. Times can repeat. Calls with the
  same time as a later call are not counted for the earlier one.
outputFormat: |
  `n` counts separated by spaces.
constraints: |
  - 1 <= n <= 100000
  - 0 <= w, time <= 1000000000
sampleTests:
  - input: |
      5 10
      1 5 11 12 30
    output: |
      1 2 3 3 1
  - input: |
      2 0
      4 4
    output: |
      1 2
hiddenTests:
  - input: |
      1 5
      0
    output: |
      1
  - input: |
      3 1000
      1 2 3
    output: |
      1 2 3
  - input: |
      4 2
      1 3 5 7
    output: |
      1 2 2 2
  - file: call-burst-large
    weight: 3
checker:
  type: exact
editorial: |
  Keep the calls still inside the window in a queue. When a call arrives, remove calls from the front that
  are older than `t - w`, add the new call, and report the queue's size. Each call enters and leaves once, so
  this takes O(n) time. A pointer into the sorted times does the same thing without a separate queue.
tags: [queue, sliding-window]
topics: [stacks-queues]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), w = int.Parse(t[1]), front = 0;
              var times = new int[n];
              var counts = new int[n];
              for (int i = 0; i < n; i++)
              {
                  times[i] = int.Parse(t[2 + i]);
                  while (times[front] < times[i] - w) front++;
                  counts[i] = i - front + 1;
              }
              Console.WriteLine(string.Join(" ", counts));
          }
      }
  java:
    starter: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              // Read from System.in and write to System.out.
          }
      }
    solution: |
      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]), w = Integer.parseInt(t[1]), front = 0;
              int[] times = new int[n];
              StringBuilder out = new StringBuilder();
              for (int i = 0; i < n; i++) {
                  times[i] = Integer.parseInt(t[2 + i]);
                  while (times[front] < times[i] - w) {
                      front++;
                  }
                  out.append(i - front + 1).append(i + 1 < n ? " " : "");
              }
              System.out.println(out);
          }
      }
