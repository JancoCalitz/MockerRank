      }
    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n, w, front = 0;
          cin >> n >> w;
          vector<int> times(n);
          for (int i = 0; i < n; i++) {
              cin >> times[i];
              while (times[front] < times[i] - w) front++;
              cout << i - front + 1 << (i + 1 < n ? ' ' : '\n');
          }
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      int main(void) {
          int n, w, front = 0;
          scanf("%d %d", &n, &w);
          int *times = malloc(sizeof(int) * n);
          for (int i = 0; i < n; i++) {
              scanf("%d", &times[i]);
              while (times[front] < times[i] - w) front++;
              printf("%d%c", i - front + 1, i + 1 < n ? ' ' : '\n');
          }
          free(times);
          return 0;
      }
  javascript:
    starter: |
      const input = require('fs').readFileSync(0, 'utf8');
      // Parse the input and print the answer with console.log.
    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const [n, w] = t;
      const counts = [];
      let front = 0;
      for (let i = 0; i < n; i++) {
        while (t[2 + front] < t[2 + i] - w) front++;
        counts.push(i - front + 1);
      }
      console.log(counts.join(' '));
  typescript:
