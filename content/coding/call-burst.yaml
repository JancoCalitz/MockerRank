    solution: |
      import { readFileSync } from 'node:fs';

      const t: number[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const n = t[0]!;
      const w = t[1]!;
      const counts: number[] = [];
      let front = 0;
      for (let i = 0; i < n; i++) {
        while (t[2 + front]! < t[2 + i]! - w) front++;
        counts.push(i - front + 1);
      }
      console.log(counts.join(' '));
  python:
    starter: |
      import sys

      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import sys

      t = sys.stdin.read().split()
      n, w = int(t[0]), int(t[1])
      times = [int(x) for x in t[2:2 + n]]
      counts = []
      front = 0
      for i, time in enumerate(times):
          while times[front] < time - w:
              front += 1
          counts.append(i - front + 1)
      print(' '.join(map(str, counts)))
