    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      int main(void) {
          int n, k, front = 0, back = 0;
          scanf("%d %d", &n, &k);
          int *readings = malloc(sizeof(int) * n), *queue = malloc(sizeof(int) * n);
          for (int i = 0; i < n; i++) {
              scanf("%d", &readings[i]);
              while (back > front && readings[queue[back - 1]] <= readings[i]) back--;
              queue[back++] = i;
              if (queue[front] <= i - k) front++;
              if (i >= k - 1) printf("%d%c", readings[queue[front]], i + 1 < n ? ' ' : '\n');
          }
          free(readings);
          free(queue);
          return 0;
      }
