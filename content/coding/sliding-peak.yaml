id: sliding-peak
title: Sliding Peak
type: short
style: stdin
difficulty: hard
statement: |
  A sensor dashboard shows the highest reading in the last `k` readings. For each full window of `k` consecutive readings, print its highest
  reading.
inputFormat: |
  The first line contains `n` and `k`.

  The second line contains `n` readings.
outputFormat: |
  `n - k + 1` values separated by spaces.
constraints: |
  - 1 <= k <= n <= 200000
  - 0 <= reading <= 1000000000
sampleTests:
  - input: |
      5 3
      1 3 2 5 4
    output: |
      3 5 5
  - input: |
      3 1
      7 8 9
    output: |
      7 8 9
hiddenTests:
  - input: |
      1 1
      4
    output: |
      4
  - input: |
      4 4
      1 9 2 3
    output: |
      9
  - input: |
      5 2
      9 8 7 6 5
    output: |
      9 8 7 6
    weight: 2
  - input: |
      5 3
      2 2 2 2 2
    output: |
      2 2 2
  - file: sliding-peak-large
    weight: 3
checker:
  type: exact
editorial: |
  Keep a double-ended queue of positions whose readings are in decreasing order. For each new reading, pop positions from the back with readings at
  or below it, because they can never be the highest again, and pop the front if it has left the window. The front is then the highest reading. Each
  position enters and leaves once, so this takes O(n) time. Scanning each window takes O(nk) time, and a falling sequence defeats the shortcut of keeping
  only the current maximum.
tags: [deque, sliding-window]
topics: [stacks-queues]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;
      using System.Text;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), k = int.Parse(t[1]), front = 0, back = 0;
              var readings = new int[n];
              var queue = new int[n];
              var output = new StringBuilder();
              for (int i = 0; i < n; i++)
              {
                  readings[i] = int.Parse(t[2 + i]);
                  while (back > front && readings[queue[back - 1]] <= readings[i]) back--;
                  queue[back++] = i;
                  if (queue[front] <= i - k) front++;
                  if (i >= k - 1) output.Append(readings[queue[front]]).Append(i + 1 < n ? " " : "");
              }
              Console.WriteLine(output);
          }
      }
