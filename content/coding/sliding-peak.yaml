    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n, k;
          cin >> n >> k;
          vector<int> readings(n);
          deque<int> queue;
          for (int i = 0; i < n; i++) {
              cin >> readings[i];
              while (!queue.empty() && readings[queue.back()] <= readings[i]) queue.pop_back();
              queue.push_back(i);
              if (queue.front() <= i - k) queue.pop_front();
              if (i >= k - 1) cout << readings[queue.front()] << (i + 1 < n ? ' ' : '\n');
          }
          return 0;
      }
