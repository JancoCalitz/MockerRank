      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const [n, k] = t;
      const queue = new Int32Array(n);
      const output = [];
      let front = 0;
      let back = 0;
      for (let i = 0; i < n; i++) {
        while (back > front && t[2 + queue[back - 1]] <= t[2 + i]) back--;
        queue[back++] = i;
        if (queue[front] <= i - k) front++;
        if (i >= k - 1) output.push(t[2 + queue[front]]);
      }
      console.log(output.join(' '));
