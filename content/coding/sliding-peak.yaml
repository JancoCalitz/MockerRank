      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]), k = Integer.parseInt(t[1]), front = 0, back = 0;
              int[] readings = new int[n], queue = new int[n];
              StringBuilder output = new StringBuilder();
              for (int i = 0; i < n; i++) {
                  readings[i] = Integer.parseInt(t[2 + i]);
                  while (back > front && readings[queue[back - 1]] <= readings[i]) {
                      back--;
                  }
                  queue[back++] = i;
                  if (queue[front] <= i - k) {
                      front++;
                  }
                  if (i >= k - 1) {
                      output.append(readings[queue[front]]).append(i + 1 < n ? " " : "");
                  }
              }
              System.out.println(output);
          }
      }
