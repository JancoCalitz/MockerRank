  python:
    starter: |
      import sys

      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import sys
      from collections import deque

      t = sys.stdin.read().split()
      n, k = int(t[0]), int(t[1])
      readings = [int(x) for x in t[2:2 + n]]
      queue = deque()
      output = []
      for i, reading in enumerate(readings):
          while queue and readings[queue[-1]] <= reading:
              queue.pop()
          queue.append(i)
          if queue[0] <= i - k:
              queue.popleft()
          if i >= k - 1:
              output.append(readings[queue[0]])
      print(' '.join(map(str, output)))
