id: merge-queues
title: Merge the Queues
type: short
style: stdin
difficulty: easy
statement: |
  Two checkout lanes each hold customers in order of arrival time. Merge them into one list in order of arrival time. Print the merged arrival
  times.
inputFormat: |
  The first line contains `n` and `m`.

  The second line contains `n` times, from lowest to highest. The third line contains `m` times, from lowest to highest.
outputFormat: |
  `n + m` times separated by spaces, from lowest to highest.
constraints: |
  - 1 <= n, m <= 100000
  - 0 <= time <= 1000000000
sampleTests:
  - input: |
      3 2
      1 4 9
      2 5
    output: |
      1 2 4 5 9
  - input: |
      1 1
      3
      3
    output: |
      3 3
hiddenTests:
  - input: |
      1 3
      9
      1 2 3
    output: |
      1 2 3 9
    weight: 2
  - input: |
      2 1
      1 2
      3
    output: |
      1 2 3
  - input: |
      2 2
      5 5
      5 5
    output: |
      5 5 5 5
  - file: merge-queues-large
    weight: 3
checker:
  type: exact
editorial: |
  Keep one pointer into each list, and repeatedly take the smaller of the two current values. When one list runs out, copy the rest of the other.
  This takes O(n + m) time. Joining and sorting works, but takes O((n + m) log(n + m)) time and ignores the sorted order you were given. This is the same
  step used by merge sort, and by merging two sorted linked lists.
tags: [merging, two-pointers]
topics: [linked-lists, sorting-searching]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), m = int.Parse(t[1]), i = 0, j = 0;
              var merged = new string[n + m];
              for (int k = 0; k < n + m; k++)
              {
                  bool first = j == m || (i < n && int.Parse(t[2 + i]) <= int.Parse(t[2 + n + j]));
                  merged[k] = first ? t[2 + i++] : t[2 + n + j++];
              }
              Console.WriteLine(string.Join(" ", merged));
          }
      }
  java:
    starter: |
