    solution: |
      import { readFileSync } from 'node:fs';

      const t: number[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const n = t[0]!;
      const m = t[1]!;
      const merged: number[] = [];
      let i = 0;
      let j = 0;
      while (i < n || j < m) {
        if (j === m || (i < n && t[2 + i]! <= t[2 + n + j]!)) merged.push(t[2 + i++]!);
        else merged.push(t[2 + n + j++]!);
      }
      console.log(merged.join(' '));
  python:
    starter: |
      import sys

      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import sys

      t = [int(x) for x in sys.stdin.read().split()]
      n, m = t[0], t[1]
      a, b = t[2:2 + n], t[2 + n:2 + n + m]
      merged = []
      i = j = 0
      while i < n or j < m:
          if j == m or (i < n and a[i] <= b[j]):
              merged.append(a[i])
              i += 1
          else:
              merged.append(b[j])
              j += 1
      print(' '.join(map(str, merged)))
