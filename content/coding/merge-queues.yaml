    solution: |
      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]), m = Integer.parseInt(t[1]), i = 0, j = 0;
              String[] merged = new String[n + m];
              for (int k = 0; k < n + m; k++) {
                  boolean first = j == m || (i < n && Integer.parseInt(t[2 + i]) <= Integer.parseInt(t[2 + n + j]));
                  merged[k] = first ? t[2 + i++] : t[2 + n + j++];
              }
              System.out.println(String.join(" ", merged));
          }
      }
  cpp:
    starter: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          // Read from cin and write to cout.
          return 0;
      }
    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n, m;
          cin >> n >> m;
          vector<int> a(n), b(m), merged(n + m);
          for (int& value : a) cin >> value;
          for (int& value : b) cin >> value;
          merge(a.begin(), a.end(), b.begin(), b.end(), merged.begin());
          for (int k = 0; k < n + m; k++) cout << merged[k] << (k + 1 < n + m ? ' ' : '\n');
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      int main(void) {
          int n, m, i = 0, j = 0;
          scanf("%d %d", &n, &m);
          int *a = malloc(sizeof(int) * n), *b = malloc(sizeof(int) * m);
          for (int k = 0; k < n; k++) scanf("%d", &a[k]);
          for (int k = 0; k < m; k++) scanf("%d", &b[k]);
          for (int k = 0; k < n + m; k++) {
              int value = j == m || (i < n && a[i] <= b[j]) ? a[i++] : b[j++];
              printf("%d%c", value, k + 1 < n + m ? ' ' : '\n');
          }
          free(a);
          free(b);
          return 0;
      }
  javascript:
    starter: |
      const input = require('fs').readFileSync(0, 'utf8');
      // Parse the input and print the answer with console.log.
    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const [n, m] = t;
      const merged = [];
      let i = 0;
      let j = 0;
      while (i < n || j < m) {
        if (j === m || (i < n && t[2 + i] <= t[2 + n + j])) merged.push(t[2 + i++]);
        else merged.push(t[2 + n + j++]);
      }
      console.log(merged.join(' '));
  typescript:
