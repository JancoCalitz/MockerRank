  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      int main(void) {
          int n, start = 0, runs = 0;
          long long k, total = 0;
          scanf("%d %lld", &n, &k);
          long long *prices = malloc(sizeof(long long) * n);
          for (int i = 0; i < n; i++) {
              scanf("%lld", &prices[i]);
              total += prices[i];
              while (total > k) total -= prices[start++];
              if (total == k) runs++;
          }
          printf("%d\n", runs);
          free(prices);
          return 0;
      }
