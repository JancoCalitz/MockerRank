    solution: |
      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]), start = 0, runs = 0;
              long k = Long.parseLong(t[1]), total = 0;
              long[] prices = new long[n];
              for (int i = 0; i < n; i++) {
                  prices[i] = Long.parseLong(t[2 + i]);
                  total += prices[i];
                  while (total > k) {
                      total -= prices[start++];
                  }
                  if (total == k) {
                      runs++;
                  }
              }
              System.out.println(runs);
          }
      }
