      import sys

      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import sys

      t = sys.stdin.read().split()
      n, k = int(t[0]), int(t[1])
      prices = [int(x) for x in t[2:2 + n]]
      start = total = runs = 0
      for price in prices:
          total += price
          while total > k:
              total -= prices[start]
              start += 1
          if total == k:
              runs += 1
      print(runs)
