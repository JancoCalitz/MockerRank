id: exact-spend
title: Exact Spend
type: short
style: stdin
difficulty: medium
statement: |
  A shopper lists the price of each item along an aisle, and all of the prices are positive. Count the unbroken runs of items whose
  total is exactly `k`.
inputFormat: |
  The first line contains `n` and `k`.

  The second line contains `n` prices.
outputFormat: |
  The number of runs.
constraints: |
  - 1 <= n <= 200000
  - 1 <= k <= 100000000000000
  - 1 <= price <= 1000000000
sampleTests:
  - input: |
      5 5
      2 3 1 4 1
    output: |
      3
  - input: |
      3 10
      1 2 3
    output: |
      0
hiddenTests:
  - input: |
      1 7
      7
    output: |
      1
  - input: |
      4 2
      1 1 1 1
    output: |
      3
    weight: 2
  - input: |
      2 3000000000
      1000000000 1000000000
    output: |
      0
  - input: |
      3 2000000000
      1000000000 1000000000 5
    output: |
      1
  - file: exact-spend-large
    weight: 3
checker:
  type: exact
editorial: |
  Because every price is positive, extending a run always increases its total. So you can slide a window: add the next price, then remove
  prices from the start while the total is above `k`, and count the window when the total equals `k`. Each price enters and leaves once,
  so this takes O(n) time. The totals can exceed 32 bits. This shortcut would not work with negative prices.
tags: [sliding-window]
topics: [arrays-strings]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), start = 0, runs = 0;
              long k = long.Parse(t[1]), total = 0;
              for (int i = 0; i < n; i++)
              {
                  total += long.Parse(t[2 + i]);
                  while (total > k) total -= long.Parse(t[2 + start++]);
                  if (total == k) runs++;
              }
              Console.WriteLine(runs);
          }
      }
  java:
    starter: |
      import java.io.*;
