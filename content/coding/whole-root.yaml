      import { readFileSync } from 'node:fs';

      const t: number[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const output: number[] = [];
      for (let i = 0; i < t[0]!; i++) {
        const n = t[1 + i]!;
        let low = 0;
        let high = 32000000;
        while (low < high) {
          const mid = Math.ceil((low + high) / 2);
          if (mid * mid <= n) low = mid;
          else high = mid - 1;
        }
        output.push(low);
      }
      console.log(output.join(' '));
  python:
    starter: |
