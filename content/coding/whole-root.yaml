  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int q;
          scanf("%d", &q);
          for (int i = 0; i < q; i++) {
              long long n, low = 0, high = 32000000;
              scanf("%lld", &n);
              while (low < high) {
                  long long mid = (low + high + 1) / 2;
                  if (mid * mid <= n) low = mid;
                  else high = mid - 1;
              }
              printf("%lld%c", low, i + 1 < q ? ' ' : '\n');
          }
          return 0;
      }
  javascript:
    starter: |
      const input = require('fs').readFileSync(0, 'utf8');
      // Parse the input and print the answer with console.log.
    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const output = [];
      for (let i = 0; i < t[0]; i++) {
        const n = t[1 + i];
        let low = 0;
        let high = 32000000;
        while (low < high) {
          const mid = Math.ceil((low + high) / 2);
          if (mid * mid <= n) low = mid;
          else high = mid - 1;
        }
        output.push(low);
      }
      console.log(output.join(' '));
