    solution: |
      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int q = Integer.parseInt(t[0]);
              StringBuilder output = new StringBuilder();
              for (int i = 0; i < q; i++) {
                  long n = Long.parseLong(t[1 + i]), low = 0, high = 32000000;
                  while (low < high) {
                      long mid = (low + high + 1) / 2;
                      if (mid * mid <= n) {
                          low = mid;
                      } else {
                          high = mid - 1;
                      }
                  }
                  output.append(low).append(i + 1 < q ? " " : "");
              }
              System.out.println(output);
          }
      }
