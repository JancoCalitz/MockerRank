id: whole-root
title: Whole Root
type: short
style: stdin
difficulty: easy
statement: |
  A tiling tool wants the side of the largest square that uses at most `n` tiles. For each value of `n`, print the largest whole number
  whose square is at most `n`. Do not use a built-in square root function.
inputFormat: |
  The first line contains `q`.

  The second line contains `q` values of `n`.
outputFormat: |
  `q` answers separated by spaces.
constraints: |
  - 1 <= q <= 100000
  - 0 <= n <= 1000000000000000
sampleTests:
  - input: |
      3
      8 9 10
    output: |
      2 3 3
  - input: |
      2
      0 1
    output: |
      0 1
hiddenTests:
  - input: |
      1
      1000000000000000
    output: |
      31622776
    weight: 2
  - input: |
      2
      24 25
    output: |
      4 5
  - input: |
      2
      2 3
    output: |
      1 1
  - file: whole-root-large
    weight: 3
checker:
  type: exact
editorial: |
  Squares grow as their sides do, so you can binary search on the side, between 0 and 32000000. Each search takes about 25 steps, so the total
  is O(q log n) time. Counting up from 1 is far too slow, at up to 31 million steps a query. The squares exceed 32 bits, so use a 64-bit integer.
tags: [binary-search, math]
topics: [sorting-searching]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;
      using System.Text;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int q = int.Parse(t[0]);
              var output = new StringBuilder();
              for (int i = 0; i < q; i++)
              {
                  long n = long.Parse(t[1 + i]), low = 0, high = 32000000;
                  while (low < high)
                  {
                      long mid = (low + high + 1) / 2;
                      if (mid * mid <= n) low = mid;
                      else high = mid - 1;
                  }
                  output.Append(low).Append(i + 1 < q ? " " : "");
              }
              Console.WriteLine(output);
          }
      }
