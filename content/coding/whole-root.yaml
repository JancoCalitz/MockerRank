    solution: |
      import sys

      t = sys.stdin.read().split()
      output = []
      for value in t[1:1 + int(t[0])]:
          n = int(value)
          low, high = 0, 32000000
          while low < high:
              mid = (low + high + 1) // 2
              if mid * mid <= n:
                  low = mid
              else:
                  high = mid - 1
          output.append(low)
      print(' '.join(map(str, output)))
