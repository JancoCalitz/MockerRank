      }
    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          string s;
          getline(cin, s);
          int i = 0, j = (int)s.size() - 1;
          bool mirror = true;
          while (i < j && mirror) {
              if (!isalnum((unsigned char)s[i])) i++;
              else if (!isalnum((unsigned char)s[j])) j--;
              else mirror = tolower((unsigned char)s[i++]) == tolower((unsigned char)s[j--]);
          }
          cout << (mirror ? "YES" : "NO") << endl;
          return 0;
      }
  c:
    starter: |
