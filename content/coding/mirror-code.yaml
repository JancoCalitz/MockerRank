    solution: |
      import { readFileSync } from 'node:fs';

      const s: string = readFileSync(0, 'utf8').split('\n')[0]!;
      const isCode = (c: string): boolean => /[a-z0-9]/i.test(c);
      let i = 0;
      let j = s.length - 1;
      let mirror = true;
      while (i < j && mirror) {
        if (!isCode(s[i]!)) i++;
        else if (!isCode(s[j]!)) j--;
        else mirror = s[i++]!.toLowerCase() === s[j--]!.toLowerCase();
      }
      console.log(mirror ? 'YES' : 'NO');
