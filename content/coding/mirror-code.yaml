          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <ctype.h>
      #include <stdio.h>
      #include <string.h>

      static char s[200005];

      int main(void) {
          if (!fgets(s, sizeof s, stdin)) s[0] = 0;
          int i = 0, j = (int)strlen(s) - 1, mirror = 1;
          while (i < j && mirror) {
              if (!isalnum((unsigned char)s[i])) i++;
              else if (!isalnum((unsigned char)s[j])) j--;
              else mirror = tolower((unsigned char)s[i++]) == tolower((unsigned char)s[j--]);
          }
          puts(mirror ? "YES" : "NO");
          return 0;
      }
  javascript:
    starter: |
      const input = require('fs').readFileSync(0, 'utf8');
      // Parse the input and print the answer with console.log.
    solution: |
      const s = require('fs').readFileSync(0, 'utf8').split('\n')[0];
      const isCode = (c) => /[a-z0-9]/i.test(c);
      let i = 0;
      let j = s.length - 1;
      let mirror = true;
      while (i < j && mirror) {
        if (!isCode(s[i])) i++;
        else if (!isCode(s[j])) j--;
        else mirror = s[i++].toLowerCase() === s[j--].toLowerCase();
      }
      console.log(mirror ? 'YES' : 'NO');
  typescript:
