    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const [n, target] = t;
      const seen = new Map();
      let pairs = 0;
      for (let i = 0; i < n; i++) {
        const value = t[2 + i];
        pairs += seen.get(target - value) ?? 0;
        seen.set(value, (seen.get(value) ?? 0) + 1);
      }
      console.log(pairs);
