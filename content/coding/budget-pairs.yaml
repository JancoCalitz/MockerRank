    solution: |
      import sys
      from collections import defaultdict

      t = list(map(int, sys.stdin.read().split()))
      n, target = t[0], t[1]
      seen = defaultdict(int)
      pairs = 0
      for value in t[2:2 + n]:
          pairs += seen[target - value]
          seen[value] += 1
      print(pairs)
