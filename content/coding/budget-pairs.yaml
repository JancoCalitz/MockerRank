id: budget-pairs
title: Matching Budget Pairs
type: short
style: stdin
difficulty: medium
statement: |
  Each item in a list has a value, which can be negative for a refund. Count the pairs of different
  positions whose values add up to exactly `target`. Each pair of positions counts once.
inputFormat: |
  The first line contains `n` and `target`.

  The second line contains `n` values.
outputFormat: |
  The number of pairs.
constraints: |
  - 1 <= n <= 200000
  - -1000000000 <= value <= 1000000000
  - -2000000000 <= target <= 2000000000
sampleTests:
  - input: |
      5 6
      1 5 3 3 7
    output: |
      2
  - input: |
      3 10
      1 2 3
    output: |
      0
hiddenTests:
  - input: |
      4 0
      0 0 0 0
    output: |
      6
  - input: |
      4 1
      -1 2 0 1
    output: |
      2
  - input: |
      2 2000000000
      1000000000 1000000000
    output: |
      1
  - input: |
      5 4
      2 2 2 2 2
    output: |
      10
  - input: |
      1 2
      1
    output: |
      0
  - file: budget-pairs-large
    weight: 3
checker:
  type: exact
editorial: |
  Go through the values once, adding how many earlier values equal `target - value`, and then record
  the current value in a hash map. This takes O(n) time. Comparing every pair takes O(n^2). The count
  can reach about 20 billion, and the sum can exceed 32 bits, so use 64-bit integers.
tags: [hash-map, counting]
topics: [hashing]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;
      using System.Collections.Generic;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]);
              long target = long.Parse(t[1]), pairs = 0;
              var seen = new Dictionary<long, int>();
              for (int i = 0; i < n; i++)
              {
                  long value = long.Parse(t[2 + i]);
                  pairs += seen.GetValueOrDefault(target - value);
                  seen[value] = seen.GetValueOrDefault(value) + 1;
              }
              Console.WriteLine(pairs);
          }
      }
  java:
    starter: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              // Read from System.in and write to System.out.
          }
      }
    solution: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]);
              long target = Long.parseLong(t[1]), pairs = 0;
              Map<Long, Integer> seen = new HashMap<>();
              for (int i = 0; i < n; i++) {
                  long value = Long.parseLong(t[2 + i]);
                  pairs += seen.getOrDefault(target - value, 0);
                  seen.merge(value, 1, Integer::sum);
              }
              System.out.println(pairs);
          }
      }
  cpp:
    starter: |
