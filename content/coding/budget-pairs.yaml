      }
    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n;
          long long target, pairs = 0, value;
          cin >> n >> target;
          unordered_map<long long, int> seen;
          for (int i = 0; i < n; i++) {
              cin >> value;
              auto found = seen.find(target - value);
              if (found != seen.end()) pairs += found->second;
              seen[value]++;
          }
          cout << pairs << endl;
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      static int compare(const void *a, const void *b) {
          long long x = *(const long long *)a, y = *(const long long *)b;
          return (x > y) - (x < y);
      }

      int main(void) {
          int n;
          long long target, pairs = 0;
          scanf("%d %lld", &n, &target);
          long long *a = malloc(n * sizeof(long long));
          for (int i = 0; i < n; i++) scanf("%lld", &a[i]);
          qsort(a, n, sizeof(long long), compare);
          int low = 0, high = n - 1;
          while (low < high) {
              long long sum = a[low] + a[high];
              if (sum < target) low++;
              else if (sum > target) high--;
              else if (a[low] == a[high]) {
                  long long same = high - low + 1;
                  pairs += same * (same - 1) / 2;
                  break;
              } else {
                  long long left = 1, right = 1;
                  while (a[low + left] == a[low]) left++;
                  while (a[high - right] == a[high]) right++;
                  pairs += left * right;
                  low += left;
                  high -= right;
              }
          }
          printf("%lld\n", pairs);
          free(a);
          return 0;
      }
