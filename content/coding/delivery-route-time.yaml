    solution: |
      static long[] FastestTimes(List<(int To, int Time)>[] graph, int source)
      {
          var best = new long[graph.Length];
          Array.Fill(best, long.MaxValue);
          best[source] = 0;
          var queue = new PriorityQueue<int, long>();
          queue.Enqueue(source, 0);
          while (queue.TryDequeue(out int node, out long time))
          {
              if (time > best[node]) continue;
              foreach (var (next, cost) in graph[node])
              {
                  if (time + cost < best[next])
                  {
                      best[next] = time + cost;
                      queue.Enqueue(next, best[next]);
                  }
              }
          }
          return best;
      }

      public static long TotalRouteTime(int n, List<int[]> roads, int[] stops)
      {
          var graph = new List<(int To, int Time)>[n + 1];
          for (int i = 0; i <= n; i++) graph[i] = new List<(int To, int Time)>();
          foreach (var road in roads) graph[road[0]].Add((road[1], road[2]));
          long total = 0;
          int position = 1;
          foreach (int stop in stops)
          {
              long time = FastestTimes(graph, position)[stop];
              if (time == long.MaxValue) return -1;
              total += time;
              position = stop;
          }
          return total;
      }
