checker:
  type: exact
editorial: |
  Build an adjacency list, then run Dijkstra's algorithm with a binary heap once for each leg of the
  trip. Each run takes O((n + m) log n), so the total is O(k (n + m) log n). The common mistakes are
  treating roads as two-way, following the road with the lowest first step instead of the fastest
  whole route, and returning a partial total when a later stop is unreachable.
tags: [graphs, dijkstra, shortest-path]
languages:
  javascript:
    starter: |
