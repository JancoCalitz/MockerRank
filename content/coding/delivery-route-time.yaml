    solution: |
      function fastestTimes(graph, source) {
        const best = new Array(graph.length).fill(Infinity);
        best[source] = 0;
        const heap = [[0, source]];
        const swap = (i, j) => ([heap[i], heap[j]] = [heap[j], heap[i]]);
        const pop = () => {
          const top = heap[0];
          const last = heap.pop();
          if (heap.length > 0) {
            heap[0] = last;
            for (let i = 0; ; ) {
              let smallest = i;
              for (const child of [2 * i + 1, 2 * i + 2]) {
                if (child < heap.length && heap[child][0] < heap[smallest][0]) smallest = child;
              }
              if (smallest === i) break;
              swap(i, smallest);
              i = smallest;
            }
          }
          return top;
        };
        const push = (entry) => {
          heap.push(entry);
          for (let i = heap.length - 1; i > 0; ) {
            const parent = (i - 1) >> 1;
            if (heap[parent][0] <= heap[i][0]) break;
            swap(i, parent);
            i = parent;
          }
        };
        while (heap.length > 0) {
          const [time, node] = pop();
          if (time > best[node]) continue;
          for (const [next, cost] of graph[node]) {
            if (time + cost < best[next]) {
              best[next] = time + cost;
              push([best[next], next]);
            }
          }
        }
        return best;
      }

      function totalRouteTime(n, roads, stops) {
        const graph = Array.from({ length: n + 1 }, () => []);
        for (const [from, to, time] of roads) graph[from].push([to, time]);
        let total = 0;
        let position = 1;
        for (const stop of stops) {
          const time = fastestTimes(graph, position)[stop];
          if (time === Infinity) return -1;
          total += time;
          position = stop;
        }
        return total;
      }
