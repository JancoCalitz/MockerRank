    solution: |
      function totalRouteTime(n: number, roads: number[][], stops: number[]): number {
        const graph: [number, number][][] = Array.from({ length: n + 1 }, () => []);
        for (const [from, to, time] of roads) graph[from!]!.push([to!, time!]);

        // A simple array scan keeps this reference short: O(n^2) per leg.
        function fastestTime(source: number, target: number): number {
          const best: number[] = new Array(n + 1).fill(Infinity);
          const done: boolean[] = new Array(n + 1).fill(false);
          best[source] = 0;
          for (;;) {
            let node = -1;
            for (let i = 1; i <= n; i++) {
              if (!done[i] && best[i]! < Infinity && (node < 0 || best[i]! < best[node]!)) node = i;
            }
            if (node < 0) return best[target]!;
            done[node] = true;
            for (const [next, cost] of graph[node]!) {
              best[next] = Math.min(best[next]!, best[node]! + cost);
            }
          }
        }

        let total = 0;
        let position = 1;
        for (const stop of stops) {
          const time = fastestTime(position, stop);
          if (time === Infinity) return -1;
          total += time;
          position = stop;
        }
        return total;
      }
