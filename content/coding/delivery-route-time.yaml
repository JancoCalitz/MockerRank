    solution: |
      static long[] fastestTimes(List<List<int[]>> graph, int source) {
          long[] best = new long[graph.size()];
          Arrays.fill(best, Long.MAX_VALUE);
          best[source] = 0;
          PriorityQueue<long[]> queue = new PriorityQueue<>(Comparator.comparingLong(entry -> entry[0]));
          queue.add(new long[] { 0, source });
          while (!queue.isEmpty()) {
              long[] entry = queue.poll();
              int node = (int) entry[1];
              if (entry[0] > best[node]) continue;
              for (int[] road : graph.get(node)) {
                  if (entry[0] + road[1] < best[road[0]]) {
                      best[road[0]] = entry[0] + road[1];
                      queue.add(new long[] { best[road[0]], road[0] });
                  }
              }
          }
          return best;
      }

      static long totalRouteTime(int n, List<int[]> roads, int[] stops) {
          List<List<int[]>> graph = new ArrayList<>();
          for (int i = 0; i <= n; i++) graph.add(new ArrayList<>());
          for (int[] road : roads) graph.get(road[0]).add(new int[] { road[1], road[2] });
          long total = 0;
          int position = 1;
          for (int stop : stops) {
              long time = fastestTimes(graph, position)[stop];
              if (time == Long.MAX_VALUE) return -1;
              total += time;
              position = stop;
          }
          return total;
      }
