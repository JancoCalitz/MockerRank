id: delivery-route-time
title: Delivery Route Time
type: long
style: function
difficulty: medium
statement: |
  A courier starts at intersection 1 and must visit a list of stops in the given order. Roads are
  one-way, and each has a travel time. Between consecutive stops, the courier always takes the
  fastest route.

  Complete the function `totalRouteTime`, which returns the total travel time for the whole trip, or
  `-1` if any stop cannot be reached from the one before it. The first stop is reached from
  intersection 1. A stop that matches the courier's current position takes no time.

  The function receives:

  - `n`: the number of intersections, numbered 1 to `n`
  - `roads`: a list of `[from, to, time]` entries
  - `stops`: the intersections to visit, in order

  The provided code reads the input and prints your function's return value.
inputFormat: |
  The first line contains `n` and `m`, the number of intersections and roads.

  Each of the next `m` lines contains `from`, `to`, and `time`.

  The next line contains `k`, the number of stops.

  The last line contains `k` intersection numbers.
outputFormat: |
  The total travel time, or `-1` if the trip is impossible.
constraints: |
  - 1 <= n <= 2000
  - 0 <= m <= 10000
  - 1 <= time <= 1000000
  - 1 <= k <= 100
  - Several roads may connect the same two intersections.
sampleTests:
  - input: |
      4 4
      1 2 5
      2 3 2
      1 3 10
      3 4 1
      2
      3 4
    output: |
      8
  - input: |
      3 1
      1 2 4
      2
      2 3
    output: |
      -1
