      long long totalRouteTime(int n, const vector<array<int, 3>>& roads, const vector<int>& stops) {
          const long long unreachable = LLONG_MAX;
          vector<vector<pair<int, int>>> graph(n + 1);
          for (const auto& road : roads) graph[road[0]].push_back({road[1], road[2]});

          auto fastestTimes = [&](int source) {
              vector<long long> best(n + 1, unreachable);
              using Entry = pair<long long, int>;
              priority_queue<Entry, vector<Entry>, greater<Entry>> queue;
              best[source] = 0;
              queue.push({0, source});
              while (!queue.empty()) {
                  auto [time, node] = queue.top();
                  queue.pop();
                  if (time > best[node]) continue;
                  for (auto [next, cost] : graph[node]) {
                      if (time + cost < best[next]) {
                          best[next] = time + cost;
                          queue.push({best[next], next});
                      }
                  }
              }
              return best;
          };

          long long total = 0;
          int position = 1;
          for (int stop : stops) {
              long long time = fastestTimes(position)[stop];
              if (time == unreachable) return -1;
              total += time;
              position = stop;
          }
          return total;
      }
