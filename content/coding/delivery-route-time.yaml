    solution: |
      import heapq


      def total_route_time(n, roads, stops):
          graph = [[] for _ in range(n + 1)]
          for origin, target, time in roads:
              graph[origin].append((target, time))

          def fastest_times(source):
              best = [float('inf')] * (n + 1)
              best[source] = 0
              heap = [(0, source)]
              while heap:
                  time, node = heapq.heappop(heap)
                  if time > best[node]:
                      continue
                  for following, cost in graph[node]:
                      if time + cost < best[following]:
                          best[following] = time + cost
                          heapq.heappush(heap, (best[following], following))
              return best

          total = 0
          position = 1
          for stop in stops:
              time = fastest_times(position)[stop]
              if time == float('inf'):
                  return -1
              total += time
              position = stop
          return total
