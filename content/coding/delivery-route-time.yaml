    solution: |
      long long totalRouteTime(int n, int m, const int (*roads)[3], int k, const int *stops) {
          const long long unreachable = -1;
          long long *best = malloc((n + 1) * sizeof(long long));
          char *done = malloc(n + 1);
          int *head = malloc((n + 1) * sizeof(int));
          int *link = malloc((m + 1) * sizeof(int));
          for (int i = 0; i <= n; i++) head[i] = -1;
          for (int i = 0; i < m; i++) {
              link[i] = head[roads[i][0]];
              head[roads[i][0]] = i;
          }
          long long total = 0;
          int position = 1;
          for (int s = 0; s < k; s++) {
              // Dijkstra's algorithm with a simple scan: O(n^2) per leg.
              for (int i = 0; i <= n; i++) {
                  best[i] = unreachable;
                  done[i] = 0;
              }
              best[position] = 0;
              for (;;) {
                  int node = -1;
                  for (int i = 1; i <= n; i++) {
                      if (!done[i] && best[i] != unreachable && (node < 0 || best[i] < best[node])) node = i;
                  }
                  if (node < 0) break;
                  done[node] = 1;
                  for (int e = head[node]; e != -1; e = link[e]) {
                      int next = roads[e][1];
                      long long time = best[node] + roads[e][2];
                      if (best[next] == unreachable || time < best[next]) best[next] = time;
                  }
              }
              if (best[stops[s]] == unreachable) return -1;
              total += best[stops[s]];
              position = stops[s];
          }
          return total;
      }
