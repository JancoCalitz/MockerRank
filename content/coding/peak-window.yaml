checker:
  type: exact
editorial: |
  Use a sliding window: add the value entering the window and subtract the one leaving it. This takes
  O(n) time, whereas re-adding each window takes O(nk). The total can exceed 32 bits, so use a 64-bit
  integer in languages that distinguish them.
tags: [sliding-window]
topics: [arrays-strings]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), k = int.Parse(t[1]);
              long sum = 0, best = 0;
              for (int i = 0; i < n; i++)
              {
                  sum += long.Parse(t[2 + i]);
                  if (i >= k) sum -= long.Parse(t[2 + i - k]);
                  if (i >= k - 1) best = Math.Max(best, sum);
              }
              Console.WriteLine(best);
          }
      }
  java:
    starter: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              // Read from System.in and write to System.out.
          }
      }
    solution: |
      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]), k = Integer.parseInt(t[1]);
              long sum = 0, best = 0;
              for (int i = 0; i < n; i++) {
                  sum += Long.parseLong(t[2 + i]);
                  if (i >= k) sum -= Long.parseLong(t[2 + i - k]);
                  if (i >= k - 1) best = Math.max(best, sum);
              }
              System.out.println(best);
          }
      }
