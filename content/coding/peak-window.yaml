id: peak-window
title: Peak Delivery Window
type: short
style: stdin
difficulty: medium
statement: |
  A depot logs how many parcels arrive each hour. Find the largest number of parcels that arrived
  in any `k` consecutive hours.
inputFormat: |
  The first line contains `n` and `k`.

  The second line contains `n` hourly counts.
outputFormat: |
  The largest total of `k` consecutive counts.
constraints: |
  - 1 <= k <= n <= 200000
  - 0 <= count <= 1000000000
sampleTests:
  - input: |
      5 2
      1 3 2 6 1
    output: |
      8
  - input: |
      3 3
      4 5 6
    output: |
      15
hiddenTests:
  - input: |
      4 1
      0 0 9 0
    output: |
      9
  - input: |
      6 3
      5 1 1 1 1 5
    output: |
      7
  - input: |
      2 2
      1000000000 1000000000
    output: |
      2000000000
  - input: |
      3 2
      0 0 0
    output: |
      0
  - file: peak-window-large
    weight: 3
checker:
  type: exact
editorial: |
  Use a sliding window: add the value entering the window and subtract the one leaving it. This takes
  O(n) time, whereas re-adding each window takes O(nk). The total can exceed 32 bits, so use a 64-bit
  integer in languages that distinguish them.
tags: [sliding-window]
topics: [arrays-strings]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), k = int.Parse(t[1]);
              long sum = 0, best = 0;
              for (int i = 0; i < n; i++)
              {
                  sum += long.Parse(t[2 + i]);
                  if (i >= k) sum -= long.Parse(t[2 + i - k]);
                  if (i >= k - 1) best = Math.Max(best, sum);
              }
              Console.WriteLine(best);
          }
      }
  java:
    starter: |
