    solution: |
      import sys

      t = list(map(int, sys.stdin.read().split()))
      n, k = t[0], t[1]
      a = t[2:2 + n]
      total = best = sum(a[:k])
      for i in range(k, n):
          total += a[i] - a[i - k]
          best = max(best, total)
      print(best)
