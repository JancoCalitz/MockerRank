    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n, k;
          cin >> n >> k;
          vector<long long> a(n);
          long long sum = 0, best = 0;
          for (int i = 0; i < n; i++) {
              cin >> a[i];
              sum += a[i];
              if (i >= k) sum -= a[i - k];
              if (i >= k - 1) best = max(best, sum);
          }
          cout << best << endl;
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      int main(void) {
          int n, k;
          scanf("%d %d", &n, &k);
          long long *a = malloc(n * sizeof(long long));
          long long sum = 0, best = 0;
          for (int i = 0; i < n; i++) {
              scanf("%lld", &a[i]);
              sum += a[i];
              if (i >= k) sum -= a[i - k];
              if (i >= k - 1 && sum > best) best = sum;
          }
          printf("%lld\n", best);
          free(a);
          return 0;
      }
