      import { readFileSync } from 'node:fs';

      const t: number[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const n = t[0]!;
      const k = t[1]!;
      let sum = 0;
      let best = 0;
      for (let i = 0; i < n; i++) {
        sum += t[2 + i]!;
        if (i >= k) sum -= t[2 + i - k]!;
