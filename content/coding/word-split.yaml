id: word-split
title: Word Split
type: long
style: stdin
difficulty: medium
statement: |
  A text has lost all of its spaces. Decide if it can be split entirely into words from a dictionary, where each word can be used any number of times. Print `YES` if it can, and `NO` if it cannot.
inputFormat: |
  The first line contains `n`, the number of dictionary words.

  The second line contains the `n` words.

  The third line contains the text.
outputFormat: |
  `YES` or `NO`.
constraints: |
  - 1 <= n <= 1000
  - 1 <= length of a word <= 20
  - 1 <= length of the text <= 5000
  - All of the words and the text use lowercase letters.
sampleTests:
  - input: |
      2
      cat dog
      catdogcat
    output: |
      YES
  - input: |
      2
      cats sand
      catsan
    output: |
      NO
hiddenTests:
  - input: |
      1
      a
      a
    output: |
      YES
  - input: |
      2
      ab abc
      abcab
    output: |
      YES
    weight: 2
  - input: |
      2
      aa aaa
      a
    output: |
      NO
  - input: |
      3
      cat cats dog
      catsdogcat
    output: |
      YES
  - input: |
      2
      a aa
      aaaaaaaaaaaaaaaaaaaaaaaaaab
    output: |
      NO
    weight: 2
  - file: word-split-large
    weight: 3
checker:
  type: exact
editorial: |
  Let `can[i]` be true if the first `i` letters can be split. Then `can[i]` is true when some word ends at position `i` and `can` is true where that word starts. Checking each of the
  20 possible word lengths against a hash set takes O(n * 20) lookups. Trying splits with plain recursion takes exponential time on text like `aaaa...ab`, so store the results. Taking the longest
  matching word each time also fails, as a shorter word may be the only way through.
tags: [dp, strings]
topics: [recursion-dp, hashing]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;
      using System.Collections.Generic;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]);
              var words = new HashSet<string>();
              for (int i = 0; i < n; i++) words.Add(t[1 + i]);
              string text = t[1 + n];
              var can = new bool[text.Length + 1];
              can[0] = true;
              for (int i = 1; i <= text.Length; i++)
              {
                  for (int length = 1; length <= 20 && length <= i && !can[i]; length++)
                  {
                      can[i] = can[i - length] && words.Contains(text.Substring(i - length, length));
                  }
              }
              Console.WriteLine(can[text.Length] ? "YES" : "NO");
          }
      }
