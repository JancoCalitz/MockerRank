    solution: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]);
              Set<String> words = new HashSet<>();
              for (int i = 0; i < n; i++) {
                  words.add(t[1 + i]);
              }
              String text = t[1 + n];
              boolean[] can = new boolean[text.length() + 1];
              can[0] = true;
              for (int i = 1; i <= text.length(); i++) {
                  for (int length = 1; length <= 20 && length <= i && !can[i]; length++) {
                      can[i] = can[i - length] && words.contains(text.substring(i - length, i));
                  }
              }
              System.out.println(can[text.length()] ? "YES" : "NO");
          }
      }
