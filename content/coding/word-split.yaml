    solution: |
      import sys

      t = sys.stdin.read().split()
      n = int(t[0])
      words = set(t[1:1 + n])
      text = t[1 + n]
      can = [False] * (len(text) + 1)
      can[0] = True
      for i in range(1, len(text) + 1):
          for length in range(1, min(20, i) + 1):
              if can[i - length] and text[i - length:i] in words:
                  can[i] = True
                  break
      print('YES' if can[-1] else 'NO')
