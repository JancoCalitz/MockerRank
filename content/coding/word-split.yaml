  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <string.h>

      static char words[1000][22], text[5002], can[5002];
      static int lengths[1000];

      int main(void) {
          int n;
          scanf("%d", &n);
          for (int i = 0; i < n; i++) {
              scanf("%21s", words[i]);
              lengths[i] = strlen(words[i]);
          }
          scanf("%5001s", text);
          int size = strlen(text);
          can[0] = 1;
          for (int i = 1; i <= size; i++) {
              for (int w = 0; w < n && !can[i]; w++) {
                  int start = i - lengths[w];
                  if (start >= 0 && can[start] && memcmp(text + start, words[w], lengths[w]) == 0) can[i] = 1;
              }
          }
          puts(can[size] ? "YES" : "NO");
          return 0;
      }
