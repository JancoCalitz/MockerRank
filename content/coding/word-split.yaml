    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n;
          cin >> n;
          unordered_set<string> words;
          string word, text;
          for (int i = 0; i < n; i++) {
              cin >> word;
              words.insert(word);
          }
          cin >> text;
          int size = text.size();
          vector<char> can(size + 1);
          can[0] = 1;
          for (int i = 1; i <= size; i++) {
              for (int length = 1; length <= 20 && length <= i && !can[i]; length++) {
