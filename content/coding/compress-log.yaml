          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>

      static char s[200002];

      int main(void) {
          scanf("%200001s", s);
          int run = 0;
          for (int i = 0; s[i]; i++) {
              run++;
              if (s[i + 1] != s[i]) {
                  printf("%c%d", s[i], run);
                  run = 0;
              }
          }
          printf("\n");
          return 0;
      }
