id: compress-log
title: Compress the Log
type: short
style: stdin
difficulty: easy
statement: |
  A device writes one letter per event. To save space, replace each run of the same letter with the
  letter followed by the length of the run.

  For example, `aaabcc` becomes `a3b1c2`.
inputFormat: |
  One line containing a string of lowercase letters.
outputFormat: |
  The compressed string.
constraints: |
  - 1 <= length of the string <= 200000
sampleTests:
  - input: |
      aaabcc
    output: |
      a3b1c2
  - input: |
      z
    output: |
      z1
hiddenTests:
  - input: |
      abab
    output: |
      a1b1a1b1
  - input: |
      bbbbbbbbbbbb
    output: |
      b12
  - input: |
      aab
    output: |
      a2b1
  - file: compress-log-large
    weight: 3
checker:
  type: exact
editorial: |
  Walk the string, counting the current run, and write the letter and count whenever the letter changes.
  Remember to write the final run after the loop. Use a string builder where strings are immutable,
  because adding to a string in a loop can take O(n^2) time.
tags: [strings, run-length]
topics: [arrays-strings]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;
      using System.Text;

      class Solution
      {
          public static void Main(string[] args)
          {
              string s = Console.ReadLine().Trim();
              var result = new StringBuilder();
              int run = 0;
              for (int i = 0; i < s.Length; i++)
              {
                  run++;
                  if (i + 1 == s.Length || s[i + 1] != s[i])
                  {
                      result.Append(s[i]).Append(run);
                      run = 0;
                  }
              }
              Console.WriteLine(result);
          }
      }
