    solution: |
      const s = require('fs').readFileSync(0, 'utf8').trim();
      const parts = [];
      let run = 0;
      for (let i = 0; i < s.length; i++) {
        run++;
        if (s[i + 1] !== s[i]) {
          parts.push(s[i] + run);
          run = 0;
        }
      }
      console.log(parts.join(''));
