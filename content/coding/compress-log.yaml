      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import sys

      s = sys.stdin.read().strip()
      parts = []
      run = 0
      for i, c in enumerate(s):
          run += 1
          if i + 1 == len(s) or s[i + 1] != c:
              parts.append(c + str(run))
              run = 0
      print(''.join(parts))
