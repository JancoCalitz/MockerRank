      {{USER_CODE}}

      int main(void) {
          int n;
          scanf("%d", &n);
          int *values = malloc(sizeof(int) * (n + 1));
          for (int i = 0; i < n; i++) scanf("%d", &values[i]);
          printf("%lld\n", maxHaul(values, n));
          free(values);
          return 0;
      }
    solution: |
      long long maxHaul(const int *values, int n) {
          long long take = 0, skip = 0;
          for (int i = 0; i < n; i++) {
              long long next = skip + values[i];
              if (take > skip) skip = take;
              take = next;
          }
          return take > skip ? take : skip;
      }
