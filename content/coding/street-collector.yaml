id: street-collector
title: Street Collector
type: short
style: function
difficulty: medium
statement: |
  A charity collector walks along a street of houses, and knows how much each house will give. Asking at two
  neighbouring houses is not allowed.

  Complete the function `maxHaul`, which returns the largest total the collector can raise.

  The provided code reads the input and prints your function's return value.
inputFormat: |
  The first line contains `n`.

  The second line contains `n` amounts.
outputFormat: |
  The largest total.
constraints: |
  - 1 <= n <= 100000
  - 0 <= amount <= 1000000000
sampleTests:
  - input: |
      4
      1 2 3 1
    output: |
      4
  - input: |
      5
      2 7 9 3 1
    output: |
      12
hiddenTests:
  - input: |
      1
      5
    output: |
      5
  - input: |
      2
      3 8
    output: |
      8
  - input: |
      4
      9 1 1 9
    output: |
      18
    weight: 2
  - input: |
      3
      1000000000 0 1000000000
    output: |
      2000000000
  - file: street-collector-large
    weight: 3
checker:
  type: exact
editorial: |
  At each house, the best total either skips it, and keeps the best so far, or takes it, and adds its amount to
  the best total up to two houses back. Only those two values need keeping, so this takes O(n) time and O(1) space.
  Taking every second house fails on inputs like `9 1 1 9`. The total can exceed 32 bits, so use a 64-bit integer
  where that matters.
tags: [dp]
topics: [recursion-dp]
languages:
  csharp:
    starter: |
      public static long MaxHaul(int[] values)
      {
          // Write your code here.
          return 0;
      }
    harness: |
      using System;
      using System.Collections.Generic;
      using System.Linq;

      class Solution
      {
          {{USER_CODE}}

          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]);
              var values = new int[n];
              for (int i = 0; i < n; i++) values[i] = int.Parse(t[i + 1]);
              Console.WriteLine(MaxHaul(values));
          }
      }
    solution: |
      public static long MaxHaul(int[] values)
      {
          long take = 0, skip = 0;
          foreach (int value in values)
          {
              long next = skip + value;
              skip = Math.Max(skip, take);
              take = next;
          }
          return Math.Max(take, skip);
      }
