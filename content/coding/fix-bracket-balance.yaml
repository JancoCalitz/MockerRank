  c:
    starter: |
      #include <stdio.h>

      static char s[200002], stack[200002];

      int main(void) {
          int top = 0, balanced = 1;
          scanf("%200001s", s);
          for (char *p = s; *p; p++) {
              if (*p == '(' || *p == '[') stack[top++] = *p;
              else if (top == 0 || stack[--top] != (*p == ')' ? '(' : '[')) balanced = 0;
          }
          puts(balanced ? "YES" : "NO");
          return 0;
      }
