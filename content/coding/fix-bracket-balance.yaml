id: fix-bracket-balance
title: Fix the Bracket Balance
type: short
style: stdin
difficulty: medium
debug: true
statement: |
  This program should print `YES` if the brackets `(`, `)`, `[`, and `]` in a string are balanced, and `NO` if they are not. It uses a stack, but it has a bug.

  Find the bug and fix it. You should only need to change a small part of the code.
inputFormat: |
  One line containing a string of brackets.
outputFormat: |
  `YES` or `NO`.
constraints: |
  - 1 <= length of the string <= 200000
sampleTests:
  - input: |
      ([])
    output: |
      YES
  - input: |
      (()
    output: |
      NO
hiddenTests:
  - input: |
      (
    output: |
      NO
    weight: 2
  - input: |
      )
    output: |
      NO
  - input: |
      (]
    output: |
      NO
  - input: |
      ()[]
    output: |
      YES
  - file: fix-bracket-balance-large
    weight: 3
checker:
  type: exact
editorial: |
  The code checks every closing bracket correctly, but never checks that the stack is empty at the end, so opening brackets without a partner pass. Balanced means both that every closer matches and that nothing is left open.
tags: [debugging, stack]
topics: [debugging-code-reading, stacks-queues]
languages:
  csharp:
    starter: |
      using System;
      using System.Collections.Generic;

      class Solution
      {
          public static void Main(string[] args)
          {
              string s = Console.In.ReadToEnd().Trim();
              var stack = new Stack<char>();
              bool balanced = true;
              foreach (char c in s)
              {
                  if (c == '(' || c == '[') stack.Push(c);
                  else if (stack.Count == 0 || stack.Pop() != (c == ')' ? '(' : '[')) balanced = false;
              }
              Console.WriteLine(balanced ? "YES" : "NO");
          }
      }
    solution: |
      using System;
      using System.Collections.Generic;

      class Solution
      {
          public static void Main(string[] args)
          {
              string s = Console.In.ReadToEnd().Trim();
              var stack = new Stack<char>();
              bool balanced = true;
              foreach (char c in s)
              {
                  if (c == '(' || c == '[') stack.Push(c);
                  else if (stack.Count == 0 || stack.Pop() != (c == ')' ? '(' : '[')) balanced = false;
              }
              if (stack.Count > 0) balanced = false;
              Console.WriteLine(balanced ? "YES" : "NO");
          }
      }
