id: contract-picker
title: Contract Picker
type: long
style: stdin
difficulty: hard
statement: |
  A freelancer can take contracts, each with a start time, an end time, and a payment. Two contracts cannot overlap, but one can start at the exact moment another one ends.
  Find the largest total payment.
inputFormat: |
  The first line contains `n`.

  Each of the next `n` lines contains a contract's `start`, `end`, and `pay`.
outputFormat: |
  The largest total payment.
constraints: |
  - 1 <= n <= 100000
  - 0 <= start < end <= 1000000000
  - 1 <= pay <= 1000000
sampleTests:
  - input: |
      3
      1 3 50
      2 5 20
      3 6 70
    output: |
      120
  - input: |
      2
      1 10 5
      2 3 1
    output: |
      5
hiddenTests:
  - input: |
      1
      0 1 7
    output: |
      7
  - input: |
      3
      1 2 1
      2 3 1
      3 4 1
    output: |
      3
  - input: |
      3
      1 4 100
      1 2 60
      2 4 60
    output: |
      120
    weight: 2
  - input: |
      4
      1 5 10
      2 6 40
      5 7 30
      6 9 20
    output: |
      60
    weight: 2
  - file: contract-picker-large
    weight: 3
checker:
  type: exact
editorial: |
  Sort the contracts by end time. Let `best[i]` be the largest payment using the first `i` contracts. For each contract, either skip it, which keeps `best[i-1]`, or take it, adding its pay
  to `best[j]`, where `j` is the number of earlier contracts ending at or before its start. Sorted end times let you find `j` by binary search, so this takes O(n log n) time. Choosing greedily by
  pay, or by earliest end, fails when payments differ. The total can exceed 32 bits.
tags: [dp, binary-search, intervals]
topics: [recursion-dp, sorting-searching]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]);
              int[] starts = new int[n], ends = new int[n], pays = new int[n], order = new int[n];
              for (int i = 0; i < n; i++)
              {
                  starts[i] = int.Parse(t[1 + 3 * i]);
                  ends[i] = int.Parse(t[2 + 3 * i]);
                  pays[i] = int.Parse(t[3 + 3 * i]);
                  order[i] = i;
              }
              Array.Sort(order, (a, b) => ends[a].CompareTo(ends[b]));
              var best = new long[n + 1];
              for (int i = 1; i <= n; i++)
              {
                  int contract = order[i - 1], low = 0, high = i - 1;
                  while (low < high)
                  {
                      int mid = (low + high) / 2;
                      if (ends[order[mid]] <= starts[contract]) low = mid + 1;
                      else high = mid;
                  }
                  best[i] = Math.Max(best[i - 1], best[low] + pays[contract]);
              }
              Console.WriteLine(best[n]);
          }
      }
