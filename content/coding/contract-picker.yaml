      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]);
              long[][] contracts = new long[n][];
              for (int i = 0; i < n; i++) {
                  contracts[i] = new long[] {
                      Long.parseLong(t[1 + 3 * i]), Long.parseLong(t[2 + 3 * i]), Long.parseLong(t[3 + 3 * i])
                  };
              }
              Arrays.sort(contracts, (a, b) -> Long.compare(a[1], b[1]));
              long[] best = new long[n + 1];
              for (int i = 1; i <= n; i++) {
                  int low = 0, high = i - 1;
                  while (low < high) {
                      int mid = (low + high) / 2;
                      if (contracts[mid][1] <= contracts[i - 1][0]) {
                          low = mid + 1;
                      } else {
                          high = mid;
                      }
                  }
                  best[i] = Math.max(best[i - 1], best[low] + contracts[i - 1][2]);
              }
              System.out.println(best[n]);
          }
      }
