  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      typedef struct {
          int start, end, pay;
      } Contract;

      static int byEnd(const void *a, const void *b) {
          int x = ((const Contract *)a)->end, y = ((const Contract *)b)->end;
          return (x > y) - (x < y);
      }

      int main(void) {
          int n;
          scanf("%d", &n);
          Contract *contracts = malloc(sizeof(Contract) * n);
          for (int i = 0; i < n; i++) scanf("%d %d %d", &contracts[i].start, &contracts[i].end, &contracts[i].pay);
          qsort(contracts, n, sizeof(Contract), byEnd);
          long long *best = calloc(n + 1, sizeof(long long));
          for (int i = 1; i <= n; i++) {
              int low = 0, high = i - 1;
              while (low < high) {
                  int mid = (low + high) / 2;
                  if (contracts[mid].end <= contracts[i - 1].start) low = mid + 1;
                  else high = mid;
              }
              long long take = best[low] + contracts[i - 1].pay;
              best[i] = take > best[i - 1] ? take : best[i - 1];
          }
          printf("%lld\n", best[n]);
          return 0;
      }
