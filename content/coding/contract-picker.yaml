    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n;
          cin >> n;
          vector<array<int, 3>> contracts(n);
          for (auto& contract : contracts) cin >> contract[1] >> contract[0] >> contract[2];
          sort(contracts.begin(), contracts.end());
          vector<long long> best(n + 1);
          for (int i = 1; i <= n; i++) {
              int low = 0, high = i - 1;
              while (low < high) {
                  int mid = (low + high) / 2;
                  if (contracts[mid][0] <= contracts[i - 1][1]) low = mid + 1;
                  else high = mid;
              }
              best[i] = max(best[i - 1], best[low] + contracts[i - 1][2]);
          }
          cout << best[n] << endl;
