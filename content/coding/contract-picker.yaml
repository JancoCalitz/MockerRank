  python:
    starter: |
      import sys

      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import sys
      from bisect import bisect_right

      t = sys.stdin.read().split()
      n = int(t[0])
      contracts = sorted(
          ((int(t[2 + 3 * i]), int(t[1 + 3 * i]), int(t[3 + 3 * i])) for i in range(n)),
      )
      ends = [contract[0] for contract in contracts]
      best = [0] * (n + 1)
      for i, (end, start, pay) in enumerate(contracts, 1):
          earlier = bisect_right(ends, start, 0, i - 1)
          best[i] = max(best[i - 1], best[earlier] + pay)
      print(best[n])
