id: missing-ticket
title: Missing Ticket
type: short
style: function
difficulty: easy
statement: |
  An event sold tickets numbered from `1` to `n + 1`, and collected `n` of them at the door. Exactly one ticket was
  never collected.

  Complete the function `missingTicket`, which returns the number of that ticket.

  The provided code reads the input and prints your function's return value.
inputFormat: |
  The first line contains `n`.

  The second line contains the `n` collected ticket numbers, in no particular order.
outputFormat: |
  The missing ticket number.
constraints: |
  - 0 <= n <= 199999
  - All of the collected numbers are different.
sampleTests:
  - input: |
      3
      1 4 2
    output: |
      3
  - input: |
      1
      1
    output: |
      2
hiddenTests:
  - input: |
      0
    output: |
      1
    weight: 2
  - input: |
      2
      3 2
    output: |
      1
  - input: |
      4
      1 2 3 4
    output: |
      5
  - file: missing-ticket-large
    weight: 3
checker:
  type: exact
editorial: |
  The numbers from `1` to `n + 1` add up to `(n + 1) * (n + 2) / 2`, so the missing number is that total minus the sum of the
  collected tickets. This takes O(n) time and O(1) space. The total can exceed 32 bits, so use a 64-bit integer, or XOR
  everything instead. Searching for each number in the list takes O(n^2) time.
tags: [arrays, math]
topics: [arrays-strings]
