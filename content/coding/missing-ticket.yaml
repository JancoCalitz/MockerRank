  csharp:
    starter: |
      public static int MissingTicket(int[] values)
      {
          // Write your code here.
          return 0;
      }
    harness: |
      using System;
      using System.Collections.Generic;
      using System.Linq;

      class Solution
      {
          {{USER_CODE}}

          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]);
              var values = new int[n];
              for (int i = 0; i < n; i++) values[i] = int.Parse(t[i + 1]);
              Console.WriteLine(MissingTicket(values));
          }
      }
    solution: |
      public static int MissingTicket(int[] values)
      {
          long n = values.Length;
          long total = (n + 1) * (n + 2) / 2;
          foreach (int value in values) total -= value;
          return (int)total;
      }
