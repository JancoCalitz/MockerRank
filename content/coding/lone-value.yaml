      }
    harness: |
      using System;
      using System.Collections.Generic;
      using System.Linq;

      class Solution
      {
          {{USER_CODE}}

          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]);
              var values = new int[n];
              for (int i = 0; i < n; i++) values[i] = int.Parse(t[i + 1]);
              Console.WriteLine(LoneValue(values));
          }
      }
    solution: |
      public static int LoneValue(int[] values)
      {
          int result = 0;
          foreach (int value in values) result ^= value;
          return result;
      }
