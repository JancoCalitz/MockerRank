id: lone-value
title: Lone Value
type: short
style: function
difficulty: easy
statement: |
  A warehouse scans every item in pairs, but one item was scanned only once. Every other ID appears
  exactly twice.

  Complete the function `loneValue`, which returns the ID that appears once.

  The provided code reads the input and prints your function's return value.
inputFormat: |
  The first line contains `n`, the number of scans.

  The second line contains `n` IDs.
outputFormat: |
  The ID that appears once.
constraints: |
  - 1 <= n <= 199999, and `n` is odd
  - 1 <= ID <= 1000000000
sampleTests:
  - input: |
      5
      4 9 4 2 9
    output: |
      2
  - input: |
      1
      7
    output: |
      7
hiddenTests:
  - input: |
      3
      8 8 1
    output: |
      1
  - input: |
      3
      1000000000 5 5
    output: |
      1000000000
  - input: |
      7
      1 2 3 4 3 2 1
    output: |
      4
  - file: lone-value-large
    weight: 3
checker:
  type: exact
editorial: |
  A value XORed with itself is 0, so XORing every ID leaves only the one without a partner. This takes
  O(n) time and O(1) space. A hash set of unpaired IDs also takes O(n) time, but O(n) space. Counting
  each ID with a nested loop takes O(n^2) time, which is too slow for the largest test.
tags: [xor, hash-set]
topics: [hashing]
