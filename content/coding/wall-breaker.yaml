      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean);
      const rows = Number(t[0]);
      const cols = Number(t[1]);
      const dist = new Int32Array(rows * cols * 2).fill(-1);
      const queue = new Int32Array(rows * cols * 2);
      let front = 0;
      let back = 0;
      dist[0] = 0;
      queue[back++] = 0;
      const moves = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      let answer = -1;
      while (front < back) {
        const state = queue[front++];
        const broken = state % 2;
        const cell = (state - broken) / 2;
        const c = cell % cols;
        const r = (cell - c) / cols;
        if (r === rows - 1 && c === cols - 1) {
          answer = dist[state];
          break;
        }
        for (const [dr, dc] of moves) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr < 0 || nc < 0 || nr >= rows || nc >= cols) continue;
          const nb = broken + (t[2 + nr][nc] === '#' ? 1 : 0);
          if (nb > 1) continue;
          const next = (nr * cols + nc) * 2 + nb;
          if (dist[next] >= 0) continue;
          dist[next] = dist[state] + 1;
          queue[back++] = next;
        }
      }
      console.log(answer);
