id: wall-breaker
title: One Wall Shortcut
type: long
style: stdin
difficulty: hard
statement: |
  A robot moves on a grid from the top-left cell to the bottom-right cell, one step at a time, up, down,
  left, or right. Cells are open (`.`) or walls (`#`). The robot can break through at most one wall
  during the whole trip, which lets it enter that cell.

  Print the smallest number of steps needed, or `-1` if the trip is impossible.
inputFormat: |
  The first line contains `r` and `c`, the numbers of rows and columns.

  Each of the next `r` lines contains `c` characters. The first and last cells are always open.
outputFormat: |
  The smallest number of steps, or `-1`.
constraints: |
  - 1 <= r, c <= 300
sampleTests:
  - input: |
      3 3
      .#.
      .#.
      .#.
    output: |
      4
  - input: |
      2 2
      .#
      #.
    output: |
      2
hiddenTests:
  - input: |
      1 1
      .
    output: |
      0
  - input: |
      3 3
      .##
      ###
      ##.
    output: |
      -1
  - input: |
      2 3
      ...
      ...
    output: |
      3
  - input: |
      3 5
      ..#..
      ..#..
      ..#..
    output: |
      6
  - input: |
      4 1
      .
      #
      #
      .
    output: |
      -1
    weight: 2
  - input: |
      3 1
      .
      #
      .
    output: |
      2
  - input: |
      3 4
      .#..
      .#.#
      ...#
    output: |
      5
    weight: 2
  - input: |
      200 200
