    solution: |
      import sys
      from collections import deque

      t = sys.stdin.read().split()
      rows, cols = int(t[0]), int(t[1])
      grid = t[2:2 + rows]
      dist = {(0, 0, 0): 0}
      queue = deque([(0, 0, 0)])
      answer = -1
      while queue:
          r, c, broken = queue.popleft()
          if r == rows - 1 and c == cols - 1:
              answer = dist[(r, c, broken)]
              break
          for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
              nr, nc = r + dr, c + dc
              if not (0 <= nr < rows and 0 <= nc < cols):
                  continue
              nb = broken + (grid[nr][nc] == '#')
              if nb > 1 or (nr, nc, nb) in dist:
                  continue
              dist[(nr, nc, nb)] = dist[(r, c, broken)] + 1
              queue.append((nr, nc, nb))
      print(answer)
