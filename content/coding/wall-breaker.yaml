checker:
  type: exact
editorial: |
  Run a breadth-first search over states of (row, column, whether a wall has been broken). Each state is
  visited once, so this takes O(rc) time and space. Tracking only the cell is the common mistake: a
  cell first reached after breaking a wall must still be reachable by a longer route that has not
  broken one, as that route may need its break later on. Depth-first search does not give shortest
  paths here.
tags: [graphs, bfs]
topics: [trees-graphs]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;
      using System.Collections.Generic;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int rows = int.Parse(t[0]), cols = int.Parse(t[1]);
              var dist = new int[rows * cols * 2];
              Array.Fill(dist, -1);
              var queue = new Queue<int>();
              dist[0] = 0;
              queue.Enqueue(0);
              int[] dr = { 1, -1, 0, 0 }, dc = { 0, 0, 1, -1 };
              while (queue.Count > 0)
              {
                  int state = queue.Dequeue();
                  int broken = state % 2, cell = state / 2, r = cell / cols, c = cell % cols;
                  if (r == rows - 1 && c == cols - 1)
                  {
                      Console.WriteLine(dist[state]);
                      return;
                  }
                  for (int d = 0; d < 4; d++)
                  {
                      int nr = r + dr[d], nc = c + dc[d];
                      if (nr < 0 || nc < 0 || nr >= rows || nc >= cols) continue;
                      int nb = broken + (t[2 + nr][nc] == '#' ? 1 : 0);
                      if (nb > 1) continue;
                      int next = (nr * cols + nc) * 2 + nb;
                      if (dist[next] >= 0) continue;
                      dist[next] = dist[state] + 1;
                      queue.Enqueue(next);
                  }
              }
              Console.WriteLine(-1);
          }
      }
