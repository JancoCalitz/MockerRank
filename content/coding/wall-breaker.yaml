      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int rows = Integer.parseInt(t[0]), cols = Integer.parseInt(t[1]);
              int[] dist = new int[rows * cols * 2];
              Arrays.fill(dist, -1);
              int[] queue = new int[rows * cols * 2];
              int front = 0, back = 0;
              dist[0] = 0;
              queue[back++] = 0;
              int[] dr = { 1, -1, 0, 0 }, dc = { 0, 0, 1, -1 };
              while (front < back) {
                  int state = queue[front++];
                  int broken = state % 2, cell = state / 2, r = cell / cols, c = cell % cols;
                  if (r == rows - 1 && c == cols - 1) {
                      System.out.println(dist[state]);
                      return;
                  }
                  for (int d = 0; d < 4; d++) {
                      int nr = r + dr[d], nc = c + dc[d];
                      if (nr < 0 || nc < 0 || nr >= rows || nc >= cols) continue;
                      int nb = broken + (t[2 + nr].charAt(nc) == '#' ? 1 : 0);
                      if (nb > 1) continue;
                      int next = (nr * cols + nc) * 2 + nb;
                      if (dist[next] >= 0) continue;
                      dist[next] = dist[state] + 1;
                      queue[back++] = next;
                  }
              }
              System.out.println(-1);
          }
      }
