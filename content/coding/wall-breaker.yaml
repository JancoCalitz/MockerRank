      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int rows, cols;
          cin >> rows >> cols;
          vector<string> grid(rows);
          for (auto& row : grid) cin >> row;
          vector<int> dist(rows * cols * 2, -1);
          queue<int> states;
          dist[0] = 0;
          states.push(0);
          int dr[] = {1, -1, 0, 0}, dc[] = {0, 0, 1, -1};
          while (!states.empty()) {
              int state = states.front();
              states.pop();
              int broken = state % 2, cell = state / 2, r = cell / cols, c = cell % cols;
              if (r == rows - 1 && c == cols - 1) {
                  cout << dist[state] << endl;
                  return 0;
              }
              for (int d = 0; d < 4; d++) {
                  int nr = r + dr[d], nc = c + dc[d];
