id: trending-words
title: Trending Words
type: long
style: stdin
difficulty: medium
statement: |
  A forum wants to show its trending words. Find the `k` most common words in a list of words. Put the words with higher
  counts first, and put words with equal counts in alphabetical order. If there are fewer than `k` different words, show
  them all.
inputFormat: |
  The first line contains `n` and `k`.

  The second line contains `n` lowercase words.
outputFormat: |
  One line for each word shown, containing the word and its count.
constraints: |
  - 1 <= n <= 100000
  - 1 <= k <= 100000
  - 1 <= length of a word <= 10
sampleTests:
  - input: |
      6 2
      red blue red green blue red
    output: |
      red 3
      blue 2
  - input: |
      3 5
      b a b
    output: |
      b 2
      a 1
hiddenTests:
  - input: |
      1 1
      solo
    output: |
      solo 1
  - input: |
      3 2
      cc bb aa
    output: |
      aa 1
      bb 1
    weight: 2
  - input: |
      4 1
      b a b a
    output: |
      a 2
  - input: |
      4 3
      ab a abc a
    output: |
      a 2
      ab 1
      abc 1
  - file: trending-words-large
    weight: 3
checker:
  type: exact
editorial: |
  Count each word with a hash map, then sort the distinct words by count from high to low, and by word from low to high.
  This takes O(n + d log d) time for `d` distinct words. A heap of size `k` reduces the sort to O(d log k). Compare words by
  their characters, not with a locale-aware comparison. Note that a shorter word comes before a longer word that starts
  with it.
tags: [hash-map, sorting]
topics: [hashing, sorting-searching]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;
      using System.Collections.Generic;
      using System.Linq;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), k = int.Parse(t[1]);
              var counts = new Dictionary<string, int>();
              for (int i = 0; i < n; i++)
              {
                  counts.TryGetValue(t[2 + i], out int count);
                  counts[t[2 + i]] = count + 1;
              }
              var top = counts.OrderByDescending(pair => pair.Value)
                  .ThenBy(pair => pair.Key, StringComparer.Ordinal)
                  .Take(k)
                  .Select(pair => pair.Key + " " + pair.Value);
              Console.WriteLine(string.Join("\n", top));
          }
      }
  java:
    starter: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              // Read from System.in and write to System.out.
          }
      }
    solution: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]), k = Integer.parseInt(t[1]);
              Map<String, Integer> counts = new HashMap<>();
              for (int i = 0; i < n; i++) {
                  counts.merge(t[2 + i], 1, Integer::sum);
              }
              List<String> words = new ArrayList<>(counts.keySet());
              words.sort((a, b) -> {
                  int byCount = counts.get(b) - counts.get(a);
                  return byCount != 0 ? byCount : a.compareTo(b);
              });
              StringBuilder output = new StringBuilder();
              for (int i = 0; i < Math.min(k, words.size()); i++) {
                  output.append(words.get(i)).append(' ').append(counts.get(words.get(i))).append('\n');
              }
              System.out.print(output);
          }
      }
