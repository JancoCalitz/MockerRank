    solution: |
      import { readFileSync } from 'node:fs';

      const t: string[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean);
      const n = Number(t[0]);
      const k = Number(t[1]);
      const counts = new Map<string, number>();
      for (let i = 0; i < n; i++) counts.set(t[2 + i]!, (counts.get(t[2 + i]!) ?? 0) + 1);
      const words: string[] = [...counts.keys()].sort((a, b) => {
        const byCount = counts.get(b)! - counts.get(a)!;
        if (byCount !== 0) return byCount;
        return a < b ? -1 : a > b ? 1 : 0;
      });
      console.log(words.slice(0, k).map((word) => `${word} ${counts.get(word)}`).join('\n'));
  python:
    starter: |
      import sys

      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import sys
      from collections import Counter

      t = sys.stdin.read().split()
      n, k = int(t[0]), int(t[1])
      counts = Counter(t[2:2 + n])
      words = sorted(counts, key=lambda word: (-counts[word], word))
      print('\n'.join(f'{word} {counts[word]}' for word in words[:k]))
