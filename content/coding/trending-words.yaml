    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n, k;
          cin >> n >> k;
          unordered_map<string, int> counts;
          string word;
          for (int i = 0; i < n; i++) {
              cin >> word;
              counts[word]++;
          }
          vector<pair<int, string>> entries;
          for (auto& [text, count] : counts) entries.push_back({-count, text});
          sort(entries.begin(), entries.end());
          for (int i = 0; i < min(k, (int)entries.size()); i++) {
              cout << entries[i].second << ' ' << -entries[i].first << '\n';
          }
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>
      #include <string.h>

      typedef struct {
          char text[11];
          int count;
      } Entry;

      static int byText(const void *a, const void *b) {
          return strcmp(((const Entry *)a)->text, ((const Entry *)b)->text);
      }

      static int byCount(const void *a, const void *b) {
          const Entry *x = a, *y = b;
          if (x->count != y->count) return y->count - x->count;
          return strcmp(x->text, y->text);
      }

      int main(void) {
          int n, k, distinct = 0;
          scanf("%d %d", &n, &k);
          Entry *entries = malloc(sizeof(Entry) * n);
          for (int i = 0; i < n; i++) scanf("%10s", entries[i].text);
          qsort(entries, n, sizeof(Entry), byText);
          for (int i = 0; i < n; i++) {
              if (distinct > 0 && strcmp(entries[distinct - 1].text, entries[i].text) == 0) {
                  entries[distinct - 1].count++;
              } else {
                  if (distinct != i) strcpy(entries[distinct].text, entries[i].text);
                  entries[distinct].count = 1;
                  distinct++;
              }
          }
          qsort(entries, distinct, sizeof(Entry), byCount);
          for (int i = 0; i < k && i < distinct; i++) printf("%s %d\n", entries[i].text, entries[i].count);
          free(entries);
          return 0;
      }
  javascript:
    starter: |
      const input = require('fs').readFileSync(0, 'utf8');
      // Parse the input and print the answer with console.log.
    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean);
      const n = Number(t[0]);
      const k = Number(t[1]);
      const counts = new Map();
      for (let i = 0; i < n; i++) counts.set(t[2 + i], (counts.get(t[2 + i]) ?? 0) + 1);
      const words = [...counts.keys()].sort((a, b) => {
        const byCount = counts.get(b) - counts.get(a);
        if (byCount !== 0) return byCount;
        return a < b ? -1 : a > b ? 1 : 0;
      });
      console.log(words.slice(0, k).map((word) => `${word} ${counts.get(word)}`).join('\n'));
