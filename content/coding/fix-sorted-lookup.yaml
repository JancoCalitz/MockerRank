  javascript:
    starter: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const [n, q] = t;
      const output = [];
      for (let i = 0; i < q; i++) {
        const query = t[2 + n + i];
        let low = 0;
        let high = n - 1;
        let found = false;
        while (low < high) {
          const mid = (low + high) >> 1;
          if (t[2 + mid] === query) {
            found = true;
            break;
          }
          if (t[2 + mid] < query) low = mid + 1;
          else high = mid - 1;
        }
        output.push(found ? 'YES' : 'NO');
      }
      console.log(output.join(' '));
