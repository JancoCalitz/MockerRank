  python:
    starter: |
      import sys

      t = [int(x) for x in sys.stdin.read().split()]
      n, q = t[0], t[1]
      codes = t[2:2 + n]
      output = []
      for query in t[2 + n:2 + n + q]:
          low, high = 0, n - 1
          found = False
          while low < high:
              mid = (low + high) // 2
              if codes[mid] == query:
                  found = True
                  break
              if codes[mid] < query:
                  low = mid + 1
              else:
                  high = mid - 1
          output.append('YES' if found else 'NO')
      print(' '.join(output))
