    solution: |
      import sys
      from collections import OrderedDict

      t = sys.stdin.read().split()
      capacity, q = int(t[0]), int(t[1])
      shelf = OrderedDict()
      output = []
      at = 2
      for _ in range(q):
          command, key = t[at], t[at + 1]
          at += 2
          if command == 'GET':
              if key in shelf:
                  shelf.move_to_end(key)
                  output.append(shelf[key])
              else:
                  output.append('-1')
          else:
              shelf[key] = t[at]
              at += 1
              shelf.move_to_end(key)
              if len(shelf) > capacity:
                  shelf.popitem(last=False)
      print('\n'.join(output))
