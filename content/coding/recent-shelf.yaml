      #define KEYS 100001

      static int before[KEYS], after[KEYS], values[KEYS];

      static void unlinkKey(int key) {
          after[before[key]] = after[key];
          before[after[key]] = before[key];
      }

      static void moveToFront(int key) {
          before[key] = 0;
          after[key] = after[0];
          before[after[0]] = key;
          after[0] = key;
      }

      int main(void) {
          int capacity, q, size = 0;
          scanf("%d %d", &capacity, &q);
          for (int i = 0; i < q; i++) {
              char command[8];
