      }
    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int capacity, q;
          cin >> capacity >> q;
          list<pair<int, int>> shelf;
          unordered_map<int, list<pair<int, int>>::iterator> where;
          string output;
          for (int i = 0; i < q; i++) {
              string command;
              int key;
              cin >> command >> key;
              auto found = where.find(key);
              if (command == "GET") {
                  if (found == where.end()) {
                      output += "-1\n";
                  } else {
                      shelf.splice(shelf.begin(), shelf, found->second);
                      output += to_string(found->second->second) + "\n";
                  }
              } else {
                  int value;
                  cin >> value;
                  if (found != where.end()) {
                      found->second->second = value;
                      shelf.splice(shelf.begin(), shelf, found->second);
                  } else {
                      shelf.push_front({key, value});
                      where[key] = shelf.begin();
                      if ((int)shelf.size() > capacity) {
                          where.erase(shelf.back().first);
                          shelf.pop_back();
                      }
                  }
              }
          }
          cout << output;
          return 0;
      }
