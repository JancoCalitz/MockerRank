id: recent-shelf
title: Recent Shelf
type: long
style: stdin
difficulty: medium
statement: |
  A small shelf keeps the items that were used most recently. It holds at most `capacity` items, and handles
  two commands:

  - `PUT key value` stores the value under the key, replacing any earlier value. If this puts the shelf over its
    capacity, it removes the least recently used item.
  - `GET key` prints the key's value, or `-1` if the key is not on the shelf.

  Both commands count as using the key, unless a `GET` finds nothing.
inputFormat: |
  The first line contains `capacity` and `q`, the number of commands.

  Each of the next `q` lines contains a command.
outputFormat: |
  One line for each `GET` command.
constraints: |
  - 1 <= capacity <= 100000
  - 1 <= q <= 100000
  - 1 <= key <= 100000
  - 1 <= value <= 1000000
  - There is at least one `GET` command.
sampleTests:
  - input: |
      2 5
      PUT 1 10
      PUT 2 20
      GET 1
      PUT 3 30
      GET 2
    output: |
      10
      -1
  - input: |
      1 3
      PUT 5 1
      PUT 5 2
      GET 5
    output: |
      2
hiddenTests:
  - input: |
      1 3
      PUT 1 1
      PUT 2 2
      GET 1
    output: |
      -1
  - input: |
      2 1
      GET 7
    output: |
      -1
  - input: |
      2 6
      PUT 1 1
      PUT 2 2
      PUT 1 9
      PUT 3 3
      GET 1
      GET 2
    output: |
      9
      -1
    weight: 2
  - input: |
      2 6
      PUT 1 1
      PUT 2 2
      GET 3
      PUT 3 3
      GET 2
      GET 1
    output: |
      -1
      2
      -1
  - file: recent-shelf-large
    weight: 3
checker:
  type: exact
editorial: |
  Both commands must take O(1) time. Combine a hash map, which finds an item directly, with a doubly linked list
  in order of use. Using an item moves it to the front, and the item at the back is the one to remove. A list with no
  hash map takes O(capacity) time to find an item, which is too slow here. Many languages have a suitable structure:
  `LinkedHashMap` in Java, an insertion-ordered `Map` in JavaScript, and `OrderedDict` in Python. Updating an existing
  key must not remove anything, and it still counts as a use.
tags: [cache, design]
topics: [linked-lists, oop-design]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;
      using System.Text;

      class Solution
      {
          const int Keys = 100001;
          static int[] before = new int[Keys], after = new int[Keys];

          static void Unlink(int key)
          {
              after[before[key]] = after[key];
              before[after[key]] = before[key];
          }

          static void MoveToFront(int key)
          {
              before[key] = 0;
              after[key] = after[0];
              before[after[0]] = key;
              after[0] = key;
          }

          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int capacity = int.Parse(t[0]), q = int.Parse(t[1]), at = 2, size = 0;
              var values = new int[Keys];
              var output = new StringBuilder();
              for (int i = 0; i < q; i++)
              {
                  string command = t[at++];
                  int key = int.Parse(t[at++]);
                  if (command == "GET")
                  {
                      if (values[key] != 0)
                      {
                          Unlink(key);
                          MoveToFront(key);
                      }
                      output.Append(values[key] != 0 ? values[key] : -1).Append('\n');
                  }
                  else
                  {
                      int value = int.Parse(t[at++]);
                      if (values[key] != 0) Unlink(key);
                      else size++;
                      values[key] = value;
                      MoveToFront(key);
                      if (size > capacity)
                      {
                          int oldest = before[0];
                          Unlink(oldest);
                          values[oldest] = 0;
                          size--;
                      }
                  }
              }
              Console.Write(output);
          }
      }
  java:
    starter: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              // Read from System.in and write to System.out.
          }
      }
    solution: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              final int capacity = Integer.parseInt(t[0]);
              int q = Integer.parseInt(t[1]), at = 2;
              LinkedHashMap<Integer, Integer> shelf = new LinkedHashMap<>(16, 0.75f, true) {
                  @Override
                  protected boolean removeEldestEntry(Map.Entry<Integer, Integer> eldest) {
                      return size() > capacity;
                  }
              };
              StringBuilder output = new StringBuilder();
              for (int i = 0; i < q; i++) {
                  String command = t[at++];
                  int key = Integer.parseInt(t[at++]);
                  if (command.equals("GET")) {
                      Integer value = shelf.get(key);
                      output.append(value == null ? -1 : value).append('\n');
                  } else {
                      shelf.put(key, Integer.parseInt(t[at++]));
                  }
              }
              System.out.print(output);
          }
      }
  cpp:
    starter: |
      #include <bits/stdc++.h>
