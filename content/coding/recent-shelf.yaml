      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean);
      const capacity = Number(t[0]);
      const q = Number(t[1]);
      const shelf = new Map();
      const output = [];
      let at = 2;
      for (let i = 0; i < q; i++) {
        const command = t[at++];
        const key = t[at++];
        if (command === 'GET') {
          if (shelf.has(key)) {
            const value = shelf.get(key);
            shelf.delete(key);
            shelf.set(key, value);
            output.push(value);
          } else {
            output.push('-1');
          }
        } else {
          shelf.delete(key);
          shelf.set(key, t[at++]);
          if (shelf.size > capacity) shelf.delete(shelf.keys().next().value);
        }
      }
      console.log(output.join('\n'));
