id: fix-window-total
title: Fix the Window Total
type: short
style: stdin
difficulty: easy
debug: true
statement: |
  A shop wants the largest total sales across any `k` consecutive days. This program uses a sliding window, but it has a bug.

  Find the bug and fix it. You should only need to change a small part of the code.
inputFormat: |
  The first line contains `n` and `k`.

  The second line contains `n` daily totals.
outputFormat: |
  The largest total of `k` consecutive days.
constraints: |
  - 1 <= k <= n <= 100000
  - 0 <= daily total <= 10000
sampleTests:
  - input: |
      5 2
      5 1 1 1 1
    output: |
      6
  - input: |
      4 2
      1 1 1 9
    output: |
      10
hiddenTests:
  - input: |
      1 1
      3
    output: |
      3
  - input: |
      3 3
      1 2 3
    output: |
      6
  - input: |
      5 1
      1 2 3 4 5
    output: |
      5
    weight: 2
  - file: fix-window-total-large
    weight: 3
checker:
  type: exact
editorial: |
  The loop stops one position early, so the last window is never checked. This is an off-by-one error. When a bug only affects answers at the end of the input, check the loop's boundary first.
tags: [debugging, sliding-window]
topics: [debugging-code-reading, arrays-strings]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), k = int.Parse(t[1]);
              var days = new int[n];
              for (int i = 0; i < n; i++) days[i] = int.Parse(t[2 + i]);
              int total = 0;
              for (int i = 0; i < k; i++) total += days[i];
              int best = total;
              for (int i = k; i < n - 1; i++)
              {
                  total += days[i] - days[i - k];
                  best = Math.Max(best, total);
              }
              Console.WriteLine(best);
          }
      }
