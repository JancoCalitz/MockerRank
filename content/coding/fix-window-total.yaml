      import sys

      t = [int(x) for x in sys.stdin.read().split()]
      n, k = t[0], t[1]
      days = t[2:2 + n]
      total = sum(days[:k])
      best = total
      for i in range(k, n - 1):
          total += days[i] - days[i - k]
          best = max(best, total)
      print(best)
