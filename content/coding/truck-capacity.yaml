    solution: |
      int minCapacity(const vector<int>& values, int days) {
          int low = *max_element(values.begin(), values.end());
          int high = accumulate(values.begin(), values.end(), 0);
          while (low < high) {
              int mid = low + (high - low) / 2, used = 1, load = 0;
              for (int weight : values) {
                  if (load + weight > mid) {
                      used++;
                      load = 0;
                  }
                  load += weight;
              }
              if (used <= days) high = mid;
              else low = mid + 1;
          }
          return low;
      }
