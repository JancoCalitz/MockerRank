    harness: |
      using System;
      using System.Collections.Generic;
      using System.Linq;

      class Solution
      {
          {{USER_CODE}}

          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]);
              int days = int.Parse(t[1]);
              var values = new int[n];
              for (int i = 0; i < n; i++) values[i] = int.Parse(t[i + 2]);
              Console.WriteLine(MinCapacity(values, days));
          }
      }
    solution: |
      public static int MinCapacity(int[] values, int days)
      {
          int low = values.Max(), high = values.Sum();
          while (low < high)
          {
              int mid = low + (high - low) / 2, used = 1, load = 0;
              foreach (int weight in values)
              {
                  if (load + weight > mid)
                  {
                      used++;
                      load = 0;
                  }
                  load += weight;
              }
              if (used <= days) high = mid;
              else low = mid + 1;
          }
          return low;
      }
