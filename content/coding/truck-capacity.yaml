    solution: |
      def min_capacity(values, days):
          low, high = max(values), sum(values)
          while low < high:
              mid = (low + high) // 2
              used, load = 1, 0
              for weight in values:
                  if load + weight > mid:
                      used += 1
                      load = 0
                  load += weight
              if used <= days:
                  high = mid
              else:
                  low = mid + 1
          return low
