    solution: |
      static int minCapacity(int[] values, int days) {
          int low = 0, high = 0;
          for (int weight : values) {
              low = Math.max(low, weight);
              high += weight;
          }
          while (low < high) {
              int mid = low + (high - low) / 2, used = 1, load = 0;
              for (int weight : values) {
                  if (load + weight > mid) {
                      used++;
                      load = 0;
                  }
                  load += weight;
              }
              if (used <= days) {
                  high = mid;
              } else {
                  low = mid + 1;
              }
          }
          return low;
      }
