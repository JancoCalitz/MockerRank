id: truck-capacity
title: Truck Capacity
type: short
style: function
difficulty: medium
statement: |
  Parcels leave a depot in a fixed order. Each day, one truck takes the next parcels in the queue, as long as
  their total weight stays within its capacity. Every parcel must be gone within `days` days.

  Complete the function `minCapacity`, which returns the smallest capacity that makes this possible.

  The provided code reads the input and prints your function's return value.
inputFormat: |
  The first line contains `n` and `days`.

  The second line contains the `n` parcel weights, in order.
outputFormat: |
  The smallest capacity.
constraints: |
  - 1 <= days <= n <= 50000
  - 1 <= weight <= 1000
sampleTests:
  - input: |
      5 2
      1 2 3 4 5
    output: |
      9
  - input: |
      4 4
      3 1 2 2
    output: |
      3
hiddenTests:
  - input: |
      1 1
      7
    output: |
      7
  - input: |
      3 1
      1 2 3
    output: |
      6
  - input: |
      6 3
      3 2 2 4 1 4
    output: |
      6
    weight: 2
  - file: truck-capacity-large
    weight: 3
checker:
  type: exact
editorial: |
  The capacity must be between the heaviest parcel and the total weight, and any capacity above a workable one also
  works. So you can binary search on the capacity. For each guess, count the days needed by filling trucks in
  order, which takes O(n) time. The total is O(n log(sum of weights)) time. Trying each capacity in turn is too slow.
tags: [binary-search]
topics: [sorting-searching]
