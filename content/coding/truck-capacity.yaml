    solution: |
      int minCapacity(const int *values, int n, int days) {
          int low = 0, high = 0;
          for (int i = 0; i < n; i++) {
              if (values[i] > low) low = values[i];
              high += values[i];
          }
          while (low < high) {
              int mid = low + (high - low) / 2, used = 1, load = 0;
              for (int i = 0; i < n; i++) {
                  if (load + values[i] > mid) {
                      used++;
                      load = 0;
                  }
                  load += values[i];
              }
              if (used <= days) high = mid;
              else low = mid + 1;
          }
          return low;
      }
