    solution: |
      import { readFileSync } from 'node:fs';

      const words: string[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean);
      const a = words[0]!;
      const b = words[1]!;
      const row: number[] = Array.from({ length: b.length + 1 }, (_, j) => j);
      for (let i = 1; i <= a.length; i++) {
        let diagonal = row[0]!;
        row[0] = i;
        for (let j = 1; j <= b.length; j++) {
          const above = row[j]!;
          row[j] = a[i - 1] === b[j - 1] ? diagonal : 1 + Math.min(diagonal, above, row[j - 1]!);
          diagonal = above;
        }
      }
      console.log(row[b.length]);
