id: typo-cost
title: Typo Cost
type: long
style: stdin
difficulty: medium
statement: |
  A spell checker measures how far a typed word is from a dictionary word. One edit inserts a letter, deletes a
  letter, or replaces a letter. Find the smallest number of edits that turns the first word into the second.
inputFormat: |
  Two lines, each containing a word of lowercase letters.
outputFormat: |
  The smallest number of edits.
constraints: |
  - 1 <= length of each word <= 1500
sampleTests:
  - input: |
      horse
      ros
    output: |
      3
  - input: |
      same
      same
    output: |
      0
hiddenTests:
  - input: |
      a
      b
    output: |
      1
  - input: |
      abc
      abcd
    output: |
      1
  - input: |
      intention
      execution
    output: |
      5
    weight: 2
  - input: |
      z
      zzz
    output: |
      2
  - file: typo-cost-large
    weight: 3
checker:
  type: exact
editorial: |
  Let `cost[i][j]` be the edits needed to turn the first `i` letters of one word into the first `j` letters of the
  other. If the letters match, it equals `cost[i-1][j-1]`. Otherwise, it is 1 plus the smallest of `cost[i-1][j]`,
  `cost[i][j-1]`, and `cost[i-1][j-1]`. The first row and column count pure insertions and deletions. This takes
  O(n * m) time, and keeping only one previous row reduces the space to O(m). Plain recursion takes exponential time.
tags: [dp, strings]
topics: [recursion-dp]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              string a = Console.ReadLine().Trim(), b = Console.ReadLine().Trim();
              var row = new int[b.Length + 1];
              for (int j = 0; j <= b.Length; j++) row[j] = j;
              for (int i = 1; i <= a.Length; i++)
              {
                  int diagonal = row[0];
                  row[0] = i;
                  for (int j = 1; j <= b.Length; j++)
                  {
                      int above = row[j];
                      row[j] = a[i - 1] == b[j - 1]
                          ? diagonal
                          : 1 + Math.Min(diagonal, Math.Min(above, row[j - 1]));
                      diagonal = above;
                  }
              }
              Console.WriteLine(row[b.Length]);
          }
      }
  java:
    starter: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              // Read from System.in and write to System.out.
          }
      }
    solution: |
      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              BufferedReader reader = new BufferedReader(new InputStreamReader(System.in));
              String a = reader.readLine().trim(), b = reader.readLine().trim();
              int[] row = new int[b.length() + 1];
              for (int j = 0; j <= b.length(); j++) {
                  row[j] = j;
              }
              for (int i = 1; i <= a.length(); i++) {
                  int diagonal = row[0];
                  row[0] = i;
                  for (int j = 1; j <= b.length(); j++) {
                      int above = row[j];
                      row[j] = a.charAt(i - 1) == b.charAt(j - 1)
                          ? diagonal
                          : 1 + Math.min(diagonal, Math.min(above, row[j - 1]));
                      diagonal = above;
                  }
              }
              System.out.println(row[b.length()]);
          }
      }
  cpp:
    starter: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          // Read from cin and write to cout.
          return 0;
      }
    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          string a, b;
          cin >> a >> b;
          vector<int> row(b.size() + 1);
          iota(row.begin(), row.end(), 0);
          for (size_t i = 1; i <= a.size(); i++) {
              int diagonal = row[0];
              row[0] = i;
              for (size_t j = 1; j <= b.size(); j++) {
                  int above = row[j];
                  row[j] = a[i - 1] == b[j - 1] ? diagonal : 1 + min({diagonal, above, row[j - 1]});
                  diagonal = above;
              }
          }
          cout << row[b.size()] << endl;
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <string.h>

      static char a[1502], b[1502];
      static int row[1502];

      int main(void) {
          scanf("%1501s %1501s", a, b);
          int n = strlen(a), m = strlen(b);
          for (int j = 0; j <= m; j++) row[j] = j;
          for (int i = 1; i <= n; i++) {
              int diagonal = row[0];
              row[0] = i;
              for (int j = 1; j <= m; j++) {
                  int above = row[j], best = diagonal;
                  if (a[i - 1] != b[j - 1]) {
                      if (above < best) best = above;
                      if (row[j - 1] < best) best = row[j - 1];
                      best++;
                  }
                  row[j] = best;
                  diagonal = above;
              }
          }
          printf("%d\n", row[m]);
          return 0;
      }
