    solution: |
      import sys

      a, b = sys.stdin.read().split()
      row = list(range(len(b) + 1))
      for i, letter in enumerate(a, 1):
          diagonal = row[0]
          row[0] = i
          for j, other in enumerate(b, 1):
              above = row[j]
              row[j] = diagonal if letter == other else 1 + min(diagonal, above, row[j - 1])
              diagonal = above
      print(row[-1])
