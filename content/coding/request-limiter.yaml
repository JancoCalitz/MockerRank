id: request-limiter
title: Request Limiter
type: long
style: stdin
difficulty: medium
statement: |
  An API limits how often each user can call it. A user's request at time `t` is accepted if that user has fewer
  than `limit` accepted requests with a time greater than `t - w`. Otherwise, it is rejected. Rejected requests do not
  count against the user later.

  Find the total number of accepted requests.
inputFormat: |
  The first line contains `n`, `w`, and `limit`.

  Each of the next `n` lines contains a request's `time` and `user`. The requests are in order of time, and several
  can have the same time.
outputFormat: |
  The total number of accepted requests.
constraints: |
  - 1 <= n <= 100000
  - 1 <= w, time <= 1000000000
  - 1 <= limit <= 100000
  - 1 <= user <= 100000
sampleTests:
  - input: |
      5 10 2
      1 1
      2 1
      3 1
      11 1
      12 1
    output: |
      4
  - input: |
      3 5 1
      1 1
      1 2
      1 1
    output: |
      2
hiddenTests:
  - input: |
      1 1 1
      5 9
    output: |
      1
  - input: |
      4 3 1
      1 1
      2 1
      3 1
      4 1
    output: |
      2
    weight: 2
  - input: |
      3 5 3
      1 7
      1 7
      1 7
    output: |
      3
  - input: |
      4 2 1
      1 1
      2 1
      3 1
      4 1
    output: |
      2
    weight: 2
  - file: request-limiter-large
    weight: 3
checker:
  type: exact
editorial: |
  Keep a queue of accepted request times for each user. For each request, remove times from the front of that user's queue
  that are at or before `t - w`. Accept the request if the queue then has fewer than `limit` times, and add its time. Each
  accepted request enters and leaves a queue once, so this takes O(n) time overall. A boundary mistake here is easy: a
  request at exactly `t - w` has left the window. Rejected requests must not go in the queue.
tags: [queue, sliding-window, design]
topics: [stacks-queues, hashing]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;
      using System.Collections.Generic;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), w = int.Parse(t[1]), limit = int.Parse(t[2]), accepted = 0;
              var queues = new Dictionary<int, Queue<int>>();
              for (int i = 0; i < n; i++)
              {
                  int time = int.Parse(t[3 + 2 * i]), user = int.Parse(t[4 + 2 * i]);
                  if (!queues.TryGetValue(user, out var queue))
                  {
                      queue = new Queue<int>();
                      queues[user] = queue;
                  }
                  while (queue.Count > 0 && queue.Peek() <= time - w) queue.Dequeue();
                  if (queue.Count < limit)
                  {
                      queue.Enqueue(time);
                      accepted++;
                  }
              }
              Console.WriteLine(accepted);
          }
      }
  java:
    starter: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              // Read from System.in and write to System.out.
          }
      }
    solution: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]), w = Integer.parseInt(t[1]), limit = Integer.parseInt(t[2]), accepted = 0;
              Map<Integer, ArrayDeque<Integer>> queues = new HashMap<>();
              for (int i = 0; i < n; i++) {
                  int time = Integer.parseInt(t[3 + 2 * i]), user = Integer.parseInt(t[4 + 2 * i]);
                  ArrayDeque<Integer> queue = queues.computeIfAbsent(user, key -> new ArrayDeque<>());
                  while (!queue.isEmpty() && queue.peekFirst() <= time - w) {
                      queue.pollFirst();
                  }
                  if (queue.size() < limit) {
                      queue.addLast(time);
                      accepted++;
                  }
              }
              System.out.println(accepted);
          }
      }
  cpp:
    starter: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          // Read from cin and write to cout.
          return 0;
      }
    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n, w, limit, accepted = 0;
          cin >> n >> w >> limit;
          unordered_map<int, deque<int>> queues;
          for (int i = 0; i < n; i++) {
              int time, user;
              cin >> time >> user;
              deque<int>& queue = queues[user];
              while (!queue.empty() && queue.front() <= time - w) queue.pop_front();
              if ((int)queue.size() < limit) {
                  queue.push_back(time);
                  accepted++;
              }
          }
          cout << accepted << endl;
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      static int head[100001], tail[100001], size[100001];

      int main(void) {
          int n, w, limit, accepted = 0;
          scanf("%d %d %d", &n, &w, &limit);
          int *times = malloc(sizeof(int) * (n + 1)), *next = malloc(sizeof(int) * (n + 1));
          for (int i = 1; i <= n; i++) {
              int user;
              scanf("%d %d", &times[i], &user);
              while (size[user] > 0 && times[head[user]] <= times[i] - w) {
                  head[user] = next[head[user]];
                  size[user]--;
              }
              if (size[user] < limit) {
                  next[i] = 0;
                  if (size[user] == 0) head[user] = i;
                  else next[tail[user]] = i;
                  tail[user] = i;
                  size[user]++;
                  accepted++;
              }
          }
          printf("%d\n", accepted);
          free(times);
          free(next);
          return 0;
      }
  javascript:
    starter: |
      const input = require('fs').readFileSync(0, 'utf8');
      // Parse the input and print the answer with console.log.
    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const [n, w, limit] = t;
      const queues = new Map();
      let accepted = 0;
      for (let i = 0; i < n; i++) {
        const time = t[3 + 2 * i];
        const user = t[4 + 2 * i];
        if (!queues.has(user)) queues.set(user, { items: [], front: 0 });
        const queue = queues.get(user);
        while (queue.front < queue.items.length && queue.items[queue.front] <= time - w) queue.front++;
        if (queue.items.length - queue.front < limit) {
          queue.items.push(time);
          accepted++;
        }
      }
      console.log(accepted);
  typescript:
    starter: |
      import { readFileSync } from 'node:fs';

      const input: string = readFileSync(0, 'utf8');
      // Parse the input and print the answer with console.log.
    solution: |
      import { readFileSync } from 'node:fs';

      interface Queue {
        items: number[];
        front: number;
      }

      const t: number[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const n = t[0]!;
      const w = t[1]!;
      const limit = t[2]!;
      const queues = new Map<number, Queue>();
      let accepted = 0;
      for (let i = 0; i < n; i++) {
        const time = t[3 + 2 * i]!;
        const user = t[4 + 2 * i]!;
        let queue = queues.get(user);
        if (!queue) {
          queue = { items: [], front: 0 };
          queues.set(user, queue);
        }
        while (queue.front < queue.items.length && queue.items[queue.front]! <= time - w) queue.front++;
        if (queue.items.length - queue.front < limit) {
          queue.items.push(time);
          accepted++;
        }
      }
      console.log(accepted);
  python:
    starter: |
      import sys

      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import sys
      from collections import defaultdict, deque

      t = sys.stdin.read().split()
      n, w, limit = int(t[0]), int(t[1]), int(t[2])
      queues = defaultdict(deque)
      accepted = 0
      for i in range(n):
          time = int(t[3 + 2 * i])
          queue = queues[t[4 + 2 * i]]
          while queue and queue[0] <= time - w:
              queue.popleft()
          if len(queue) < limit:
              queue.append(time)
              accepted += 1
      print(accepted)
