    solution: |
      int firstError(const char *text) {
          int length = strlen(text), top = 0;
          char *stack = malloc(length + 1);
          int result = 0;
          for (int i = 0; i < length && !result; i++) {
              char c = text[i];
              if (c == '(' || c == '[' || c == '{') stack[top++] = c;
              else if (c == ')' || c == ']' || c == '}') {
                  char open = c == ')' ? '(' : c == ']' ? '[' : '{';
                  if (top == 0 || stack[--top] != open) result = i + 1;
              }
          }
          if (!result && top > 0) result = length + 1;
          free(stack);
          return result;
      }
