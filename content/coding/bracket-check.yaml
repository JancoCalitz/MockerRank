checker:
  type: exact
editorial: |
  Push each opening bracket onto a stack. At a closing bracket, the stack must be non-empty and its top
  must be the matching opener, or that position is the answer. If the stack still has anything in it
  at the end, the answer is the length plus 1. This takes O(n) time and O(n) space. Remember that
  counting brackets alone cannot detect `([)]`.
tags: [stack]
topics: [stacks-queues]
languages:
  csharp:
    starter: |
      public static int FirstError(string text)
      {
          // Write your code here.
          return 0;
      }
    harness: |
      using System;
      using System.Collections.Generic;

      class Solution
      {
          {{USER_CODE}}

          public static void Main(string[] args)
          {
              Console.WriteLine(FirstError(Console.ReadLine()));
          }
      }
    solution: |
      public static int FirstError(string text)
      {
          var stack = new Stack<char>();
          for (int i = 0; i < text.Length; i++)
          {
              char c = text[i];
              if (c == '(' || c == '[' || c == '{') stack.Push(c);
              else if (c == ')' || c == ']' || c == '}')
              {
                  char open = c == ')' ? '(' : c == ']' ? '[' : '{';
                  if (stack.Count == 0 || stack.Pop() != open) return i + 1;
              }
          }
          return stack.Count > 0 ? text.Length + 1 : 0;
      }
