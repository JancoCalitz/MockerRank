      int firstError(const string& text) {
          string stack;
          for (size_t i = 0; i < text.size(); i++) {
              char c = text[i];
              if (c == '(' || c == '[' || c == '{') stack.push_back(c);
              else if (c == ')' || c == ']' || c == '}') {
                  char open = c == ')' ? '(' : c == ']' ? '[' : '{';
                  if (stack.empty() || stack.back() != open) return i + 1;
