        const pairs: Record<string, string> = { ')': '(', ']': '[', '}': '{' };
        const stack: string[] = [];
        for (let i = 0; i < text.length; i++) {
          const c = text[i]!;
          if (c === '(' || c === '[' || c === '{') stack.push(c);
