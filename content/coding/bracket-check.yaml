    solution: |
      def first_error(text):
          pairs = {')': '(', ']': '[', '}': '{'}
          stack = []
          for i, c in enumerate(text):
              if c in '([{':
                  stack.append(c)
              elif c in pairs and (not stack or stack.pop() != pairs[c]):
                  return i + 1
          return len(text) + 1 if stack else 0
