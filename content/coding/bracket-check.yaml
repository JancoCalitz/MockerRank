id: bracket-check
title: Bracket Check
type: short
style: function
difficulty: medium
statement: |
  A code editor checks the brackets `()`, `[]`, and `{}` in a line of text, ignoring every other
  character.

  Complete the function `firstError`, which returns:

  - the position, counting from 1, of the first closing bracket that does not match the most recent
    open bracket, or has none to match
  - the length of the text plus 1, if the only problem is that some brackets are never closed
  - `0` if all of the brackets are balanced

  The provided code reads the input and prints your function's return value.
inputFormat: |
  One line of text, which can contain spaces.
outputFormat: |
  The value returned by the function.
constraints: |
  - 1 <= length of the text <= 100000
