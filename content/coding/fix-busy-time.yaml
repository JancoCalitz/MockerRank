id: fix-busy-time
title: Fix the Busy Time
type: short
style: stdin
difficulty: medium
debug: true
statement: |
  A calendar has `n` meetings, sorted by start time, and they can overlap. A meeting from `start` to `end` fills the time from `start` up to, but not including, `end`. This program should print the total time filled by at least one meeting, but it has a bug.

  Find the bug and fix it. You should only need to change a small part of the code.
inputFormat: |
  The first line contains `n`.

  Each of the next `n` lines contains a meeting's `start` and `end`, in order of start time.
outputFormat: |
  The total time filled.
constraints: |
  - 1 <= n <= 100000
  - 0 <= start < end <= 1000000000
sampleTests:
  - input: |
      2
      1 4
      3 6
    output: |
      5
  - input: |
      3
      1 10
      2 3
      4 12
    output: |
      11
hiddenTests:
  - input: |
      1
      0 5
    output: |
      5
  - input: |
      2
      1 2
      5 6
    output: |
      2
  - input: |
      2
      1 10
      2 3
    output: |
      9
    weight: 2
  - file: fix-busy-time-large
    weight: 3
checker:
  type: exact
editorial: |
  After a short meeting inside a longer one, the code moved the latest end backward, so later time was counted twice. The latest end must only ever move forward, so keep the larger of the two values. Testing a meeting that sits completely inside another reveals this.
tags: [debugging, intervals]
topics: [debugging-code-reading, sorting-searching]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]);
              long total = 0, reached = 0;
              for (int i = 0; i < n; i++)
              {
                  long start = long.Parse(t[1 + 2 * i]), end = long.Parse(t[2 + 2 * i]);
                  total += Math.Max(0, end - Math.Max(start, reached));
                  reached = end;
              }
              Console.WriteLine(total);
          }
      }
