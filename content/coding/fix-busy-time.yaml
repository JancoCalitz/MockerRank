  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          int n;
          long long total = 0, reached = 0;
          scanf("%d", &n);
          for (int i = 0; i < n; i++) {
              long long start, end;
              scanf("%lld %lld", &start, &end);
              long long from = start > reached ? start : reached;
              if (end > from) total += end - from;
              reached = end;
          }
          printf("%lld\n", total);
          return 0;
      }
