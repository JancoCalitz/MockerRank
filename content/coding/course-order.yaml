    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      int main(void) {
          int n, m;
          scanf("%d %d", &n, &m);
          int *head = malloc((n + 1) * sizeof(int));
          int *waiting = calloc(n + 1, sizeof(int));
          char *done = calloc(n + 1, 1);
          int *link = malloc((m + 1) * sizeof(int));
          int *target = malloc((m + 1) * sizeof(int));
          int *order = malloc((n + 1) * sizeof(int));
          for (int i = 0; i <= n; i++) head[i] = -1;
          for (int i = 0; i < m; i++) {
              int a, b;
              scanf("%d %d", &a, &b);
              target[i] = b;
              link[i] = head[a];
              head[a] = i;
              waiting[b]++;
          }
          for (int count = 0; count < n; count++) {
              int pick = 0;
              for (int i = 1; i <= n && pick == 0; i++) {
                  if (!done[i] && waiting[i] == 0) pick = i;
              }
              if (pick == 0) {
                  printf("IMPOSSIBLE\n");
                  return 0;
              }
              done[pick] = 1;
              order[count] = pick;
              for (int e = head[pick]; e != -1; e = link[e]) waiting[target[e]]--;
          }
          for (int i = 0; i < n; i++) printf(i ? " %d" : "%d", order[i]);
          printf("\n");
          return 0;
      }
