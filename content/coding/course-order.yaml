      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;
      using System.Collections.Generic;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), m = int.Parse(t[1]);
              var next = new List<int>[n + 1];
              for (int i = 0; i <= n; i++) next[i] = new List<int>();
              var waiting = new int[n + 1];
              for (int i = 0; i < m; i++)
              {
                  int a = int.Parse(t[2 + 2 * i]), b = int.Parse(t[3 + 2 * i]);
                  next[a].Add(b);
                  waiting[b]++;
              }
              var done = new bool[n + 1];
              var order = new List<int>();
              while (order.Count < n)
              {
                  int pick = 0;
                  for (int i = 1; i <= n && pick == 0; i++)
                  {
                      if (!done[i] && waiting[i] == 0) pick = i;
                  }
                  if (pick == 0)
                  {
                      Console.WriteLine("IMPOSSIBLE");
                      return;
                  }
                  done[pick] = true;
                  order.Add(pick);
                  foreach (int b in next[pick]) waiting[b]--;
              }
              Console.WriteLine(string.Join(" ", order));
          }
      }
