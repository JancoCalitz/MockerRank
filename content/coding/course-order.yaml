    weight: 3
checker:
  type: exact
editorial: |
  Use Kahn's algorithm: count each course's unmet prerequisites, and repeatedly take the lowest-numbered
  course with none left. Scanning for that course takes O(n^2 + m) overall, which is fine here, and a
  min-heap gives O((n + m) log n). If fewer than `n` courses are taken, there is a cycle. A plain
  depth-first topological sort finds a valid order, but not the smallest one.
tags: [graphs, topological-sort]
topics: [trees-graphs]
languages:
  csharp:
    starter: |
