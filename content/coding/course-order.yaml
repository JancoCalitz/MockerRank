      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const [n, m] = t;
      const next = Array.from({ length: n + 1 }, () => []);
      const waiting = new Array(n + 1).fill(0);
      for (let i = 0; i < m; i++) {
        next[t[2 + 2 * i]].push(t[3 + 2 * i]);
        waiting[t[3 + 2 * i]]++;
      }
      const done = new Array(n + 1).fill(false);
      const order = [];
      while (order.length < n) {
        let pick = 0;
        for (let i = 1; i <= n && pick === 0; i++) {
          if (!done[i] && waiting[i] === 0) pick = i;
        }
        if (pick === 0) break;
        done[pick] = true;
        order.push(pick);
        for (const b of next[pick]) waiting[b]--;
      }
      console.log(order.length < n ? 'IMPOSSIBLE' : order.join(' '));
