      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n, m;
          cin >> n >> m;
          vector<vector<int>> next(n + 1);
          vector<int> waiting(n + 1, 0);
          for (int i = 0; i < m; i++) {
              int a, b;
              cin >> a >> b;
              next[a].push_back(b);
              waiting[b]++;
          }
          priority_queue<int, vector<int>, greater<int>> ready;
          for (int i = 1; i <= n; i++) {
              if (waiting[i] == 0) ready.push(i);
          }
          vector<int> order;
          while (!ready.empty()) {
              int course = ready.top();
              ready.pop();
              order.push_back(course);
              for (int b : next[course]) {
                  if (--waiting[b] == 0) ready.push(b);
              }
          }
          if ((int)order.size() < n) {
              cout << "IMPOSSIBLE" << endl;
              return 0;
          }
          for (int i = 0; i < n; i++) cout << (i ? " " : "") << order[i];
          cout << endl;
          return 0;
      }
