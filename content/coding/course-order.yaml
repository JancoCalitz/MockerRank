  python:
    starter: |
      import sys

      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import heapq
      import sys

      t = list(map(int, sys.stdin.read().split()))
      n, m = t[0], t[1]
      following = [[] for _ in range(n + 1)]
      waiting = [0] * (n + 1)
      for i in range(m):
          a, b = t[2 + 2 * i], t[3 + 2 * i]
          following[a].append(b)
          waiting[b] += 1
      ready = [i for i in range(1, n + 1) if waiting[i] == 0]
      heapq.heapify(ready)
      order = []
      while ready:
          course = heapq.heappop(ready)
          order.append(course)
          for b in following[course]:
              waiting[b] -= 1
              if waiting[b] == 0:
                  heapq.heappush(ready, b)
      print('IMPOSSIBLE' if len(order) < n else ' '.join(map(str, order)))
