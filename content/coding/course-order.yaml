    solution: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]), m = Integer.parseInt(t[1]);
              List<List<Integer>> next = new ArrayList<>();
              for (int i = 0; i <= n; i++) next.add(new ArrayList<>());
              int[] waiting = new int[n + 1];
              for (int i = 0; i < m; i++) {
                  int a = Integer.parseInt(t[2 + 2 * i]), b = Integer.parseInt(t[3 + 2 * i]);
                  next.get(a).add(b);
                  waiting[b]++;
              }
              boolean[] done = new boolean[n + 1];
              StringBuilder order = new StringBuilder();
              for (int count = 0; count < n; count++) {
                  int pick = 0;
                  for (int i = 1; i <= n && pick == 0; i++) {
                      if (!done[i] && waiting[i] == 0) pick = i;
                  }
                  if (pick == 0) {
                      System.out.println("IMPOSSIBLE");
                      return;
                  }
                  done[pick] = true;
                  if (count > 0) order.append(' ');
                  order.append(pick);
                  for (int b : next.get(pick)) waiting[b]--;
              }
              System.out.println(order);
          }
      }
  cpp:
    starter: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          // Read from cin and write to cout.
          return 0;
      }
    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n, m;
          cin >> n >> m;
          vector<vector<int>> next(n + 1);
          vector<int> waiting(n + 1, 0);
          for (int i = 0; i < m; i++) {
              int a, b;
              cin >> a >> b;
              next[a].push_back(b);
              waiting[b]++;
          }
          priority_queue<int, vector<int>, greater<int>> ready;
          for (int i = 1; i <= n; i++) {
              if (waiting[i] == 0) ready.push(i);
          }
          vector<int> order;
          while (!ready.empty()) {
              int course = ready.top();
              ready.pop();
              order.push_back(course);
              for (int b : next[course]) {
                  if (--waiting[b] == 0) ready.push(b);
              }
          }
          if ((int)order.size() < n) {
              cout << "IMPOSSIBLE" << endl;
              return 0;
          }
          for (int i = 0; i < n; i++) cout << (i ? " " : "") << order[i];
          cout << endl;
          return 0;
      }
  c:
    starter: |
