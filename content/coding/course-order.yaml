id: course-order
title: Course Order
type: long
style: stdin
difficulty: medium
statement: |
  A curriculum has `n` courses, numbered 1 to `n`, and a list of rules of the form "course `a` must
  come before course `b`". Print an order that takes every course and follows every rule.

  If several orders work, print the one that is smallest when the two orders are compared number by
  number from the start. In other words, at each step, take the lowest-numbered course that is
  available.

  If no order works, print `IMPOSSIBLE`.
inputFormat: |
  The first line contains `n` and `m`.

  Each of the next `m` lines contains `a` and `b`.
outputFormat: |
  The course numbers separated by single spaces, or `IMPOSSIBLE`.
constraints: |
  - 1 <= n <= 2000
  - 0 <= m <= 20000
  - A rule can appear more than once, and `a` can equal `b`.
sampleTests:
  - input: |
      4 3
      1 3
      2 3
      3 4
    output: |
      1 2 3 4
  - input: |
      3 3
      1 2
      2 3
      3 1
    output: |
      IMPOSSIBLE
hiddenTests:
  - input: |
      3 0
    output: |
      1 2 3
  - input: |
      3 2
      3 1
      3 2
    output: |
      3 1 2
  - input: |
      4 2
      4 1
      2 1
    output: |
      2 3 4 1
    weight: 2
  - input: |
      2 2
      1 2
      1 2
    output: |
      1 2
  - input: |
      1 1
      1 1
    output: |
      IMPOSSIBLE
