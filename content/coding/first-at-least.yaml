id: first-at-least
title: First at Least
type: short
style: stdin
difficulty: easy
statement: |
  A ranking table holds scores in order from lowest to highest. For each query, find the first position, counting from 1, with a score
  that is at least the query. If there is none, the answer is `0`.
inputFormat: |
  The first line contains `n` and `q`.

  The second line contains `n` scores, in order from lowest to highest.

  The third line contains `q` queries.
outputFormat: |
  `q` answers separated by spaces.
constraints: |
  - 1 <= n, q <= 100000
  - 0 <= score, query <= 1000000000
sampleTests:
  - input: |
      4 3
      1 3 3 7
      3 4 8
    output: |
      2 4 0
  - input: |
      1 2
      5
      0 5
    output: |
      1 1
hiddenTests:
  - input: |
      2 1
      1 2
      3
    output: |
      0
  - input: |
      3 3
      2 2 2
      1 2 3
    output: |
      1 1 0
    weight: 2
  - input: |
      5 2
      1 2 3 4 5
      5 1
    output: |
      5 1
  - file: first-at-least-large
    weight: 3
checker:
  type: exact
editorial: |
  Use binary search for each query. Keep a range of possible positions, and when the middle score is below the query, move past it. Otherwise,
  keep the middle as a candidate and search to its left. Stopping at any match would be wrong, because the scores can repeat. This takes
  O(q log n) time, whereas a scan for each query takes O(n * q).
tags: [binary-search]
topics: [sorting-searching]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;
      using System.Text;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), q = int.Parse(t[1]);
              var scores = new int[n];
              for (int i = 0; i < n; i++) scores[i] = int.Parse(t[2 + i]);
              var output = new StringBuilder();
              for (int i = 0; i < q; i++)
              {
                  int query = int.Parse(t[2 + n + i]), low = 0, high = n;
                  while (low < high)
                  {
                      int mid = low + (high - low) / 2;
                      if (scores[mid] < query) low = mid + 1;
                      else high = mid;
                  }
                  output.Append(low == n ? 0 : low + 1).Append(i + 1 < q ? " " : "");
              }
              Console.WriteLine(output);
          }
      }
