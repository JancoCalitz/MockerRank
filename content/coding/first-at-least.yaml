  python:
    starter: |
      import sys

      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import sys
      from bisect import bisect_left

      t = [int(x) for x in sys.stdin.read().split()]
      n, q = t[0], t[1]
      scores = t[2:2 + n]
      output = []
      for query in t[2 + n:2 + n + q]:
          at = bisect_left(scores, query)
          output.append(0 if at == n else at + 1)
      print(' '.join(map(str, output)))
