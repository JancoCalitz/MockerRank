    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      int main(void) {
          int n, q;
          scanf("%d %d", &n, &q);
          int *scores = malloc(sizeof(int) * n);
          for (int i = 0; i < n; i++) scanf("%d", &scores[i]);
          for (int i = 0; i < q; i++) {
              int query, low = 0, high = n;
              scanf("%d", &query);
              while (low < high) {
                  int mid = low + (high - low) / 2;
                  if (scores[mid] < query) low = mid + 1;
                  else high = mid;
              }
              printf("%d%c", low == n ? 0 : low + 1, i + 1 < q ? ' ' : '\n');
          }
          free(scores);
          return 0;
      }
  javascript:
