    solution: |
      import { readFileSync } from 'node:fs';

      const t: number[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const k = t[1]!;
      const scores: number[] = [...new Set(t.slice(2, 2 + t[0]!))].sort((a, b) => b - a);
      console.log(k <= scores.length ? scores[k - 1] : -1);
  python:
    starter: |
      import sys

      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import sys

      t = sys.stdin.read().split()
      n, k = int(t[0]), int(t[1])
      scores = sorted({int(x) for x in t[2:2 + n]}, reverse=True)
      print(scores[k - 1] if k <= len(scores) else -1)
