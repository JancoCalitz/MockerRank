    solution: |
      function evaluate(text) {
        const numbers = [];
        const operators = [];
        const rank = (op) => (op === '*' ? 2 : op === '(' ? 0 : 1);
        const apply = () => {
          const b = numbers.pop();
          const a = numbers.pop();
          const op = operators.pop();
          numbers.push(op === '+' ? a + b : op === '-' ? a - b : a * b);
        };
        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          if (c === ' ') continue;
          if (c >= '0' && c <= '9') {
            let value = 0;
            while (text[i] >= '0' && text[i] <= '9') value = value * 10 + Number(text[i++]);
            i--;
            numbers.push(value);
          } else if (c === '(') {
            operators.push(c);
          } else if (c === ')') {
            while (operators[operators.length - 1] !== '(') apply();
            operators.pop();
          } else {
            while (operators.length > 0 && rank(operators[operators.length - 1]) >= rank(c)) apply();
            operators.push(c);
          }
        }
        while (operators.length > 0) apply();
        return numbers[0];
      }
