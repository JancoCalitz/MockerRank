    solution: |
      public static long Evaluate(string text)
      {
          var numbers = new Stack<long>();
          var operators = new Stack<char>();
          void Apply()
          {
              long b = numbers.Pop(), a = numbers.Pop();
              char op = operators.Pop();
              numbers.Push(op == '+' ? a + b : op == '-' ? a - b : a * b);
          }
          int Rank(char op) => op == '*' ? 2 : op == '(' ? 0 : 1;
          for (int i = 0; i < text.Length; i++)
          {
              char c = text[i];
              if (c == ' ') continue;
              if (char.IsDigit(c))
              {
                  long value = 0;
                  while (i < text.Length && char.IsDigit(text[i])) value = value * 10 + (text[i++] - '0');
                  i--;
                  numbers.Push(value);
              }
              else if (c == '(') operators.Push(c);
              else if (c == ')')
              {
                  while (operators.Peek() != '(') Apply();
                  operators.Pop();
              }
              else
              {
                  while (operators.Count > 0 && Rank(operators.Peek()) >= Rank(c)) Apply();
                  operators.Push(c);
              }
          }
          while (operators.Count > 0) Apply();
          return numbers.Pop();
      }
