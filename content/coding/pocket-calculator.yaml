    solution: |
      long long evaluate(const string& text) {
          vector<long long> numbers;
          string operators;
          auto apply = [&]() {
              long long b = numbers.back();
              numbers.pop_back();
              long long a = numbers.back();
              numbers.pop_back();
              char op = operators.back();
              operators.pop_back();
              numbers.push_back(op == '+' ? a + b : op == '-' ? a - b : a * b);
          };
          auto rank = [](char op) { return op == '*' ? 2 : op == '(' ? 0 : 1; };
          for (size_t i = 0; i < text.size(); i++) {
              char c = text[i];
              if (c == ' ') continue;
              if (isdigit((unsigned char)c)) {
                  long long value = 0;
                  while (i < text.size() && isdigit((unsigned char)text[i])) value = value * 10 + (text[i++] - '0');
                  i--;
                  numbers.push_back(value);
              } else if (c == '(') {
                  operators.push_back(c);
              } else if (c == ')') {
                  while (operators.back() != '(') apply();
                  operators.pop_back();
              } else {
                  while (!operators.empty() && rank(operators.back()) >= rank(c)) apply();
                  operators.push_back(c);
              }
          }
          while (!operators.empty()) apply();
          return numbers.back();
      }
