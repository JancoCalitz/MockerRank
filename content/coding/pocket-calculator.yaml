id: pocket-calculator
title: Pocket Calculator
type: long
style: function
difficulty: hard
statement: |
  A calculator reads a line containing non-negative whole numbers, the operators `+`, `-`, and `*`, parentheses, and
  spaces. Multiplication happens before addition and subtraction, and operators of the same kind work from left to
  right.

  Complete the function `evaluate`, which returns the value of the expression.

  The provided code reads the input and prints your function's return value.
inputFormat: |
  One line containing a valid expression.
outputFormat: |
  The value of the expression.
constraints: |
  - 1 <= length of the line <= 200000
  - Parentheses are nested at most 1000 levels deep.
  - Every number, and the result of every step, has an absolute value of at most 1000000000000000.
  - There are no unary minus signs.
sampleTests:
  - input: |
      2 + 3 * 4
    output: |
      14
  - input: |
      (2 + 3) * 4
    output: |
      20
hiddenTests:
  - input: |
      7
    output: |
      7
  - input: |
      10 - 2 - 3
    output: |
      5
    weight: 2
  - input: |
      2 * (3 + (4 - 1)) * 2
    output: |
      24
    weight: 2
  - input: |
      1 - 5
    output: |
      -4
  - input: |
      12*12 + 1
    output: |
      145
  - file: pocket-calculator-large
    weight: 3
checker:
  type: exact
editorial: |
  Use two stacks, one for numbers and one for operators. Before pushing an operator, apply any operators on top of the
  stack that have the same or higher precedence, stopping at an opening parenthesis. Applying the same precedence is
  what makes `10 - 2 - 3` work from left to right. A closing parenthesis applies operators back to its opening one.
  Each token is pushed and popped once, so this takes O(n) time. Results can exceed 32 bits, so use 64-bit integers.
tags: [stack, parsing]
topics: [stacks-queues]
