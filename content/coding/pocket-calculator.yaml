    solution: |
      def evaluate(text):
          numbers = []
          operators = []
          rank = {'*': 2, '+': 1, '-': 1, '(': 0}

          def apply():
              b = numbers.pop()
              a = numbers.pop()
              op = operators.pop()
              numbers.append(a + b if op == '+' else a - b if op == '-' else a * b)

          i = 0
          while i < len(text):
              c = text[i]
              if c.isdigit():
                  start = i
                  while i < len(text) and text[i].isdigit():
                      i += 1
                  numbers.append(int(text[start:i]))
                  continue
              if c == '(':
                  operators.append(c)
              elif c == ')':
                  while operators[-1] != '(':
                      apply()
                  operators.pop()
              elif c != ' ':
                  while operators and rank[operators[-1]] >= rank[c]:
                      apply()
                  operators.append(c)
              i += 1
          while operators:
              apply()
          return numbers[0]
