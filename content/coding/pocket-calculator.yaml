    solution: |
      static long evaluate(String text) {
          long[] numbers = new long[text.length() + 1];
          char[] operators = new char[text.length() + 1];
          int count = 0, top = 0;
          for (int i = 0; i <= text.length(); i++) {
              char c = i < text.length() ? text.charAt(i) : '$';
              if (c == ' ') {
                  continue;
              }
              if (Character.isDigit(c)) {
                  long value = 0;
                  while (i < text.length() && Character.isDigit(text.charAt(i))) {
                      value = value * 10 + (text.charAt(i) - '0');
                      i++;
                  }
                  i--;
                  numbers[count++] = value;
              } else if (c == '(') {
                  operators[top++] = c;
              } else {
                  int rank = c == '*' ? 2 : c == '+' || c == '-' ? 1 : 0;
                  while (top > 0 && operators[top - 1] != '(' && (operators[top - 1] == '*' ? 2 : 1) >= rank) {
                      long b = numbers[--count], a = numbers[--count];
                      char op = operators[--top];
                      numbers[count++] = op == '+' ? a + b : op == '-' ? a - b : a * b;
                  }
                  if (c == ')') {
                      top--;
                  } else if (c != '$') {
                      operators[top++] = c;
                  }
              }
          }
          return numbers[0];
      }
