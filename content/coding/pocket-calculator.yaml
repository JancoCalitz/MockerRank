    solution: |
      static int rankOf(char op) {
          return op == '*' ? 2 : op == '(' ? 0 : 1;
      }

      long long evaluate(const char *text) {
          int length = strlen(text), count = 0, top = 0;
          long long *numbers = malloc(sizeof(long long) * (length + 1));
          char *operators = malloc(length + 1);
          for (int i = 0; i <= length; i++) {
              char c = i < length ? text[i] : '$';
              if (c == ' ') continue;
              if (c >= '0' && c <= '9') {
                  long long value = 0;
                  while (text[i] >= '0' && text[i] <= '9') value = value * 10 + (text[i++] - '0');
                  i--;
                  numbers[count++] = value;
              } else if (c == '(') {
                  operators[top++] = c;
              } else {
                  int rank = c == '*' ? 2 : c == '+' || c == '-' ? 1 : 0;
                  while (top > 0 && operators[top - 1] != '(' && rankOf(operators[top - 1]) >= rank) {
                      long long b = numbers[--count], a = numbers[--count];
                      char op = operators[--top];
                      numbers[count++] = op == '+' ? a + b : op == '-' ? a - b : a * b;
                  }
                  if (c == ')') top--;
                  else if (c != '$') operators[top++] = c;
              }
          }
          long long result = numbers[0];
          free(numbers);
          free(operators);
          return result;
      }
