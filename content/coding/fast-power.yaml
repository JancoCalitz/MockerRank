    solution: |
      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int q = Integer.parseInt(t[0]);
              StringBuilder output = new StringBuilder();
              for (int i = 0; i < q; i++) {
                  long a = Long.parseLong(t[1 + 3 * i]), b = Long.parseLong(t[2 + 3 * i]), m = Long.parseLong(t[3 + 3 * i]);
                  long result = 1 % m;
                  a %= m;
                  while (b > 0) {
                      if (b % 2 == 1) {
                          result = result * a % m;
                      }
                      a = a * a % m;
                      b /= 2;
                  }
                  output.append(result).append('\n');
              }
              System.out.print(output);
          }
      }
