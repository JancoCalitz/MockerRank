    solution: |
      import sys

      t = sys.stdin.read().split()
      output = []
      for i in range(int(t[0])):
          a, b, m = int(t[1 + 3 * i]), int(t[2 + 3 * i]), int(t[3 + 3 * i])
          result = 1 % m
          a %= m
          while b > 0:
              if b % 2 == 1:
                  result = result * a % m
              a = a * a % m
              b //= 2
          output.append(result)
      print('\n'.join(map(str, output)))
