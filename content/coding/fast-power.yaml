  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int q;
          scanf("%d", &q);
          for (int i = 0; i < q; i++) {
              long long a, b, m;
              scanf("%lld %lld %lld", &a, &b, &m);
              long long result = 1 % m;
              a %= m;
              while (b > 0) {
                  if (b % 2 == 1) result = result * a % m;
                  a = a * a % m;
                  b /= 2;
              }
              printf("%lld\n", result);
          }
          return 0;
      }
  javascript:
    starter: |
      const input = require('fs').readFileSync(0, 'utf8');
      // Parse the input and print the answer with console.log.
    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const output = [];
      for (let i = 0; i < t[0]; i++) {
        let a = t[1 + 3 * i];
        let b = t[2 + 3 * i];
        const m = t[3 + 3 * i];
        let result = 1 % m;
        a %= m;
        while (b > 0) {
          if (b % 2 === 1) result = (result * a) % m;
          a = (a * a) % m;
          b = Math.floor(b / 2);
        }
        output.push(result);
      }
      console.log(output.join('\n'));
