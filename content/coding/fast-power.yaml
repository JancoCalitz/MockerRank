      import { readFileSync } from 'node:fs';

      const t: number[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const output: number[] = [];
      for (let i = 0; i < t[0]!; i++) {
        let a = t[1 + 3 * i]!;
        let b = t[2 + 3 * i]!;
        const m = t[3 + 3 * i]!;
