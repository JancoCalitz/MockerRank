    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const last = new Map();
      let start = 0;
      let best = 0;
      for (let i = 0; i < t[0]; i++) {
        const id = t[1 + i];
        start = Math.max(start, last.get(id) ?? 0);
        last.set(id, i + 1);
        best = Math.max(best, i + 1 - start);
      }
      console.log(best);
  typescript:
