      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]), start = 0, best = 0;
              int[] last = new int[1000001];
              for (int i = 0; i < n; i++) {
                  int id = Integer.parseInt(t[1 + i]);
                  start = Math.max(start, last[id]);
                  last[id] = i + 1;
                  best = Math.max(best, i + 1 - start);
              }
              System.out.println(best);
          }
      }
