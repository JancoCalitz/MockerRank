id: badge-streak
title: Badge Streak
type: short
style: stdin
difficulty: medium
statement: |
  A door logs the badge ID of each person who enters. Find the length of the longest unbroken part of the log in
  which no badge ID appears twice.
inputFormat: |
  The first line contains `n`.

  The second line contains `n` badge IDs.
outputFormat: |
  The length of the longest part with no repeated ID.
constraints: |
  - 1 <= n <= 200000
  - 1 <= badge ID <= 1000000
sampleTests:
  - input: |
      6
      1 2 3 1 2 2
    output: |
      3
  - input: |
      1
      9
    output: |
      1
hiddenTests:
  - input: |
      4
      5 5 5 5
    output: |
      1
  - input: |
      5
      1 2 3 4 5
    output: |
      5
  - input: |
      7
      1 2 1 3 4 2 5
    output: |
      5
    weight: 2
  - file: badge-streak-large
    weight: 3
checker:
  type: exact
editorial: |
  Slide a window across the log, and store the position where each ID was last seen. When an ID repeats inside the
  window, move the window's start to just past its previous position. The start must never move backward. Each step
  takes O(1) time, so the total is O(n). Checking every part separately takes at least O(n^2) time.
tags: [sliding-window, hash-map]
topics: [hashing, arrays-strings]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), start = 0, best = 0;
              var last = new int[1000001];
              for (int i = 0; i < n; i++)
              {
                  int id = int.Parse(t[1 + i]);
                  start = Math.Max(start, last[id]);
                  last[id] = i + 1;
                  best = Math.Max(best, i + 1 - start);
              }
              Console.WriteLine(best);
          }
      }
