    solution: |
      import sys

      t = sys.stdin.read().split()
      last = {}
      start = best = 0
      for i in range(int(t[0])):
          id_ = t[1 + i]
          start = max(start, last.get(id_, 0))
          last[id_] = i + 1
          best = max(best, i + 1 - start)
      print(best)
