      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>

      static int last[1000001];

      int main(void) {
          int n, start = 0, best = 0;
          scanf("%d", &n);
          for (int i = 0; i < n; i++) {
              int id;
              scanf("%d", &id);
              if (last[id] > start) start = last[id];
              last[id] = i + 1;
              if (i + 1 - start > best) best = i + 1 - start;
          }
          printf("%d\n", best);
          return 0;
      }
  javascript:
