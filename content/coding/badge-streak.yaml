    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n, start = 0, best = 0;
          cin >> n;
          vector<int> last(1000001);
          for (int i = 0; i < n; i++) {
              int id;
              cin >> id;
              start = max(start, last[id]);
              last[id] = i + 1;
              best = max(best, i + 1 - start);
          }
          cout << best << endl;
