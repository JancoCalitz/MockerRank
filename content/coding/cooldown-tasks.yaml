id: cooldown-tasks
title: Cooldown Tasks
type: long
style: stdin
difficulty: medium
statement: |
  A machine runs one task in each time slot, or sits idle. After running a task of some type, it must wait at least `c` slots before it can run the same
  type again. The tasks can run in any order. Find the smallest number of slots that runs every task.
inputFormat: |
  The first line contains `n` and `c`.

  The second line contains a string of `n` capital letters, one for each task's type.
outputFormat: |
  The smallest number of slots.
constraints: |
  - 1 <= n <= 200000
  - 0 <= c <= 100000
sampleTests:
  - input: |
      6 2
      AAABBB
    output: |
      8
  - input: |
      6 0
      AAABBB
    output: |
      6
hiddenTests:
  - input: |
      1 5
      A
    output: |
      1
  - input: |
      3 3
      AAA
    output: |
      9
  - input: |
      6 1
      AAABCD
    output: |
      6
    weight: 2
  - input: |
      7 2
      AAABBCC
    output: |
      7
    weight: 2
  - file: cooldown-tasks-large
    weight: 3
checker:
  type: exact
editorial: |
  The most common type sets the shape of the schedule. If it appears `max` times, those tasks form `max - 1` gaps of `c` slots each, plus a final row holding one task
  for each type that also appears `max` times. That gives `(max - 1) * (c + 1) + ties` slots. If there are enough other tasks to fill every gap, no idle slot is needed, so the answer can
  never be below `n`. So the answer is the larger of `n` and that formula, in O(n) time. The result can exceed 32 bits, so use a 64-bit integer. Simulating with a heap also works, but
  takes longer when `c` is large.
tags: [greedy, counting]
topics: [hashing, sorting-searching]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              long n = long.Parse(t[0]), c = long.Parse(t[1]);
              var counts = new long[26];
              foreach (char task in t[2]) counts[task - 'A']++;
              long max = 0, ties = 0;
              foreach (long count in counts) max = Math.Max(max, count);
              foreach (long count in counts)
              {
                  if (count == max) ties++;
              }
              Console.WriteLine(Math.Max(n, (max - 1) * (c + 1) + ties));
          }
      }
  java:
    starter: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              // Read from System.in and write to System.out.
          }
      }
    solution: |
      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              long n = Long.parseLong(t[0]), c = Long.parseLong(t[1]);
              long[] counts = new long[26];
              for (int i = 0; i < t[2].length(); i++) {
                  counts[t[2].charAt(i) - 'A']++;
              }
              long max = 0, ties = 0;
              for (long count : counts) {
                  max = Math.max(max, count);
              }
              for (long count : counts) {
                  if (count == max) {
                      ties++;
                  }
              }
              System.out.println(Math.max(n, (max - 1) * (c + 1) + ties));
          }
      }
  cpp:
    starter: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          // Read from cin and write to cout.
          return 0;
      }
    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          long long n, c;
          string tasks;
          cin >> n >> c >> tasks;
          long long counts[26] = {0}, maxCount = 0, ties = 0;
          for (char task : tasks) counts[task - 'A']++;
          for (long long count : counts) maxCount = max(maxCount, count);
          for (long long count : counts) ties += count == maxCount;
          cout << max(n, (maxCount - 1) * (c + 1) + ties) << endl;
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>

      static char tasks[200002];

      int main(void) {
          long long n, c, counts[26] = {0}, max = 0, ties = 0;
          scanf("%lld %lld %200001s", &n, &c, tasks);
          for (char *p = tasks; *p; p++) counts[*p - 'A']++;
          for (int i = 0; i < 26; i++) {
              if (counts[i] > max) max = counts[i];
          }
          for (int i = 0; i < 26; i++) {
              if (counts[i] == max) ties++;
          }
          long long slots = (max - 1) * (c + 1) + ties;
          printf("%lld\n", slots > n ? slots : n);
          return 0;
      }
  javascript:
    starter: |
      const input = require('fs').readFileSync(0, 'utf8');
      // Parse the input and print the answer with console.log.
    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean);
      const n = Number(t[0]);
      const c = Number(t[1]);
      const counts = new Map();
      for (const task of t[2]) counts.set(task, (counts.get(task) ?? 0) + 1);
      const max = Math.max(...counts.values());
      const ties = [...counts.values()].filter((count) => count === max).length;
      console.log(Math.max(n, (max - 1) * (c + 1) + ties));
  typescript:
    starter: |
      import { readFileSync } from 'node:fs';

      const input: string = readFileSync(0, 'utf8');
      // Parse the input and print the answer with console.log.
    solution: |
      import { readFileSync } from 'node:fs';

      const t: string[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean);
      const n = Number(t[0]);
      const c = Number(t[1]);
      const counts = new Map<string, number>();
      for (const task of t[2]!) counts.set(task, (counts.get(task) ?? 0) + 1);
      const max = Math.max(...counts.values());
      const ties = [...counts.values()].filter((count) => count === max).length;
      console.log(Math.max(n, (max - 1) * (c + 1) + ties));
  python:
    starter: |
      import sys

      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import sys
      from collections import Counter

      t = sys.stdin.read().split()
      n, c = int(t[0]), int(t[1])
      counts = Counter(t[2])
      most = max(counts.values())
      ties = sum(1 for count in counts.values() if count == most)
      print(max(n, (most - 1) * (c + 1) + ties))
