    solution: |
      import sys

      t = sys.stdin.read().split()
      n = int(t[0])
      starts = sorted(int(t[1 + 2 * i]) for i in range(n))
      ends = sorted(int(t[2 + 2 * i]) for i in range(n))
      rooms = freed = 0
      for start in starts:
          if ends[freed] <= start:
              freed += 1
          else:
              rooms += 1
      print(rooms)
