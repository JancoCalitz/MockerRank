      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]);
              int[] starts = new int[n], ends = new int[n];
              for (int i = 0; i < n; i++)
              {
                  starts[i] = int.Parse(t[1 + 2 * i]);
                  ends[i] = int.Parse(t[2 + 2 * i]);
              }
              Array.Sort(starts);
              Array.Sort(ends);
              int rooms = 0, freed = 0;
              foreach (int start in starts)
              {
                  if (ends[freed] <= start) freed++;
                  else rooms++;
              }
              Console.WriteLine(rooms);
          }
      }
