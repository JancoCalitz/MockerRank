  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      static int ascending(const void *a, const void *b) {
          int x = *(const int *)a, y = *(const int *)b;
          return (x > y) - (x < y);
      }

      int main(void) {
          int n;
          scanf("%d", &n);
          int *starts = malloc(sizeof(int) * n), *ends = malloc(sizeof(int) * n);
          for (int i = 0; i < n; i++) scanf("%d %d", &starts[i], &ends[i]);
          qsort(starts, n, sizeof(int), ascending);
          qsort(ends, n, sizeof(int), ascending);
          int rooms = 0, freed = 0;
          for (int i = 0; i < n; i++) {
              if (ends[freed] <= starts[i]) freed++;
              else rooms++;
          }
          printf("%d\n", rooms);
          free(starts);
          free(ends);
          return 0;
      }
