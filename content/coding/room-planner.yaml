id: room-planner
title: Room Planner
type: long
style: stdin
difficulty: medium
statement: |
  An office has a list of meetings for one day. A room can hold one meeting at a time, and a meeting that starts
  at the same moment another one ends can use the same room. Find the smallest number of rooms that fits every meeting.
inputFormat: |
  The first line contains `n`.

  Each of the next `n` lines contains a meeting's `start` and `end`. The meetings are in no particular order.
outputFormat: |
  The smallest number of rooms.
constraints: |
  - 1 <= n <= 200000
  - 0 <= start < end <= 1000000000
sampleTests:
  - input: |
      3
      0 30
      5 10
      15 20
    output: |
      2
  - input: |
      2
      1 5
      5 9
    output: |
      1
hiddenTests:
  - input: |
      1
      3 4
    output: |
      1
  - input: |
      3
      1 9
      2 9
      3 9
    output: |
      3
  - input: |
      4
      8 9
      1 2
      3 4
      5 6
    output: |
      1
  - input: |
      4
      1 5
      2 6
      5 7
      6 8
    output: |
      2
    weight: 2
  - file: room-planner-large
    weight: 3
checker:
  type: exact
editorial: |
  The answer is the largest number of meetings running at one moment. Sort the start times and the end times
  separately, then walk through the starts. If the earliest unused end is at or before the current start, a room has
  come free, so advance past that end. Otherwise, the meeting needs another room. This takes O(n log n) time, and a
  min-heap of end times works as well. Comparing every pair of meetings does not give the right answer, and takes
  O(n^2) time.
tags: [intervals, sweep-line]
topics: [sorting-searching]
languages:
