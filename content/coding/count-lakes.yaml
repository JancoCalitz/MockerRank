      import { readFileSync } from 'node:fs';

      const t: string[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean);
      const rows = Number(t[0]);
      const cols = Number(t[1]);
      const seen = new Uint8Array(rows * cols);
      const moves: [number, number][] = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      const isWater = (r: number, c: number): boolean => t[2 + r]![c] === '~';
      let lakes = 0;
      for (let r0 = 0; r0 < rows; r0++) {
        for (let c0 = 0; c0 < cols; c0++) {
          if (seen[r0 * cols + c0] || !isWater(r0, c0)) continue;
          lakes++;
          seen[r0 * cols + c0] = 1;
          const stack: number[] = [r0 * cols + c0];
