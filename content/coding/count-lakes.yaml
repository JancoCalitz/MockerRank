      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int rows = int.Parse(t[0]), cols = int.Parse(t[1]), lakes = 0;
              var seen = new bool[rows * cols];
              var stack = new int[rows * cols];
              int[] dr = { 1, -1, 0, 0 }, dc = { 0, 0, 1, -1 };
              for (int start = 0; start < rows * cols; start++)
              {
                  if (seen[start] || t[2 + start / cols][start % cols] != '~') continue;
                  lakes++;
                  int top = 0;
                  seen[start] = true;
                  stack[top++] = start;
                  while (top > 0)
                  {
                      int cell = stack[--top];
                      for (int d = 0; d < 4; d++)
                      {
                          int r = cell / cols + dr[d], c = cell % cols + dc[d];
                          if (r < 0 || c < 0 || r >= rows || c >= cols) continue;
                          int other = r * cols + c;
                          if (seen[other] || t[2 + r][c] != '~') continue;
                          seen[other] = true;
                          stack[top++] = other;
                      }
                  }
              }
              Console.WriteLine(lakes);
          }
      }
