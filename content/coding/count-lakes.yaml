    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean);
      const rows = Number(t[0]);
      const cols = Number(t[1]);
      const seen = new Uint8Array(rows * cols);
      const moves = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      const isWater = (r, c) => t[2 + r][c] === '~';
      let lakes = 0;
      for (let r0 = 0; r0 < rows; r0++) {
        for (let c0 = 0; c0 < cols; c0++) {
          if (seen[r0 * cols + c0] || !isWater(r0, c0)) continue;
          lakes++;
          seen[r0 * cols + c0] = 1;
          const stack = [r0 * cols + c0];
          while (stack.length > 0) {
            const cell = stack.pop();
            const row = Math.floor(cell / cols);
            const col = cell % cols;
            for (const [dr, dc] of moves) {
              const r = row + dr;
              const c = col + dc;
              if (r < 0 || c < 0 || r >= rows || c >= cols) continue;
              if (seen[r * cols + c] || !isWater(r, c)) continue;
              seen[r * cols + c] = 1;
              stack.push(r * cols + c);
            }
          }
        }
      }
      console.log(lakes);
