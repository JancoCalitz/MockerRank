id: count-lakes
title: Count the Lakes
type: short
style: stdin
difficulty: medium
statement: |
  A map is a grid of land `.` and water `~`. Water cells belong to the same lake when they touch along a
  side. Touching only at a corner does not count. Find the number of lakes.
inputFormat: |
  The first line contains `rows` and `cols`.

  Each of the next `rows` lines contains `cols` characters.
outputFormat: |
  The number of lakes.
constraints: |
  - 1 <= rows, cols <= 500
sampleTests:
  - input: |
      3 4
      ~~..
      ..~.
      ..~~
    output: |
      2
  - input: |
      1 1
      .
    output: |
      0
hiddenTests:
  - input: |
      2 2
      ~.
      .~
    output: |
      2
    weight: 2
  - input: |
      2 2
      ~~
      ~~
    output: |
      1
  - input: |
      1 5
      ~.~.~
    output: |
      3
  - input: |
      3 3
      ~~~
      ~.~
      ~~~
    output: |
      1
  - file: count-lakes-large
    weight: 3
checker:
  type: exact
editorial: |
  Scan the grid. At each unvisited water cell, add one to the count and mark the cell's whole lake as visited
  with a breadth-first or depth-first search. Each cell is visited once, so this takes O(rows * cols) time. Use an
  explicit stack or queue, because a recursive search can go very deep on a large lake.
tags: [grids, flood-fill]
topics: [trees-graphs]
languages:
  csharp:
    starter: |
