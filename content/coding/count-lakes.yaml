    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int rows, cols, lakes = 0;
          cin >> rows >> cols;
          vector<string> grid(rows);
          for (string& row : grid) cin >> row;
          int dr[] = {1, -1, 0, 0}, dc[] = {0, 0, 1, -1};
          vector<pair<int, int>> stack;
          for (int r0 = 0; r0 < rows; r0++) {
              for (int c0 = 0; c0 < cols; c0++) {
                  if (grid[r0][c0] != '~') continue;
                  lakes++;
                  grid[r0][c0] = '.';
                  stack.push_back({r0, c0});
                  while (!stack.empty()) {
                      auto [row, col] = stack.back();
                      stack.pop_back();
                      for (int d = 0; d < 4; d++) {
                          int r = row + dr[d], c = col + dc[d];
                          if (r < 0 || c < 0 || r >= rows || c >= cols || grid[r][c] != '~') continue;
                          grid[r][c] = '.';
                          stack.push_back({r, c});
                      }
                  }
              }
          }
          cout << lakes << endl;
          return 0;
      }
