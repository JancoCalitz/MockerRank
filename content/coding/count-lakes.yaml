    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      static char grid[500][502];

      int main(void) {
          int rows, cols, lakes = 0;
          scanf("%d %d", &rows, &cols);
          for (int r = 0; r < rows; r++) scanf("%501s", grid[r]);
          int *stack = malloc(sizeof(int) * rows * cols);
          int dr[] = {1, -1, 0, 0}, dc[] = {0, 0, 1, -1};
          for (int start = 0; start < rows * cols; start++) {
              if (grid[start / cols][start % cols] != '~') continue;
              lakes++;
              int top = 0;
              grid[start / cols][start % cols] = '.';
              stack[top++] = start;
              while (top > 0) {
                  int cell = stack[--top];
                  for (int d = 0; d < 4; d++) {
                      int r = cell / cols + dr[d], c = cell % cols + dc[d];
                      if (r < 0 || c < 0 || r >= rows || c >= cols || grid[r][c] != '~') continue;
                      grid[r][c] = '.';
                      stack[top++] = r * cols + c;
                  }
              }
          }
          printf("%d\n", lakes);
          free(stack);
          return 0;
      }
