      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int rows = Integer.parseInt(t[0]), cols = Integer.parseInt(t[1]), lakes = 0;
              boolean[] seen = new boolean[rows * cols];
              int[] stack = new int[rows * cols];
              int[] dr = { 1, -1, 0, 0 }, dc = { 0, 0, 1, -1 };
              for (int start = 0; start < rows * cols; start++) {
                  if (seen[start] || t[2 + start / cols].charAt(start % cols) != '~') {
                      continue;
                  }
                  lakes++;
                  int top = 0;
                  seen[start] = true;
                  stack[top++] = start;
                  while (top > 0) {
                      int cell = stack[--top];
                      for (int d = 0; d < 4; d++) {
                          int r = cell / cols + dr[d], c = cell % cols + dc[d];
                          if (r < 0 || c < 0 || r >= rows || c >= cols) {
                              continue;
                          }
                          int other = r * cols + c;
                          if (seen[other] || t[2 + r].charAt(c) != '~') {
                              continue;
                          }
                          seen[other] = true;
                          stack[top++] = other;
                      }
                  }
              }
              System.out.println(lakes);
          }
      }
