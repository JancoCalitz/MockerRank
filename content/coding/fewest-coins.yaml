    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const [n, amount] = t;
      const coins = t.slice(2, 2 + n);
      const best = new Array(amount + 1).fill(Infinity);
      best[0] = 0;
      for (let a = 1; a <= amount; a++) {
        for (const coin of coins) {
          if (coin <= a) best[a] = Math.min(best[a], best[a - coin] + 1);
        }
      }
      console.log(best[amount] === Infinity ? -1 : best[amount]);
  typescript:
