      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]), amount = Integer.parseInt(t[1]);
              int[] coins = new int[n];
              for (int i = 0; i < n; i++) {
                  coins[i] = Integer.parseInt(t[2 + i]);
              }
              int[] best = new int[amount + 1];
              for (int a = 1; a <= amount; a++) {
                  best[a] = Integer.MAX_VALUE;
                  for (int coin : coins) {
                      if (coin <= a && best[a - coin] != Integer.MAX_VALUE) {
                          best[a] = Math.min(best[a], best[a - coin] + 1);
                      }
                  }
              }
              System.out.println(best[amount] == Integer.MAX_VALUE ? -1 : best[amount]);
          }
      }
