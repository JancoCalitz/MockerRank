    solution: |
      import { readFileSync } from 'node:fs';

      const t: number[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const n = t[0]!;
      const amount = t[1]!;
      const coins: number[] = t.slice(2, 2 + n);
      const best: number[] = new Array<number>(amount + 1).fill(Infinity);
      best[0] = 0;
      for (let a = 1; a <= amount; a++) {
        for (const coin of coins) {
          if (coin <= a) best[a] = Math.min(best[a]!, best[a - coin]! + 1);
        }
      }
      console.log(best[amount] === Infinity ? -1 : best[amount]);
  python:
    starter: |
      import sys

      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import sys

      t = [int(x) for x in sys.stdin.read().split()]
      n, amount = t[0], t[1]
      coins = t[2:2 + n]
      impossible = amount + 1
      best = [0] + [impossible] * amount
      for a in range(1, amount + 1):
          for coin in coins:
              if coin <= a and best[a - coin] + 1 < best[a]:
                  best[a] = best[a - coin] + 1
      print(-1 if best[amount] == impossible else best[amount])
