id: fewest-coins
title: Fewest Coins
type: short
style: stdin
difficulty: medium
statement: |
  A vending machine gives change using coins of `n` different values, with an unlimited number of each. Find the fewest coins that add up to exactly
  `amount`, or print `-1` if that cannot be done.
inputFormat: |
  The first line contains `n` and `amount`.

  The second line contains the `n` coin values.
outputFormat: |
  The fewest coins, or `-1`.
constraints: |
  - 1 <= n <= 100
  - 0 <= amount <= 100000
  - 1 <= coin value <= 100000
sampleTests:
  - input: |
      3 6
      1 3 4
    output: |
      2
  - input: |
      1 3
      2
    output: |
      -1
hiddenTests:
  - input: |
      1 0
      5
    output: |
      0
  - input: |
      2 7
      5 2
    output: |
      2
  - input: |
      3 11
      1 2 5
    output: |
      3
  - input: |
      2 24
      7 5
    output: |
      4
    weight: 2
  - file: fewest-coins-large
    weight: 3
checker:
  type: exact
editorial: |
  Let `best[a]` be the fewest coins that make the amount `a`, with `best[0] = 0`. Then `best[a]` is 1 more than the smallest `best[a - coin]` across all coins. This takes
  O(n * amount) time and O(amount) space. Always taking the largest coin fails: with coins 1, 3, and 4, it makes 6 as 4 + 1 + 1 rather than 3 + 3.
tags: [dp]
topics: [recursion-dp]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), amount = int.Parse(t[1]);
              var coins = new int[n];
              for (int i = 0; i < n; i++) coins[i] = int.Parse(t[2 + i]);
              var best = new int[amount + 1];
              for (int a = 1; a <= amount; a++)
              {
                  best[a] = int.MaxValue;
                  foreach (int coin in coins)
                  {
                      if (coin <= a && best[a - coin] != int.MaxValue) best[a] = Math.Min(best[a], best[a - coin] + 1);
                  }
              }
              Console.WriteLine(best[amount] == int.MaxValue ? -1 : best[amount]);
          }
      }
