    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n, amount;
          cin >> n >> amount;
          vector<int> coins(n);
          for (int& coin : coins) cin >> coin;
          vector<int> best(amount + 1, INT_MAX);
          best[0] = 0;
          for (int a = 1; a <= amount; a++) {
              for (int coin : coins) {
                  if (coin <= a && best[a - coin] != INT_MAX) best[a] = min(best[a], best[a - coin] + 1);
              }
          }
          cout << (best[amount] == INT_MAX ? -1 : best[amount]) << endl;
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <limits.h>
      #include <stdio.h>

      static int coins[100], best[100001];

      int main(void) {
          int n, amount;
          scanf("%d %d", &n, &amount);
          for (int i = 0; i < n; i++) scanf("%d", &coins[i]);
          for (int a = 1; a <= amount; a++) {
              best[a] = INT_MAX;
              for (int i = 0; i < n; i++) {
                  if (coins[i] <= a && best[a - coins[i]] != INT_MAX && best[a - coins[i]] + 1 < best[a]) {
                      best[a] = best[a - coins[i]] + 1;
                  }
              }
          }
          printf("%d\n", best[amount] == INT_MAX ? -1 : best[amount]);
          return 0;
      }
  javascript:
