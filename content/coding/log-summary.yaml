    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n, total = 0;
          cin >> n;
          map<int, int> errors;
          for (int i = 0; i < n; i++) {
              int user, status;
              cin >> user >> status;
              errors[user] += status >= 500;
              total += status >= 500;
          }
          int worst = 0, most = 0;
          for (auto& [user, count] : errors) {
              if (count > most) {
                  most = count;
                  worst = user;
              }
          }
          cout << errors.size() << '\n' << total << '\n' << worst << endl;
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>

      static int errors[100001];
      static char seen[100001];

      int main(void) {
          int n, users = 0, total = 0, worst = 0, most = 0;
          scanf("%d", &n);
          for (int i = 0; i < n; i++) {
              int user, status;
              scanf("%d %d", &user, &status);
              if (!seen[user]) {
                  seen[user] = 1;
                  users++;
              }
              if (status >= 500) {
                  errors[user]++;
                  total++;
              }
          }
          for (int user = 1; user <= 100000; user++) {
              if (errors[user] > most) {
                  most = errors[user];
                  worst = user;
              }
          }
          printf("%d\n%d\n%d\n", users, total, worst);
          return 0;
      }
  javascript:
    starter: |
