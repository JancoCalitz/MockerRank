    solution: |
      import sys

      t = sys.stdin.read().split()
      errors = {}
      total = 0
      for i in range(int(t[0])):
          user = int(t[1 + 2 * i])
          error = 1 if int(t[2 + 2 * i]) >= 500 else 0
          errors[user] = errors.get(user, 0) + error
          total += error
      worst = 0
      most = 0
      for user, count in errors.items():
          if count > most or (count == most and most > 0 and user < worst):
              most = count
              worst = user
      print(len(errors))
      print(total)
      print(worst)
