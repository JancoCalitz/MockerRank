    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const errors = new Map();
      let total = 0;
      for (let i = 0; i < t[0]; i++) {
        const user = t[1 + 2 * i];
        const error = t[2 + 2 * i] >= 500 ? 1 : 0;
        errors.set(user, (errors.get(user) ?? 0) + error);
        total += error;
      }
      let worst = 0;
      let most = 0;
      for (const [user, count] of errors) {
        if (count > most || (count === most && most > 0 && user < worst)) {
          most = count;
          worst = user;
        }
      }
      console.log(`${errors.size}\n${total}\n${worst}`);
