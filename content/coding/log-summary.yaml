id: log-summary
title: Log Summary
type: long
style: stdin
difficulty: medium
statement: |
  A server log lists a user and a status code for each request. A status of `500` or above counts as an error. Report three things, one on each line:

  1. The number of different users.
  2. The total number of errors.
  3. The user with the most errors. If several users tie, use the lowest user number. If there are no errors, print `0`.
inputFormat: |
  The first line contains `n`.

  Each of the next `n` lines contains a request's `user` and `status`.
outputFormat: |
  The three values, each on its own line.
constraints: |
  - 1 <= n <= 100000
  - 1 <= user <= 100000
  - 100 <= status <= 599
sampleTests:
  - input: |
      4
      1 200
      2 500
      2 503
      3 404
    output: |
      3
      2
      2
  - input: |
      1
      9 200
    output: |
      1
      0
      0
hiddenTests:
  - input: |
      2
      8 500
      3 500
    output: |
      2
      2
      3
    weight: 2
  - input: |
      2
      5 499
      5 500
    output: |
      1
      1
      5
  - input: |
      3
      1 500
      1 200
      2 599
    output: |
      2
      2
      1
  - file: log-summary-large
    weight: 3
checker:
  type: exact
editorial: |
  Use one hash map, or an array indexed by user, to count errors and record which users appear. Then scan for the highest error count, keeping the lowest user number on ties. This takes O(n) time. The traps
  are all in the details: `499` is not an error, users with no errors still count as users, and the third value has a rule for ties and for no errors at all.
tags: [hash-map, parsing]
topics: [hashing]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;
      using System.Collections.Generic;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), total = 0;
              var errors = new Dictionary<int, int>();
              for (int i = 0; i < n; i++)
              {
                  int user = int.Parse(t[1 + 2 * i]);
                  errors.TryAdd(user, 0);
                  if (int.Parse(t[2 + 2 * i]) >= 500)
                  {
                      errors[user]++;
                      total++;
                  }
              }
              int worst = 0, most = 0;
              foreach (var entry in errors)
              {
                  if (entry.Value > most || (entry.Value == most && most > 0 && entry.Key < worst))
                  {
                      most = entry.Value;
                      worst = entry.Key;
                  }
              }
              Console.WriteLine(errors.Count + "\n" + total + "\n" + worst);
          }
      }
  java:
    starter: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              // Read from System.in and write to System.out.
          }
      }
    solution: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]), total = 0;
              Map<Integer, Integer> errors = new HashMap<>();
              for (int i = 0; i < n; i++) {
                  int user = Integer.parseInt(t[1 + 2 * i]);
                  int error = Integer.parseInt(t[2 + 2 * i]) >= 500 ? 1 : 0;
                  errors.merge(user, error, Integer::sum);
                  total += error;
              }
              int worst = 0, most = 0;
              for (Map.Entry<Integer, Integer> entry : errors.entrySet()) {
                  if (entry.getValue() > most || (entry.getValue() == most && most > 0 && entry.getKey() < worst)) {
                      most = entry.getValue();
                      worst = entry.getKey();
                  }
              }
              System.out.println(errors.size() + "\n" + total + "\n" + worst);
          }
      }
