id: queen-count
title: Queen Count
type: long
style: stdin
difficulty: hard
statement: |
  Place `n` queens on an `n` by `n` chess board so that no two attack each other. Queens attack along rows, columns, and diagonals. Count the different ways to do this.
inputFormat: |
  One line containing `n`.
outputFormat: |
  The number of ways.
constraints: |
  - 1 <= n <= 11
sampleTests:
  - input: |
      4
    output: |
      2
  - input: |
      1
    output: |
      1
hiddenTests:
  - input: |
      2
    output: |
      0
  - input: |
      3
    output: |
      0
  - input: |
      5
    output: |
      10
  - input: |
      8
    output: |
      92
    weight: 2
  - file: queen-count-large
    weight: 3
checker:
  type: exact
editorial: |
  Place one queen per row with backtracking. Arrays of used columns and diagonals make each check O(1): a cell's diagonals are identified by `row + column` and `row - column + n`. When a cell is free, mark it, recurse into the next row, then unmark it. This
  cuts off bad placements early, and is far faster than trying every arrangement. The time grows quickly with `n`, which is why `n` is small here.
tags: [backtracking]
topics: [recursion-dp]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          static int n;
          static bool[] cols = new bool[32], down = new bool[32], up = new bool[32];

          static int Place(int row)
          {
              if (row == n) return 1;
              int ways = 0;
              for (int c = 0; c < n; c++)
              {
                  if (cols[c] || down[row + c] || up[row - c + n]) continue;
                  cols[c] = down[row + c] = up[row - c + n] = true;
                  ways += Place(row + 1);
                  cols[c] = down[row + c] = up[row - c + n] = false;
              }
              return ways;
          }

          public static void Main(string[] args)
          {
              n = int.Parse(Console.In.ReadToEnd().Trim());
              Console.WriteLine(Place(0));
          }
      }
