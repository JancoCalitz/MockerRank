    solution: |
      import sys

      n = int(sys.stdin.read())


      def place(row, cols, down, up):
          if row == n:
              return 1
          ways = 0
          free = ((1 << n) - 1) & ~(cols | down | up)
          while free:
              bit = free & -free
              free ^= bit
              ways += place(row + 1, cols | bit, (down | bit) << 1, (up | bit) >> 1)
          return ways


      print(place(0, 0, 0, 0))
