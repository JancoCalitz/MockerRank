id: same-letters
title: Same Letters
type: short
style: stdin
difficulty: easy
statement: |
  A word game needs to know if one word can be made by rearranging all of the letters of another. Print `YES` if it can, and
  `NO` if it cannot.
inputFormat: |
  Two lines, each containing a word of lowercase letters.
outputFormat: |
  `YES` or `NO`.
constraints: |
  - 1 <= length of each word <= 100000
sampleTests:
  - input: |
      listen
      silent
    output: |
      YES
  - input: |
      apple
      pale
    output: |
      NO
hiddenTests:
  - input: |
      a
      a
    output: |
      YES
  - input: |
      aab
      abb
    output: |
      NO
    weight: 2
  - input: |
      ab
      abc
    output: |
      NO
  - input: |
      abc
      cab
    output: |
      YES
  - file: same-letters-large
    weight: 3
checker:
  type: exact
editorial: |
  Count each letter in the first word, then subtract the counts for the second. The words match only if they have the same length
  and every count ends at 0. This takes O(n) time. Sorting both words also works, in O(n log n) time. Comparing only the sets of
  letters fails on `aab` and `abb`.
tags: [anagrams, counting]
topics: [hashing]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              var counts = new int[26];
              foreach (char c in t[0]) counts[c - 'a']++;
              foreach (char c in t[1]) counts[c - 'a']--;
              Console.WriteLine(Array.TrueForAll(counts, count => count == 0) ? "YES" : "NO");
          }
      }
  java:
    starter: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              // Read from System.in and write to System.out.
          }
      }
    solution: |
      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int[] counts = new int[26];
              for (int i = 0; i < t[0].length(); i++) {
                  counts[t[0].charAt(i) - 'a']++;
              }
              for (int i = 0; i < t[1].length(); i++) {
                  counts[t[1].charAt(i) - 'a']--;
              }
              boolean same = true;
              for (int count : counts) {
                  same = same && count == 0;
              }
              System.out.println(same ? "YES" : "NO");
          }
      }
  cpp:
    starter: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          // Read from cin and write to cout.
          return 0;
      }
    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          string a, b;
          cin >> a >> b;
          sort(a.begin(), a.end());
          sort(b.begin(), b.end());
          cout << (a == b ? "YES" : "NO") << endl;
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>

      static char a[100002], b[100002];

      int main(void) {
          int counts[26] = {0}, same = 1;
          scanf("%100001s %100001s", a, b);
          for (char *p = a; *p; p++) counts[*p - 'a']++;
          for (char *p = b; *p; p++) counts[*p - 'a']--;
          for (int i = 0; i < 26; i++) {
              if (counts[i] != 0) same = 0;
          }
          puts(same ? "YES" : "NO");
          return 0;
      }
  javascript:
    starter: |
      const input = require('fs').readFileSync(0, 'utf8');
      // Parse the input and print the answer with console.log.
    solution: |
      const [a, b] = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean);
      const counts = new Map();
      for (const c of a) counts.set(c, (counts.get(c) ?? 0) + 1);
      for (const c of b) counts.set(c, (counts.get(c) ?? 0) - 1);
      console.log([...counts.values()].every((count) => count === 0) ? 'YES' : 'NO');
  typescript:
    starter: |
      import { readFileSync } from 'node:fs';

      const input: string = readFileSync(0, 'utf8');
      // Parse the input and print the answer with console.log.
    solution: |
      import { readFileSync } from 'node:fs';

      const words: string[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean);
      const counts = new Map<string, number>();
      for (const c of words[0]!) counts.set(c, (counts.get(c) ?? 0) + 1);
      for (const c of words[1]!) counts.set(c, (counts.get(c) ?? 0) - 1);
      console.log([...counts.values()].every((count) => count === 0) ? 'YES' : 'NO');
  python:
    starter: |
      import sys

      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import sys
      from collections import Counter

      a, b = sys.stdin.read().split()
      print('YES' if Counter(a) == Counter(b) else 'NO')
