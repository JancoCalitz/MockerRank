    solution: |
      def min_cost(sizes, prices, k):
          best = [0] + [float('inf')] * k
          for i in range(1, k + 1):
              for size, price in zip(sizes, prices):
                  best[i] = min(best[i], best[max(0, i - size)] + price)
          return best[k]
