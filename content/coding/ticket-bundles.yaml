id: ticket-bundles
title: Ticket Bundles
type: long
style: function
difficulty: medium
statement: |
  A venue sells tickets only in bundles, and you can buy any number of each bundle. You need at least
  `k` tickets, and having extra is fine.

  Complete the function `minCost`, which returns the lowest total price for at least `k` tickets. Its
  parameters are the size and price of each bundle, and `k`.

  The provided code reads the input and prints your function's return value.
inputFormat: |
  The first line contains `n` and `k`, the number of bundles and the tickets needed.

  Each of the next `n` lines contains a bundle's `size` and `price`.
outputFormat: |
  The lowest total price.
constraints: |
  - 1 <= n <= 100
  - 1 <= k <= 100000
  - 1 <= size <= 100000
  - 1 <= price <= 1000000
