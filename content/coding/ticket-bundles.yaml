checker:
  type: exact
editorial: |
  Let `best[i]` be the lowest price for at least `i` tickets, with `best[0] = 0`. For each bundle,
  `best[i] = min(best[max(0, i - size)] + price)`. This takes O(nk) time and O(k) space. Always taking
  the best price per ticket can fail, because the last bundle may overshoot by more than it saves.
  The total can exceed 32 bits, so use a 64-bit integer. Note the `max(0, ...)`, which allows buying
  more than needed.
