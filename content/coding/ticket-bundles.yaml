      long long minCost(const vector<int>& sizes, const vector<int>& prices, int k) {
          vector<long long> best(k + 1, LLONG_MAX);
          best[0] = 0;
          for (int i = 1; i <= k; i++) {
              for (size_t b = 0; b < sizes.size(); b++) {
                  best[i] = min(best[i], best[max(0, i - sizes[b])] + prices[b]);
              }
          }
          return best[k];
      }
