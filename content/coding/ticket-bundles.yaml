    solution: |
      long long minCost(int n, const int *sizes, const int *prices, int k) {
          long long *best = malloc((k + 1) * sizeof(long long));
          best[0] = 0;
          for (int i = 1; i <= k; i++) {
              best[i] = -1;
              for (int b = 0; b < n; b++) {
                  int before = i - sizes[b] < 0 ? 0 : i - sizes[b];
                  long long cost = best[before] + prices[b];
                  if (best[i] < 0 || cost < best[i]) best[i] = cost;
              }
          }
          long long answer = best[k];
          free(best);
          return answer;
      }
