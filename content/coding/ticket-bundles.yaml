      class Solution
      {
          {{USER_CODE}}

          public static void Main(string[] args)
          {
              int[] t = Console.In.ReadToEnd()
                  .Split((char[])null, StringSplitOptions.RemoveEmptyEntries)
                  .Select(int.Parse)
                  .ToArray();
              int n = t[0], k = t[1];
              var sizes = new int[n];
              var prices = new int[n];
              for (int i = 0; i < n; i++)
              {
                  sizes[i] = t[2 + 2 * i];
                  prices[i] = t[3 + 2 * i];
              }
              Console.WriteLine(MinCost(sizes, prices, k));
          }
      }
    solution: |
      public static long MinCost(int[] sizes, int[] prices, int k)
      {
          var best = new long[k + 1];
          for (int i = 1; i <= k; i++)
          {
              best[i] = long.MaxValue;
              for (int b = 0; b < sizes.Length; b++)
              {
                  best[i] = Math.Min(best[i], best[Math.Max(0, i - sizes[b])] + prices[b]);
              }
          }
          return best[k];
      }
