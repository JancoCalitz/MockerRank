      const s = require('fs').readFileSync(0, 'utf8').trim();
      let best = 0;
      for (let centre = 0; centre < 2 * s.length - 1; centre++) {
        let left = centre >> 1;
        let right = left + (centre % 2);
        while (left >= 0 && right < s.length && s[left] === s[right]) {
          left--;
          right++;
        }
        best = Math.max(best, right - left - 1);
      }
      console.log(best);
