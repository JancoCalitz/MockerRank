id: mirror-stretch
title: Mirror Stretch
type: long
style: stdin
difficulty: medium
statement: |
  In a strand of letters, a mirror stretch is an unbroken part that reads the same forward and backward. Find the length of the longest mirror stretch.
inputFormat: |
  One line containing a string of lowercase letters.
outputFormat: |
  The length of the longest mirror stretch.
constraints: |
  - 1 <= length of the string <= 4000
sampleTests:
  - input: |
      babad
    output: |
      3
  - input: |
      cbbd
    output: |
      2
hiddenTests:
  - input: |
      a
    output: |
      1
  - input: |
      abcde
    output: |
      1
  - input: |
      aaaa
    output: |
      4
  - input: |
      forgeeksskeegfor
    output: |
      10
    weight: 2
  - input: |
      abacdfgdcaba
    output: |
      3
    weight: 2
  - file: mirror-stretch-large
    weight: 3
checker:
  type: exact
editorial: |
  Every mirror stretch has a centre, which is either a letter or the gap between two letters. There are `2n - 1` centres. Expand outward from each while the two letters match, and keep the longest.
  This takes O(n^2) time in the worst case and O(1) space. Remember to try both odd and even lengths. Checking every substring separately takes O(n^3) time. Manacher's algorithm solves this in O(n) time, but is not needed here.
tags: [strings, palindromes]
topics: [arrays-strings, recursion-dp]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              string s = Console.In.ReadToEnd().Trim();
              int best = 0;
              for (int centre = 0; centre < 2 * s.Length - 1; centre++)
              {
                  int left = centre / 2, right = left + centre % 2;
                  while (left >= 0 && right < s.Length && s[left] == s[right])
                  {
                      left--;
                      right++;
                  }
                  best = Math.Max(best, right - left - 1);
              }
              Console.WriteLine(best);
          }
      }
