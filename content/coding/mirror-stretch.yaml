      using namespace std;

      int main() {
          string s;
          cin >> s;
          int best = 0, size = s.size();
          for (int centre = 0; centre < 2 * size - 1; centre++) {
              int left = centre / 2, right = left + centre % 2;
              while (left >= 0 && right < size && s[left] == s[right]) {
                  left--;
                  right++;
              }
              best = max(best, right - left - 1);
          }
          cout << best << endl;
          return 0;
      }
