    solution: |
      import sys

      s = sys.stdin.read().strip()
      size = len(s)
      best = 0
      for centre in range(2 * size - 1):
          left = centre // 2
          right = left + centre % 2
          while left >= 0 and right < size and s[left] == s[right]:
              left -= 1
              right += 1
          best = max(best, right - left - 1)
      print(best)
