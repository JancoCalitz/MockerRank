    solution: |
      #include <stdio.h>
      #include <string.h>

      static char s[4002];

      int main(void) {
          scanf("%4001s", s);
          int best = 0, size = strlen(s);
          for (int centre = 0; centre < 2 * size - 1; centre++) {
              int left = centre / 2, right = left + centre % 2;
              while (left >= 0 && right < size && s[left] == s[right]) {
                  left--;
                  right++;
              }
              if (right - left - 1 > best) best = right - left - 1;
          }
          printf("%d\n", best);
          return 0;
      }
