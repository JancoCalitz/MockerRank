    harness: |
      using System;
      using System.Collections.Generic;
      using System.Linq;

      class Solution
      {
          {{USER_CODE}}

          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]);
              var values = new int[n];
              for (int i = 0; i < n; i++) values[i] = int.Parse(t[i + 1]);
              Console.WriteLine(MajorityVote(values));
          }
      }
    solution: |
      public static int MajorityVote(int[] values)
      {
          int candidate = 0, count = 0;
          foreach (int value in values)
          {
              if (count == 0) candidate = value;
              count += value == candidate ? 1 : -1;
          }
          return candidate;
      }
