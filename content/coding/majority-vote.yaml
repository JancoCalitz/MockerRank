id: majority-vote
title: Majority Vote
type: short
style: function
difficulty: medium
statement: |
  A committee recorded the candidate number on each vote. One candidate received more than half of the votes.

  Complete the function `majorityVote`, which returns that candidate's number.

  The provided code reads the input and prints your function's return value.
inputFormat: |
  The first line contains `n`.

  The second line contains `n` candidate numbers.
outputFormat: |
  The candidate with more than half of the votes.
constraints: |
  - 1 <= n <= 199999
  - 1 <= candidate number <= 1000000
  - One candidate always has more than half of the votes.
sampleTests:
  - input: |
      5
      2 1 2 3 2
    output: |
      2
  - input: |
      1
      9
    output: |
      9
hiddenTests:
  - input: |
      3
      4 4 1
    output: |
      4
  - input: |
      3
      1 4 4
    output: |
      4
  - input: |
      7
      3 1 3 2 3 1 3
    output: |
      3
    weight: 2
  - file: majority-vote-large
    weight: 3
checker:
  type: exact
editorial: |
  A hash map of counts works in O(n) time and O(n) space. The Boyer-Moore vote needs only O(1) space: keep a candidate and a counter.
  Add one for a matching vote and subtract one for any other, and take the current vote as the candidate whenever the counter is 0. Every
  other vote can cancel one majority vote at most, so the majority candidate is always the one left. This relies on a majority existing.
tags: [counting, boyer-moore]
topics: [hashing]
