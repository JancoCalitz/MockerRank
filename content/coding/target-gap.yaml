      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      static int ascending(const void *a, const void *b) {
          int x = *(const int *)a, y = *(const int *)b;
          return (x > y) - (x < y);
      }

      int main(void) {
          int n, k, low = 0, high = 0;
          long long pairs = 0;
          scanf("%d %d", &n, &k);
          int *prices = malloc(sizeof(int) * n);
          for (int i = 0; i < n; i++) scanf("%d", &prices[i]);
          qsort(prices, n, sizeof(int), ascending);
          for (int i = 0; i < n; i++) {
              long long target = (long long)prices[i] + k;
              while (low < n && prices[low] < target) low++;
              while (high < n && prices[high] <= target) high++;
              pairs += high - low;
          }
          printf("%lld\n", pairs);
          free(prices);
          return 0;
      }
