    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const k = t[1];
      const counts = new Map();
      for (let i = 0; i < t[0]; i++) counts.set(t[2 + i], (counts.get(t[2 + i]) ?? 0) + 1);
      let pairs = 0;
      for (const [price, count] of counts) pairs += count * (counts.get(price + k) ?? 0);
      console.log(pairs);
