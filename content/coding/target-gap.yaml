    solution: |
      import sys
      from collections import Counter

      t = sys.stdin.read().split()
      n, k = int(t[0]), int(t[1])
      counts = Counter(int(x) for x in t[2:2 + n])
      print(sum(count * counts.get(price + k, 0) for price, count in counts.items()))
