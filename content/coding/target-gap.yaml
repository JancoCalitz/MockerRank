id: target-gap
title: Target Gap
type: short
style: stdin
difficulty: medium
statement: |
  A trading tool wants to find pairs of trades whose prices differ by exactly `k`. Count the pairs of different positions `i` and
  `j` where `price[j] - price[i]` equals `k`. Each pair of positions counts once, and prices can repeat.
inputFormat: |
  The first line contains `n` and `k`.

  The second line contains `n` prices.
outputFormat: |
  The number of pairs.
constraints: |
  - 2 <= n <= 200000
  - 1 <= k <= 1000000000
  - 0 <= price <= 1000000000
sampleTests:
  - input: |
      5 2
      1 5 3 4 2
    output: |
      3
  - input: |
      3 1
      7 7 8
    output: |
      2
hiddenTests:
  - input: |
      2 5
      1 2
    output: |
      0
  - input: |
      4 3
      1 1 4 4
    output: |
      4
    weight: 2
  - input: |
      2 1000000000
      1000000000 0
    output: |
      1
  - file: target-gap-large
    weight: 3
checker:
  type: exact
editorial: |
  Sort the prices, then use two pointers to find each block of equal values and the block `k` above it. Each matching pair of blocks adds the
  product of their sizes. A hash map of counts gives the same result in O(n) average time. The count can reach about 10^10, so use a
  64-bit integer. Comparing every pair takes O(n^2) time.
tags: [two-pointers, hash-map]
topics: [hashing, sorting-searching]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;
      using System.Collections.Generic;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), k = int.Parse(t[1]);
              var counts = new Dictionary<int, long>();
              for (int i = 0; i < n; i++)
              {
                  int price = int.Parse(t[2 + i]);
                  counts.TryGetValue(price, out long count);
                  counts[price] = count + 1;
              }
              long pairs = 0;
              foreach (var entry in counts)
              {
                  if (entry.Key <= 1000000000 - k && counts.TryGetValue(entry.Key + k, out long above))
                  {
                      pairs += entry.Value * above;
                  }
              }
              Console.WriteLine(pairs);
          }
      }
  java:
    starter: |
      import java.io.*;
