      int main() {
          int n;
          long long k;
          cin >> n >> k;
          vector<long long> prices(n);
          for (auto& price : prices) cin >> price;
          sort(prices.begin(), prices.end());
          long long pairs = 0;
          for (long long price : prices) {
              auto range = equal_range(prices.begin(), prices.end(), price + k);
              pairs += range.second - range.first;
          }
          cout << pairs << endl;
