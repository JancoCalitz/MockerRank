id: reverse-chain
title: Reverse the Chain
type: short
style: stdin
difficulty: medium
statement: |
  A singly linked list of `n` nodes is stored in arrays. Reverse the list, then print its values from the new first node to the new last node.
inputFormat: |
  The first line contains `n` and `head`, the first node.

  The second line contains the value of nodes `1` to `n`.

  The third line contains the next node after each of nodes `1` to `n`, or `0` for the last node. Every node is part of the list.
outputFormat: |
  The values of the reversed list, separated by spaces.
constraints: |
  - 1 <= n <= 100000
  - 1 <= value <= 1000000
sampleTests:
  - input: |
      3 2
      10 20 30
      0 3 1
    output: |
      10 30 20
  - input: |
      1 1
      7
      0
    output: |
      7
hiddenTests:
  - input: |
      2 2
      5 6
      0 1
    output: |
      5 6
    weight: 2
  - input: |
      4 1
      1 2 3 4
      2 3 4 0
    output: |
      4 3 2 1
  - input: |
      3 3
      1 2 3
      2 0 1
    output: |
      2 1 3
  - file: reverse-chain-large
    weight: 3
checker:
  type: exact
editorial: |
  Walk the list once, turning each node's next pointer to point at the node before it. You need three variables: the previous node, the current node, and
  the saved next node. Save the next node before changing the pointer, or the rest of the list is lost. This takes O(n) time and O(1) extra space. A
  recursive version can overflow the call stack on a list this long.
tags: [reversal]
topics: [linked-lists]
languages:
  csharp:
    starter: |
