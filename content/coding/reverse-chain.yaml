      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]), node = Integer.parseInt(t[1]), previous = 0;
              int[] next = new int[n + 1];
              for (int i = 1; i <= n; i++) {
                  next[i] = Integer.parseInt(t[1 + n + i]);
              }
              while (node != 0) {
                  int following = next[node];
                  next[node] = previous;
                  previous = node;
                  node = following;
              }
              StringBuilder output = new StringBuilder();
              for (int at = previous; at != 0; at = next[at]) {
                  output.append(t[1 + at]).append(next[at] != 0 ? " " : "");
              }
              System.out.println(output);
          }
      }
