      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;
      using System.Text;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), node = int.Parse(t[1]), previous = 0;
              var next = new int[n + 1];
              for (int i = 1; i <= n; i++) next[i] = int.Parse(t[1 + n + i]);
              while (node != 0)
              {
                  int following = next[node];
                  next[node] = previous;
                  previous = node;
                  node = following;
              }
              var output = new StringBuilder();
              for (int at = previous; at != 0; at = next[at])
              {
                  output.Append(t[1 + at]).Append(next[at] != 0 ? " " : "");
              }
              Console.WriteLine(output);
          }
      }
