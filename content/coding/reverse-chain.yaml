      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n, node, previous = 0;
          cin >> n >> node;
          vector<int> values(n + 1), next(n + 1);
          for (int i = 1; i <= n; i++) cin >> values[i];
          for (int i = 1; i <= n; i++) cin >> next[i];
          while (node != 0) {
              int following = next[node];
              next[node] = previous;
              previous = node;
              node = following;
          }
          for (int at = previous; at != 0; at = next[at]) cout << values[at] << (next[at] != 0 ? ' ' : '\n');
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      int main(void) {
          int n, node, previous = 0;
          scanf("%d %d", &n, &node);
          int *values = malloc(sizeof(int) * (n + 1)), *next = malloc(sizeof(int) * (n + 1));
          for (int i = 1; i <= n; i++) scanf("%d", &values[i]);
          for (int i = 1; i <= n; i++) scanf("%d", &next[i]);
          while (node != 0) {
              int following = next[node];
              next[node] = previous;
              previous = node;
              node = following;
          }
          for (int at = previous; at != 0; at = next[at]) printf("%d%c", values[at], next[at] != 0 ? ' ' : '\n');
          free(values);
          free(next);
          return 0;
      }
