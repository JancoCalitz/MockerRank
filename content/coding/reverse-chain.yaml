    solution: |
      import sys

      t = sys.stdin.read().split()
      n, node = int(t[0]), int(t[1])
      values = [''] + t[2:2 + n]
      next_node = [0] + [int(x) for x in t[2 + n:2 + 2 * n]]
      previous = 0
      while node != 0:
          following = next_node[node]
          next_node[node] = previous
          previous = node
          node = following
      output = []
      at = previous
      while at != 0:
          output.append(values[at])
          at = next_node[at]
      print(' '.join(output))
