    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const n = t[0];
      let node = t[1];
      let previous = 0;
      const next = t.slice(1 + n);
      while (node !== 0) {
        const following = next[node];
        next[node] = previous;
        previous = node;
        node = following;
      }
      const output = [];
      for (let at = previous; at !== 0; at = next[at]) output.push(t[1 + at]);
      console.log(output.join(' '));
