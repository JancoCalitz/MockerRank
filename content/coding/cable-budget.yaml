      import { readFileSync } from 'node:fs';

      const t: number[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const n = t[0]!;
      const m = t[1]!;
      const parent: number[] = Array.from({ length: n + 1 }, (_, i) => i);
      function find(x: number): number {
        while (parent[x] !== x) {
          parent[x] = parent[parent[x]!]!;
          x = parent[x]!;
        }
        return x;
      }
      const order: number[] = Array.from({ length: m }, (_, i) => i).sort(
        (a, b) => t[4 + 3 * a]! - t[4 + 3 * b]!,
      );
