    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      vector<int> parent;

      int findRoot(int x) {
          while (parent[x] != x) {
              parent[x] = parent[parent[x]];
              x = parent[x];
          }
          return x;
      }

      int main() {
          int n, m;
          cin >> n >> m;
          vector<array<int, 3>> cables(m);
          for (auto& cable : cables) cin >> cable[1] >> cable[2] >> cable[0];
          sort(cables.begin(), cables.end());
          parent.resize(n + 1);
          iota(parent.begin(), parent.end(), 0);
          long long total = 0;
          int taken = 0;
          for (auto& cable : cables) {
              int a = findRoot(cable[1]), b = findRoot(cable[2]);
              if (a == b) continue;
              parent[a] = b;
              total += cable[0];
              taken++;
          }
          cout << (taken == n - 1 ? total : -1) << endl;
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      typedef struct {
          int a, b, cost;
      } Cable;

      static int parent[50001];

      static int findRoot(int x) {
          while (parent[x] != x) {
              parent[x] = parent[parent[x]];
              x = parent[x];
          }
          return x;
      }

      static int byCost(const void *a, const void *b) {
          int x = ((const Cable *)a)->cost, y = ((const Cable *)b)->cost;
          return (x > y) - (x < y);
      }

      int main(void) {
          int n, m, taken = 0;
          long long total = 0;
          scanf("%d %d", &n, &m);
          Cable *cables = malloc(sizeof(Cable) * (m + 1));
          for (int i = 0; i < m; i++) scanf("%d %d %d", &cables[i].a, &cables[i].b, &cables[i].cost);
          qsort(cables, m, sizeof(Cable), byCost);
          for (int i = 1; i <= n; i++) parent[i] = i;
          for (int i = 0; i < m; i++) {
              int a = findRoot(cables[i].a), b = findRoot(cables[i].b);
              if (a == b) continue;
              parent[a] = b;
              total += cables[i].cost;
              taken++;
          }
          printf("%lld\n", taken == n - 1 ? total : -1);
          free(cables);
          return 0;
      }
