id: cable-budget
title: Cable Budget
type: long
style: stdin
difficulty: medium
statement: |
  A campus has `n` buildings and a list of possible cables, each with a cost. Choose cables so that every building can reach every other, for the lowest total cost. Print that cost,
  or `-1` if it cannot be done.
inputFormat: |
  The first line contains `n` and `m`, the number of possible cables.

  Each of the next `m` lines contains a cable's `a`, `b`, and `cost`.
outputFormat: |
  The lowest total cost, or `-1`.
constraints: |
  - 1 <= n <= 50000
  - 0 <= m <= 100000
  - 1 <= a, b <= n
  - 1 <= cost <= 1000000
sampleTests:
  - input: |
      3 3
      1 2 5
      2 3 1
      1 3 2
    output: |
      3
  - input: |
      3 1
      1 2 5
    output: |
      -1
hiddenTests:
  - input: |
      1 0
    output: |
      0
  - input: |
      2 2
      1 1 1
      1 2 9
    output: |
      9
    weight: 2
  - input: |
      4 5
      1 2 1
      2 3 2
      3 4 3
      4 1 4
      1 3 5
    output: |
      6
    weight: 2
  - input: |
      2 2
      1 2 7
      2 1 3
    output: |
      3
  - file: cable-budget-large
    weight: 3
checker:
  type: exact
editorial: |
  This is a minimum spanning tree. Use Kruskal's algorithm: sort the cables by cost, and take each one that connects two separate groups, tracked with a union-find structure. If you take fewer than
  `n - 1` cables, the buildings cannot all be connected. This takes O(m log m) time. The total can exceed 32 bits. Cables from a building to itself never help, and union-find skips them without extra code.
tags: [spanning-tree, union-find]
topics: [trees-graphs, sorting-searching]
languages:
  csharp:
    starter: |
