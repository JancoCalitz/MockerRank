              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          static int[] parent;

          static int Find(int x)
          {
              while (parent[x] != x)
              {
                  parent[x] = parent[parent[x]];
                  x = parent[x];
              }
              return x;
          }

          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), m = int.Parse(t[1]);
              var costs = new int[m];
              var order = new int[m];
              for (int i = 0; i < m; i++)
              {
                  costs[i] = int.Parse(t[4 + 3 * i]);
                  order[i] = i;
              }
              Array.Sort(costs, order);
              parent = new int[n + 1];
              for (int i = 1; i <= n; i++) parent[i] = i;
              long total = 0;
              int taken = 0;
              for (int i = 0; i < m; i++)
              {
                  int a = Find(int.Parse(t[2 + 3 * order[i]])), b = Find(int.Parse(t[3 + 3 * order[i]]));
                  if (a == b) continue;
                  parent[a] = b;
                  total += costs[i];
                  taken++;
              }
              Console.WriteLine(taken == n - 1 ? total : -1);
          }
      }
