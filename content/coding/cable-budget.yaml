      const order = Array.from({ length: m }, (_, i) => i).sort((a, b) => t[4 + 3 * a] - t[4 + 3 * b]);
      let total = 0;
      let taken = 0;
      for (const i of order) {
        const a = find(t[2 + 3 * i]);
        const b = find(t[3 + 3 * i]);
        if (a === b) continue;
        parent[a] = b;
        total += t[4 + 3 * i];
