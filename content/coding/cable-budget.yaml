    solution: |
      import sys

      t = sys.stdin.read().split()
      n, m = int(t[0]), int(t[1])
      cables = sorted((int(t[4 + 3 * i]), int(t[2 + 3 * i]), int(t[3 + 3 * i])) for i in range(m))
      parent = list(range(n + 1))


      def find(x):
          while parent[x] != x:
              parent[x] = parent[parent[x]]
              x = parent[x]
          return x


      total = taken = 0
      for cost, a, b in cables:
          a, b = find(a), find(b)
          if a != b:
              parent[a] = b
              total += cost
              taken += 1
      print(total if taken == n - 1 else -1)
