    solution: |
      import java.io.*;
      import java.util.*;

      public class Main {
          static int[] parent;

          static int find(int x) {
              while (parent[x] != x) {
                  parent[x] = parent[parent[x]];
                  x = parent[x];
              }
              return x;
          }

          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]), m = Integer.parseInt(t[1]);
              long[] cables = new long[m];
              for (int i = 0; i < m; i++) {
                  cables[i] = Long.parseLong(t[4 + 3 * i]) * m + i;
              }
              Arrays.sort(cables);
              parent = new int[n + 1];
              for (int i = 1; i <= n; i++) {
                  parent[i] = i;
              }
              long total = 0;
              int taken = 0;
              for (long cable : cables) {
                  int index = (int) (cable % m);
                  int a = find(Integer.parseInt(t[2 + 3 * index])), b = find(Integer.parseInt(t[3 + 3 * index]));
                  if (a != b) {
                      parent[a] = b;
                      total += cable / m;
                      taken++;
                  }
              }
              System.out.println(taken == n - 1 ? total : -1);
          }
      }
