      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import sys

      t = [int(x) for x in sys.stdin.read().split()]
      n, limit = t[0], t[1]
      best = [0] * (limit + 1)
      for i in range(n):
          weight, value = t[2 + 2 * i], t[3 + 2 * i]
          for w in range(limit, weight - 1, -1):
              candidate = best[w - weight] + value
              if candidate > best[w]:
                  best[w] = candidate
      print(best[limit])
