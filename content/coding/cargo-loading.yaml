      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const [n, limit] = t;
      const best = new Array(limit + 1).fill(0);
      for (let i = 0; i < n; i++) {
        const weight = t[2 + 2 * i];
        const value = t[3 + 2 * i];
        for (let w = limit; w >= weight; w--) {
          best[w] = Math.max(best[w], best[w - weight] + value);
        }
      }
      console.log(best[limit]);
