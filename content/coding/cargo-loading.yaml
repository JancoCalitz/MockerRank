    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n, limit;
          cin >> n >> limit;
          vector<int> best(limit + 1);
          for (int i = 0; i < n; i++) {
              int weight, value;
              cin >> weight >> value;
              for (int w = limit; w >= weight; w--) {
                  best[w] = max(best[w], best[w - weight] + value);
              }
          }
          cout << best[limit] << endl;
          return 0;
      }
