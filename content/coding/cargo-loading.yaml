    solution: |
      #include <stdio.h>

      static int best[10001];

      int main(void) {
          int n, limit;
          scanf("%d %d", &n, &limit);
          for (int i = 0; i < n; i++) {
              int weight, value;
              scanf("%d %d", &weight, &value);
              for (int w = limit; w >= weight; w--) {
                  if (best[w - weight] + value > best[w]) best[w] = best[w - weight] + value;
              }
          }
          printf("%d\n", best[limit]);
          return 0;
      }
