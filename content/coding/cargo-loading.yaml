id: cargo-loading
title: Cargo Loading
type: long
style: stdin
difficulty: medium
statement: |
  A van can carry a limited total weight. Each crate has a weight and a value, and can be loaded at most once. Find
  the largest total value that fits in the van.
inputFormat: |
  The first line contains `n` and `limit`, the number of crates and the van's weight limit.

  Each of the next `n` lines contains a crate's `weight` and `value`.
outputFormat: |
  The largest total value.
constraints: |
  - 1 <= n <= 200
  - 1 <= limit <= 10000
  - 1 <= weight <= 10000
  - 1 <= value <= 1000000
sampleTests:
  - input: |
      3 5
      2 3
      3 4
      4 5
    output: |
      7
  - input: |
      1 1
      2 9
    output: |
      0
hiddenTests:
  - input: |
      2 5
      5 1
      5 2
    output: |
      2
  - input: |
      3 6
      3 5
      3 5
      3 5
    output: |
      10
    weight: 2
  - input: |
      3 10
      6 30
      5 20
      5 20
    output: |
      40
    weight: 2
  - file: cargo-loading-large
    weight: 3
checker:
  type: exact
editorial: |
  This is the 0/1 knapsack problem. Let `best[w]` be the largest value with a total weight of at most `w`. For each
  crate, update `best` from the highest weight downward, so that the crate cannot be counted twice. This takes
  O(n * limit) time and O(limit) space. Always taking the crate with the best value for its weight fails here: in the
  third hidden test, it would take the crate worth 30, when two crates worth 20 are better.
tags: [dp, knapsack]
topics: [recursion-dp]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), limit = int.Parse(t[1]);
              var best = new int[limit + 1];
              for (int i = 0; i < n; i++)
              {
                  int weight = int.Parse(t[2 + 2 * i]), value = int.Parse(t[3 + 2 * i]);
                  for (int w = limit; w >= weight; w--)
                  {
                      best[w] = Math.Max(best[w], best[w - weight] + value);
                  }
              }
              Console.WriteLine(best[limit]);
          }
      }
