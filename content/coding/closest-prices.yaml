      import { readFileSync } from 'node:fs';

      const t: number[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const prices: number[] = t.slice(1, 1 + t[0]!).sort((a, b) => a - b);
      let best = Infinity;
      for (let i = 1; i < prices.length; i++) best = Math.min(best, prices[i]! - prices[i - 1]!);
      console.log(best);
