    solution: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]), best = Integer.MAX_VALUE;
              int[] prices = new int[n];
              for (int i = 0; i < n; i++) {
                  prices[i] = Integer.parseInt(t[1 + i]);
              }
              Arrays.sort(prices);
              for (int i = 1; i < n; i++) {
                  best = Math.min(best, prices[i] - prices[i - 1]);
              }
              System.out.println(best);
          }
      }
