      }
    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n, best = INT_MAX;
          cin >> n;
          vector<int> prices(n);
          for (int& price : prices) cin >> price;
          sort(prices.begin(), prices.end());
          for (int i = 1; i < n; i++) best = min(best, prices[i] - prices[i - 1]);
          cout << best << endl;
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <limits.h>
      #include <stdio.h>
      #include <stdlib.h>

      static int ascending(const void *a, const void *b) {
          int x = *(const int *)a, y = *(const int *)b;
          return (x > y) - (x < y);
      }

      int main(void) {
          int n, best = INT_MAX;
          scanf("%d", &n);
          int *prices = malloc(sizeof(int) * n);
          for (int i = 0; i < n; i++) scanf("%d", &prices[i]);
          qsort(prices, n, sizeof(int), ascending);
          for (int i = 1; i < n; i++) {
              if (prices[i] - prices[i - 1] < best) best = prices[i] - prices[i - 1];
          }
          printf("%d\n", best);
          free(prices);
          return 0;
      }
