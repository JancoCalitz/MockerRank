id: closest-prices
title: Closest Prices
type: short
style: stdin
difficulty: easy
statement: |
  A shop wants to find the two products with the closest prices. Print the smallest difference between the prices of any two products.
inputFormat: |
  The first line contains `n`.

  The second line contains `n` prices.
outputFormat: |
  The smallest difference.
constraints: |
  - 2 <= n <= 200000
  - 0 <= price <= 1000000000
sampleTests:
  - input: |
      4
      30 5 20 9
    output: |
      4
  - input: |
      3
      7 7 100
    output: |
      0
hiddenTests:
  - input: |
      2
      0 1000000000
    output: |
      1000000000
  - input: |
      3
      1 2 4
    output: |
      1
  - input: |
      5
      100 80 60 40 21
    output: |
      19
    weight: 2
  - file: closest-prices-large
    weight: 3
checker:
  type: exact
editorial: |
  After sorting, the closest pair must be next to each other, so one pass over neighbouring prices finds the answer. This takes O(n log n)
  time. Comparing every pair takes O(n^2) time. Make sure the sort compares numbers, not text.
tags: [sorting]
topics: [sorting-searching]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), best = int.MaxValue;
              var prices = new int[n];
              for (int i = 0; i < n; i++) prices[i] = int.Parse(t[1 + i]);
              Array.Sort(prices);
              for (int i = 1; i < n; i++) best = Math.Min(best, prices[i] - prices[i - 1]);
              Console.WriteLine(best);
          }
      }
  java:
    starter: |
      import java.io.*;
      import java.util.*;

