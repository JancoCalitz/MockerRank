      #include <ctype.h>
      #include <stdio.h>
      #include <string.h>

      static char s[200005];

      int main(void) {
          int count = 0;
          if (!fgets(s, sizeof s, stdin)) s[0] = 0;
          s[strcspn(s, "\r\n")] = 0;
          for (char *p = s; *p; p++) {
              if (strchr("aeiou", tolower((unsigned char)*p))) count++;
          }
          printf("%d\n", count);
          return 0;
      }
