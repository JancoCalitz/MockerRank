      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          string s;
          getline(cin, s);
          int count = 0;
          for (char c : s) {
              if (string("aeiou").find(tolower((unsigned char)c)) != string::npos) count++;
          }
          cout << count << endl;
          return 0;
      }
