id: fix-vowel-count
title: Fix the Vowel Count
type: short
style: stdin
difficulty: easy
debug: true
statement: |
  This program should count the vowels `a`, `e`, `i`, `o`, and `u` in a line of text, whether they are capital or small letters. It has a bug.

  Find the bug and fix it. You should only need to change a small part of the code.
inputFormat: |
  One line of text.
outputFormat: |
  The number of vowels.
constraints: |
  - 1 <= length of the line <= 200000
sampleTests:
  - input: |
      hello world
    output: |
      3
  - input: |
      APPLE pie
    output: |
      4
hiddenTests:
  - input: |
      xyz
    output: |
      0
  - input: |
      AEIOU
    output: |
      5
    weight: 2
  - input: |
      aEiOu 123
    output: |
      5
  - file: fix-vowel-count-large
    weight: 3
checker:
  type: exact
editorial: |
  The check only looks for small letters, so capital vowels are not counted. Convert each character to one case before comparing it. Reading the requirement again, and looking for inputs the code never handles, finds this kind of bug quickly.
tags: [debugging, strings]
topics: [debugging-code-reading, arrays-strings]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              string s = Console.ReadLine() ?? "";
              int count = 0;
              foreach (char c in s)
              {
                  if ("aeiou".IndexOf(c) >= 0) count++;
              }
              Console.WriteLine(count);
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              string s = Console.ReadLine() ?? "";
              int count = 0;
              foreach (char c in s)
              {
                  if ("aeiou".IndexOf(char.ToLowerInvariant(c)) >= 0) count++;
              }
              Console.WriteLine(count);
          }
      }
