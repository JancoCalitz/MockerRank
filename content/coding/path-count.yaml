    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean);
      const rows = Number(t[0]);
      const cols = Number(t[1]);
      const ways = new Array(cols).fill(0);
      ways[0] = 1;
      for (let r = 0; r < rows; r++) {
        const row = t[2 + r];
        for (let c = 0; c < cols; c++) {
          if (row[c] === '#') ways[c] = 0;
          else if (c > 0) ways[c] = (ways[c] + ways[c - 1]) % 1000000007;
        }
      }
      console.log(ways[cols - 1]);
