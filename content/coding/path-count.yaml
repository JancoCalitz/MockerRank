    solution: |
      import sys

      t = sys.stdin.read().split()
      rows, cols = int(t[0]), int(t[1])
      ways = [0] * cols
      ways[0] = 1
      for row in t[2:2 + rows]:
          for c in range(cols):
              if row[c] == '#':
                  ways[c] = 0
              elif c > 0:
                  ways[c] = (ways[c] + ways[c - 1]) % 1000000007
      print(ways[-1])
