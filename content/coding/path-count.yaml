      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int rows = Integer.parseInt(t[0]), cols = Integer.parseInt(t[1]);
              int[] ways = new int[cols];
              ways[0] = 1;
              for (int r = 0; r < rows; r++) {
                  String row = t[2 + r];
                  for (int c = 0; c < cols; c++) {
                      if (row.charAt(c) == '#') {
                          ways[c] = 0;
                      } else if (c > 0) {
                          ways[c] = (ways[c] + ways[c - 1]) % 1000000007;
                      }
                  }
              }
              System.out.println(ways[cols - 1]);
          }
      }
