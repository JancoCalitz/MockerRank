id: path-count
title: Path Count
type: short
style: stdin
difficulty: medium
statement: |
  A delivery cart moves through a grid from the top-left cell to the bottom-right cell. It can only move right or down, and it cannot enter a blocked
  cell. Count the different routes it can take, modulo `1000000007`. Open cells are `.`, and blocked cells are `#`.
inputFormat: |
  The first line contains `rows` and `cols`.

  Each of the next `rows` lines contains `cols` characters.
outputFormat: |
  The number of routes, modulo `1000000007`.
constraints: |
  - 1 <= rows, cols <= 800
sampleTests:
  - input: |
      2 2
      ..
      ..
    output: |
      2
  - input: |
      2 2
      .#
      #.
    output: |
      0
hiddenTests:
  - input: |
      1 1
      #
    output: |
      0
  - input: |
      1 1
      .
    output: |
      1
  - input: |
      3 3
      ...
      .#.
      ...
    output: |
      2
  - input: |
      2 3
      ...
      ...
    output: |
      3
  - input: |
      2 2
      ..
      .#
    output: |
      0
    weight: 2
  - file: path-count-large
    weight: 3
checker:
  type: exact
editorial: |
  The routes into a cell are the routes into the cell above it plus the routes into the cell to its left, or 0 if the cell is blocked. Fill the grid row by row,
  taking the modulus at each step. This takes O(rows * cols) time, and one row of values is enough. Note that the start or the finish can be blocked. Trying every
  route takes exponential time.
tags: [dp, grids]
topics: [recursion-dp]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int rows = int.Parse(t[0]), cols = int.Parse(t[1]);
              var ways = new int[cols];
              ways[0] = 1;
              for (int r = 0; r < rows; r++)
              {
                  string row = t[2 + r];
                  for (int c = 0; c < cols; c++)
                  {
                      if (row[c] == '#') ways[c] = 0;
                      else if (c > 0) ways[c] = (ways[c] + ways[c - 1]) % 1000000007;
                  }
              }
              Console.WriteLine(ways[cols - 1]);
          }
      }
