      #include <stdio.h>

      static char row[802];
      static int ways[801];

      int main(void) {
          int rows, cols;
          scanf("%d %d", &rows, &cols);
          ways[0] = 1;
          for (int r = 0; r < rows; r++) {
              scanf("%801s", row);
              for (int c = 0; c < cols; c++) {
