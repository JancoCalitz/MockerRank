      #include <stdio.h>
      #include <stdlib.h>

      static char grid[500][502];

      int main(void) {
          int rows, cols, front = 0, back = 0;
          scanf("%d %d", &rows, &cols);
          for (int r = 0; r < rows; r++) scanf("%501s", grid[r]);
          int *distance = malloc(sizeof(int) * rows * cols), *queue = malloc(sizeof(int) * rows * cols);
          for (int i = 0; i < rows * cols; i++) distance[i] = -1;
          int dr[] = {1, -1, 0, 0}, dc[] = {0, 0, 1, -1};
          distance[0] = 0;
          queue[back++] = 0;
          while (front < back) {
              int cell = queue[front++];
              for (int d = 0; d < 4; d++) {
                  int r = cell / cols + dr[d], c = cell % cols + dc[d];
