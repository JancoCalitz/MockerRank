    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int rows, cols;
          cin >> rows >> cols;
          vector<string> grid(rows);
          for (string& row : grid) cin >> row;
          vector<int> distance(rows * cols, -1), queue;
          int dr[] = {1, -1, 0, 0}, dc[] = {0, 0, 1, -1};
          distance[0] = 0;
          queue.push_back(0);
          for (size_t front = 0; front < queue.size(); front++) {
              int cell = queue[front];
              for (int d = 0; d < 4; d++) {
                  int r = cell / cols + dr[d], c = cell % cols + dc[d];
                  if (r < 0 || c < 0 || r >= rows || c >= cols || grid[r][c] == '#') continue;
