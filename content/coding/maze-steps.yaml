id: maze-steps
title: Maze Steps
type: short
style: stdin
difficulty: medium
statement: |
  A robot starts in the top-left cell of a grid and must reach the bottom-right cell. Each step moves to a neighbouring open cell, up, down, left, or
  right. Open cells are `.`, and walls are `#`. Find the smallest number of steps, or print `-1` if the robot cannot get there.
inputFormat: |
  The first line contains `rows` and `cols`.

  Each of the next `rows` lines contains `cols` characters. The start and finish cells are always open.
outputFormat: |
  The smallest number of steps, or `-1`.
constraints: |
  - 1 <= rows, cols <= 500
sampleTests:
  - input: |
      3 3
      ...
      .#.
      ...
    output: |
      4
  - input: |
      2 2
      .#
      #.
    output: |
      -1
hiddenTests:
  - input: |
      1 1
      .
    output: |
      0
  - input: |
      1 3
      ...
    output: |
      2
  - input: |
      3 3
      .#.
      .#.
      ...
    output: |
      4
  - input: |
      3 4
      ..#.
      #.#.
      #...
    output: |
      5
    weight: 2
  - file: maze-steps-large
    weight: 3
checker:
  type: exact
editorial: |
  Use breadth-first search from the start. It reaches cells in order of distance, so the first time it reaches the finish uses the fewest steps. Mark a cell as seen
  when it enters the queue, not when it leaves, so that it is added only once. This takes O(rows * cols) time. Depth-first search finds a path, but not necessarily
  the shortest one.
tags: [bfs, grids]
topics: [trees-graphs]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int rows = int.Parse(t[0]), cols = int.Parse(t[1]), front = 0, back = 0;
              var distance = new int[rows * cols];
              Array.Fill(distance, -1);
              var queue = new int[rows * cols];
              int[] dr = { 1, -1, 0, 0 }, dc = { 0, 0, 1, -1 };
              distance[0] = 0;
              queue[back++] = 0;
              while (front < back)
              {
                  int cell = queue[front++];
                  for (int d = 0; d < 4; d++)
                  {
                      int r = cell / cols + dr[d], c = cell % cols + dc[d];
                      if (r < 0 || c < 0 || r >= rows || c >= cols || t[2 + r][c] == '#') continue;
                      int other = r * cols + c;
                      if (distance[other] != -1) continue;
                      distance[other] = distance[cell] + 1;
                      queue[back++] = other;
                  }
              }
              Console.WriteLine(distance[rows * cols - 1]);
          }
      }
