  python:
    starter: |
      import sys

      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import sys
      from collections import deque

      t = sys.stdin.read().split()
      rows, cols = int(t[0]), int(t[1])
      grid = t[2:2 + rows]
      distance = [[-1] * cols for _ in range(rows)]
      distance[0][0] = 0
      queue = deque([(0, 0)])
      while queue:
          row, col = queue.popleft()
          for r, c in ((row + 1, col), (row - 1, col), (row, col + 1), (row, col - 1)):
              if 0 <= r < rows and 0 <= c < cols and grid[r][c] != '#' and distance[r][c] == -1:
                  distance[r][c] = distance[row][col] + 1
                  queue.append((r, c))
      print(distance[-1][-1])
