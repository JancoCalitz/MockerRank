id: trail-loop
title: Trail Loop
type: short
style: stdin
difficulty: medium
statement: |
  A hiking trail is a chain of `n` signposts, and each one points to the next. Some trails end, and others
  lead back into a loop. Starting at signpost 1, find the number of signposts in the loop.
inputFormat: |
  The first line contains `n`.

  The second line contains `n` values. Value `i` is the signpost that signpost `i` points to, or `0` if the trail ends
  there.
outputFormat: |
  The number of signposts in the loop, or `0` if the trail from signpost 1 ends.
constraints: |
  - 1 <= n <= 200000
  - 0 <= value <= n
sampleTests:
  - input: |
      4
      2 3 4 2
    output: |
      3
  - input: |
      3
      2 3 0
    output: |
      0
hiddenTests:
  - input: |
      1
      1
    output: |
      1
  - input: |
      1
      0
    output: |
      0
  - input: |
      4
      0 1 4 3
    output: |
      0
    weight: 2
  - input: |
      3
      2 1 1
    output: |
      2
  - file: trail-loop-large
    weight: 3
checker:
  type: exact
editorial: |
  Record the step at which each signpost was first reached. On reaching a signpost a second time, the loop's
  length is the difference between the two steps. Floyd's tortoise and hare does this with O(1) space: move
  one pointer one step and the other two steps until they meet, then walk around once to measure the loop. Note
  that a loop elsewhere in the input does not count unless the trail from signpost 1 reaches it.
tags: [cycle-detection]
topics: [linked-lists]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), node = 1, step = 1;
              var seen = new int[n + 1];
              while (node != 0 && seen[node] == 0)
              {
                  seen[node] = step++;
                  node = int.Parse(t[node]);
              }
              Console.WriteLine(node == 0 ? 0 : step - seen[node]);
          }
      }
