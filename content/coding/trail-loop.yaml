    solution: |
      import java.io.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int n = Integer.parseInt(t[0]), node = 1, step = 1;
              int[] seen = new int[n + 1];
              while (node != 0 && seen[node] == 0) {
                  seen[node] = step++;
                  node = Integer.parseInt(t[node]);
              }
              System.out.println(node == 0 ? 0 : step - seen[node]);
          }
      }
  cpp:
