    solution: |
      const t = require('fs').readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const seen = new Array(t[0] + 1).fill(0);
      let node = 1;
      let step = 1;
      while (node !== 0 && seen[node] === 0) {
        seen[node] = step++;
        node = t[node];
      }
      console.log(node === 0 ? 0 : step - seen[node]);
