      import { readFileSync } from 'node:fs';

      const t: number[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const seen: number[] = new Array<number>(t[0]! + 1).fill(0);
      let node = 1;
      let step = 1;
      while (node !== 0 && seen[node] === 0) {
        seen[node] = step++;
        node = t[node]!;
      }
      console.log(node === 0 ? 0 : step - seen[node]!);
  python:
    starter: |
      import sys

      data = sys.stdin.read()
      # Parse the input and print the answer.
    solution: |
      import sys

      t = [int(x) for x in sys.stdin.read().split()]
      seen = {}
      node = 1
      step = 1
      while node != 0 and node not in seen:
          seen[node] = step
          step += 1
          node = t[node]
      print(0 if node == 0 else step - seen[node])
