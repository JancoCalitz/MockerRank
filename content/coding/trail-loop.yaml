          return 0;
      }
    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n, node = 1, step = 1;
          cin >> n;
          vector<int> next(n + 1), seen(n + 1);
          for (int i = 1; i <= n; i++) cin >> next[i];
          while (node != 0 && seen[node] == 0) {
              seen[node] = step++;
              node = next[node];
          }
          cout << (node == 0 ? 0 : step - seen[node]) << endl;
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      int main(void) {
          int n, node = 1, step = 1;
          scanf("%d", &n);
          int *next = malloc(sizeof(int) * (n + 1));
          int *seen = calloc(n + 1, sizeof(int));
          for (int i = 1; i <= n; i++) scanf("%d", &next[i]);
          while (node != 0 && seen[node] == 0) {
              seen[node] = step++;
              node = next[node];
          }
          printf("%d\n", node == 0 ? 0 : step - seen[node]);
          return 0;
      }
