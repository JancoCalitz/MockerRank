    solution: |
      import heapq
      import sys

      t = sys.stdin.read().split()
      n, q = int(t[0]), int(t[1])
      taken = [False] * (n + 1)
      released = []
      output = []
      at = 2
      unused = 1
      for _ in range(q):
          command = t[at]
          at += 1
          if command == 'RESERVE':
              seat = 0
              if released:
                  seat = heapq.heappop(released)
              elif unused <= n:
                  seat = unused
                  unused += 1
              if seat:
                  taken[seat] = True
              output.append(str(seat))
          else:
              seat = int(t[at])
              at += 1
              if taken[seat]:
                  taken[seat] = False
                  heapq.heappush(released, seat)
      print('\n'.join(output))
