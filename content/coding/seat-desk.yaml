      }
    solution: |
      #include <stdio.h>
      #include <string.h>

      static int heap[100002], heapSize = 0;
      static char taken[100002];

      static void pushSeat(int seat) {
          int i = heapSize++;
          while (i > 0 && heap[(i - 1) / 2] > seat) {
              heap[i] = heap[(i - 1) / 2];
              i = (i - 1) / 2;
          }
          heap[i] = seat;
      }

      static int popSeat(void) {
          int top = heap[0], last = heap[--heapSize], i = 0;
          while (2 * i + 1 < heapSize) {
              int child = 2 * i + 1;
              if (child + 1 < heapSize && heap[child + 1] < heap[child]) child++;
              if (heap[child] >= last) break;
              heap[i] = heap[child];
              i = child;
          }
          heap[i] = last;
          return top;
      }

      int main(void) {
          int n, q, unused = 1;
          scanf("%d %d", &n, &q);
          for (int i = 0; i < q; i++) {
              char command[10];
              scanf("%9s", command);
              if (strcmp(command, "RESERVE") == 0) {
                  int seat = 0;
                  if (heapSize > 0) seat = popSeat();
                  else if (unused <= n) seat = unused++;
                  if (seat != 0) taken[seat] = 1;
                  printf("%d\n", seat);
              } else {
                  int seat;
                  scanf("%d", &seat);
                  if (taken[seat]) {
                      taken[seat] = 0;
                      pushSeat(seat);
                  }
              }
          }
          return 0;
      }
