id: seat-desk
title: Seat Desk
type: long
style: stdin
difficulty: medium
statement: |
  A ticket desk manages seats numbered from `1` to `n`, which all start out free. It handles two commands:

  - `RESERVE` takes the lowest-numbered free seat and prints its number, or prints `0` if every seat is taken.
  - `RELEASE x` frees seat `x`. If seat `x` is already free, nothing happens.
inputFormat: |
  The first line contains `n` and `q`, the number of commands.

  Each of the next `q` lines contains a command.
outputFormat: |
  One line for each `RESERVE` command.
constraints: |
  - 1 <= n <= 100000
  - 1 <= q <= 200000
  - 1 <= x <= n
  - There is at least one `RESERVE` command.
sampleTests:
  - input: |
      3 5
      RESERVE
      RESERVE
      RELEASE 1
      RESERVE
      RESERVE
    output: |
      1
      2
      1
      3
  - input: |
      1 2
      RESERVE
      RESERVE
    output: |
      1
      0
hiddenTests:
  - input: |
      2 2
      RELEASE 2
      RESERVE
    output: |
      1
  - input: |
      2 4
      RESERVE
      RELEASE 1
      RELEASE 1
      RESERVE
    output: |
      1
      1
    weight: 2
  - input: |
      4 6
      RESERVE
      RESERVE
      RESERVE
      RELEASE 3
      RELEASE 1
      RESERVE
    output: |
      1
      2
      3
      1
  - input: |
      2 3
      RELEASE 1
      RESERVE
      RESERVE
    output: |
      1
      2
  - file: seat-desk-large
    weight: 3
checker:
  type: exact
editorial: |
  Seats that were never used are handed out in order, so a single counter tracks them. Keep released seats in a min-heap.
  Those seats are always below the counter, so check the heap first. An array of flags records which seats are taken, so that
  releasing a free seat changes nothing and a seat can never be in the heap twice. Each command takes O(log n) time. Scanning for the
  lowest free seat takes O(n) time per command, which is too slow when most seats are taken.
tags: [heap, design]
topics: [oop-design, trees-graphs]
