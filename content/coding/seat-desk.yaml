    solution: |
      using System;
      using System.Collections.Generic;
      using System.Text;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), q = int.Parse(t[1]), at = 2, unused = 1;
              var taken = new bool[n + 1];
              var released = new PriorityQueue<int, int>();
              var output = new StringBuilder();
              for (int i = 0; i < q; i++)
              {
                  if (t[at++] == "RESERVE")
                  {
                      int seat = 0;
                      if (released.Count > 0) seat = released.Dequeue();
                      else if (unused <= n) seat = unused++;
                      if (seat != 0) taken[seat] = true;
                      output.Append(seat).Append('\n');
                  }
                  else
                  {
                      int seat = int.Parse(t[at++]);
                      if (taken[seat])
                      {
                          taken[seat] = false;
                          released.Enqueue(seat, seat);
                      }
                  }
              }
              Console.Write(output);
          }
      }
