id: org-depth
title: Org Chart Depth
type: short
style: stdin
difficulty: medium
statement: |
  A company's reporting lines form a tree. Everyone has one manager except the CEO. Find the largest
  number of reporting steps between the CEO and any employee.
inputFormat: |
  The first line contains `n`, the number of employees, who are numbered from 1 to `n`.

  The second line contains `n` values. Value `i` is the manager of employee `i`, or `0` for the CEO.
outputFormat: |
  The depth of the tree, which is `0` if the CEO is the only employee.
constraints: |
  - 1 <= n <= 200000
  - Exactly one value is `0`, and the values form a single tree.
sampleTests:
  - input: |
      5
      0 1 1 2 4
    output: |
      3
  - input: |
      1
      0
    output: |
      0
hiddenTests:
  - input: |
      3
      2 3 0
    output: |
      2
  - input: |
      4
      0 1 1 1
    output: |
      1
  - input: |
      6
      3 3 0 1 1 5
    output: |
      3
  - file: org-depth-large
    weight: 3
checker:
  type: exact
editorial: |
  Build each manager's list of direct reports, then search level by level from the CEO, counting the levels.
  This takes O(n) time. Walking up from every employee takes O(n^2) time on a long chain, and a recursive search can
  overflow the call stack at that depth, so use an explicit queue.
tags: [trees, bfs]
topics: [trees-graphs]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int n = int.Parse(t[0]), root = 0;
              int[] head = new int[n + 1], next = new int[n + 1], depth = new int[n + 1], queue = new int[n];
              for (int i = 1; i <= n; i++)
              {
                  int manager = int.Parse(t[i]);
                  if (manager == 0) root = i;
                  else
                  {
                      next[i] = head[manager];
                      head[manager] = i;
                  }
              }
              int front = 0, back = 0, best = 0;
              queue[back++] = root;
              while (front < back)
              {
                  int person = queue[front++];
                  best = Math.Max(best, depth[person]);
                  for (int report = head[person]; report != 0; report = next[report])
                  {
                      depth[report] = depth[person] + 1;
                      queue[back++] = report;
                  }
              }
              Console.WriteLine(best);
          }
      }
