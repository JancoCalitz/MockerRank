      import { readFileSync } from 'node:fs';

      const t: number[] = readFileSync(0, 'utf8').split(/\s+/).filter(Boolean).map(Number);
      const n = t[0]!;
      const reports: number[][] = Array.from({ length: n + 1 }, () => []);
      let root = 0;
      for (let i = 1; i <= n; i++) {
        if (t[i] === 0) root = i;
        else reports[t[i]!]!.push(i);
      }
      const depth: number[] = new Array<number>(n + 1).fill(0);
      const queue: number[] = [root];
      let best = 0;
      for (let front = 0; front < queue.length; front++) {
        const person = queue[front]!;
        best = Math.max(best, depth[person]!);
        for (const report of reports[person]!) {
          depth[report] = depth[person]! + 1;
          queue.push(report);
        }
      }
      console.log(best);
