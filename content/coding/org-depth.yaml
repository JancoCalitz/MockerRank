    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int n, root = 0;
          cin >> n;
          vector<vector<int>> reports(n + 1);
          for (int i = 1; i <= n; i++) {
              int manager;
              cin >> manager;
              if (manager == 0) root = i;
              else reports[manager].push_back(i);
          }
          vector<int> depth(n + 1), queue;
          queue.push_back(root);
          int best = 0;
          for (size_t front = 0; front < queue.size(); front++) {
              int person = queue[front];
              best = max(best, depth[person]);
              for (int report : reports[person]) {
                  depth[report] = depth[person] + 1;
                  queue.push_back(report);
              }
          }
          cout << best << endl;
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      int main(void) {
          int n, root = 0;
          scanf("%d", &n);
          int *head = calloc(n + 1, sizeof(int)), *next = calloc(n + 1, sizeof(int));
          int *depth = calloc(n + 1, sizeof(int)), *queue = malloc(sizeof(int) * n);
          for (int i = 1; i <= n; i++) {
              int manager;
              scanf("%d", &manager);
              if (manager == 0) {
                  root = i;
              } else {
                  next[i] = head[manager];
                  head[manager] = i;
              }
          }
          int front = 0, back = 0, best = 0;
          queue[back++] = root;
          while (front < back) {
              int person = queue[front++];
              if (depth[person] > best) best = depth[person];
              for (int report = head[person]; report != 0; report = next[report]) {
                  depth[report] = depth[person] + 1;
                  queue[back++] = report;
              }
          }
          printf("%d\n", best);
          return 0;
      }
