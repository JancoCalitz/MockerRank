    solution: |
      import sys

      t = [int(x) for x in sys.stdin.read().split()]
      n = t[0]
      reports = [[] for _ in range(n + 1)]
      root = 0
      for i in range(1, n + 1):
          if t[i] == 0:
              root = i
          else:
              reports[t[i]].append(i)
      level = [root]
      depth = -1
      while level:
          depth += 1
          level = [report for person in level for report in reports[person]]
      print(depth)
