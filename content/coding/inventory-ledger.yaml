    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int q, rejected = 0;
          cin >> q;
          map<string, long long> stock;
          for (int i = 0; i < q; i++) {
              string command, item;
              cin >> command >> item;
              if (command == "COUNT") {
                  auto found = stock.find(item);
                  cout << (found == stock.end() ? 0 : found->second) << "\n";
                  continue;
              }
              long long qty;
              cin >> qty;
              if (command == "ADD") stock[item] += qty;
              else if (stock[item] < qty) rejected++;
              else stock[item] -= qty;
          }
          string top;
          long long topQty = 0;
          // A map is sorted by name, so the first item to reach a quantity wins a tie.
          for (const auto& [item, qty] : stock) {
              if (qty > topQty) {
                  top = item;
                  topQty = qty;
              }
          }
          cout << "rejected " << rejected << "\n";
          if (topQty == 0) cout << "top none\n";
          else cout << "top " << top << " " << topQty << "\n";
          return 0;
      }
