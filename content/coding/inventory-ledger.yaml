checker:
  type: exact
editorial: |
  Keep stock in a hash map from item to quantity, so that each command takes O(1) on average. Scan the
  map once at the end for the top item, ignoring items with no stock. The common mistakes are changing
  the stock on a rejected command, reporting an item whose stock has returned to 0, and using a
  locale-aware string comparison for ties.
tags: [hash-map, simulation]
topics: [hashing]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;
      using System.Collections.Generic;
      using System.Text;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int q = int.Parse(t[0]), at = 1, rejected = 0;
              var stock = new Dictionary<string, long>();
              var output = new StringBuilder();
              for (int i = 0; i < q; i++)
              {
                  string command = t[at++], item = t[at++];
                  long current = stock.GetValueOrDefault(item);
                  if (command == "COUNT")
                  {
                      output.Append(current).Append('\n');
                      continue;
                  }
                  long qty = long.Parse(t[at++]);
                  if (command == "ADD") stock[item] = current + qty;
                  else if (current < qty) rejected++;
                  else stock[item] = current - qty;
              }
              string top = null;
              long topQty = 0;
              foreach (var (item, qty) in stock)
              {
                  if (qty > topQty || (qty == topQty && qty > 0 && string.CompareOrdinal(item, top) < 0))
                  {
                      top = item;
                      topQty = qty;
                  }
              }
              output.Append("rejected ").Append(rejected).Append('\n');
              output.Append(top == null ? "top none" : $"top {top} {topQty}").Append('\n');
              Console.Write(output.ToString());
          }
      }
