id: inventory-ledger
title: Inventory Ledger
type: long
style: stdin
difficulty: medium
statement: |
  A warehouse processes a list of commands, in order, against its stock. Items start with a quantity
  of 0.

  - `ADD item qty` adds `qty` to the item's stock.
  - `REMOVE item qty` subtracts `qty` from the item's stock. If the stock is less than `qty`, the
    command is rejected, and changes nothing.
  - `COUNT item` prints the item's current stock on its own line.

  After all of the commands, print two more lines:

  1. `rejected R`, where `R` is the number of rejected commands
  2. `top item qty` for the item with the highest stock, or `top none` if no item has any stock

  If several items tie for the highest stock, use the name that comes first when compared character by
  character using ASCII values. Item names are case-sensitive.
inputFormat: |
  The first line contains `q`, the number of commands.

  Each of the next `q` lines contains one command.
outputFormat: |
  One line for each `COUNT`, then the `rejected` and `top` lines.
constraints: |
  - 1 <= q <= 100000
  - 1 <= qty <= 1000000
  - Item names have 1 to 20 ASCII letters and digits.
sampleTests:
  - input: |
      6
      ADD bolt 5
      ADD nut 3
      COUNT bolt
      REMOVE bolt 7
      REMOVE nut 3
      COUNT nut
    output: |
      5
      0
      rejected 1
      top bolt 5
  - input: |
      2
      COUNT x
      REMOVE x 1
    output: |
      0
      rejected 1
      top none
hiddenTests:
  - input: |
      2
      ADD b 2
      ADD a 2
    output: |
      rejected 0
      top a 2
  - input: |
      2
      ADD a 1
      REMOVE a 1
    output: |
      rejected 0
      top none
  - input: |
      3
      ADD A 1
      ADD a 2
      COUNT A
    output: |
      1
      rejected 0
      top a 2
  - input: |
      4
      ADD a 5
      REMOVE a 6
      REMOVE a 5
      REMOVE a 1
    output: |
      rejected 2
      top none
  - input: |
      3
      ADD x 1000000
      ADD x 1000000
      COUNT x
    output: |
      2000000
      rejected 0
      top x 2000000
  - file: inventory-ledger-large
    weight: 3
checker:
  type: exact
editorial: |
  Keep stock in a hash map from item to quantity, so that each command takes O(1) on average. Scan the
  map once at the end for the top item, ignoring items with no stock. The common mistakes are changing
  the stock on a rejected command, reporting an item whose stock has returned to 0, and using a
  locale-aware string comparison for ties.
tags: [hash-map, simulation]
topics: [hashing]
languages:
  csharp:
    starter: |
      using System;

      class Solution
      {
          public static void Main(string[] args)
          {
              // Read from Console.In and write to Console.Out.
          }
      }
    solution: |
      using System;
      using System.Collections.Generic;
      using System.Text;

      class Solution
      {
          public static void Main(string[] args)
          {
              var t = Console.In.ReadToEnd().Split((char[])null, StringSplitOptions.RemoveEmptyEntries);
              int q = int.Parse(t[0]), at = 1, rejected = 0;
              var stock = new Dictionary<string, long>();
              var output = new StringBuilder();
              for (int i = 0; i < q; i++)
              {
                  string command = t[at++], item = t[at++];
                  long current = stock.GetValueOrDefault(item);
                  if (command == "COUNT")
                  {
                      output.Append(current).Append('\n');
                      continue;
                  }
                  long qty = long.Parse(t[at++]);
                  if (command == "ADD") stock[item] = current + qty;
                  else if (current < qty) rejected++;
                  else stock[item] = current - qty;
              }
              string top = null;
              long topQty = 0;
              foreach (var (item, qty) in stock)
              {
                  if (qty > topQty || (qty == topQty && qty > 0 && string.CompareOrdinal(item, top) < 0))
                  {
                      top = item;
                      topQty = qty;
                  }
              }
              output.Append("rejected ").Append(rejected).Append('\n');
              output.Append(top == null ? "top none" : $"top {top} {topQty}").Append('\n');
              Console.Write(output.ToString());
          }
      }
  java:
    starter: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              // Read from System.in and write to System.out.
          }
      }
    solution: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int q = Integer.parseInt(t[0]), at = 1, rejected = 0;
              Map<String, Long> stock = new HashMap<>();
              StringBuilder output = new StringBuilder();
              for (int i = 0; i < q; i++) {
                  String command = t[at++], item = t[at++];
                  long current = stock.getOrDefault(item, 0L);
                  if (command.equals("COUNT")) {
                      output.append(current).append('\n');
                      continue;
                  }
                  long qty = Long.parseLong(t[at++]);
                  if (command.equals("ADD")) stock.put(item, current + qty);
                  else if (current < qty) rejected++;
                  else stock.put(item, current - qty);
              }
              String top = null;
              long topQty = 0;
              for (Map.Entry<String, Long> entry : stock.entrySet()) {
                  long qty = entry.getValue();
                  if (qty > topQty || (qty == topQty && qty > 0 && entry.getKey().compareTo(top) < 0)) {
                      top = entry.getKey();
                      topQty = qty;
                  }
              }
              output.append("rejected ").append(rejected).append('\n');
              output.append(top == null ? "top none" : "top " + top + " " + topQty).append('\n');
              System.out.print(output);
          }
      }
  cpp:
    starter: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          // Read from cin and write to cout.
          return 0;
      }
    solution: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          int q, rejected = 0;
          cin >> q;
          map<string, long long> stock;
          for (int i = 0; i < q; i++) {
              string command, item;
              cin >> command >> item;
              if (command == "COUNT") {
                  auto found = stock.find(item);
                  cout << (found == stock.end() ? 0 : found->second) << "\n";
                  continue;
              }
              long long qty;
              cin >> qty;
              if (command == "ADD") stock[item] += qty;
              else if (stock[item] < qty) rejected++;
              else stock[item] -= qty;
          }
          string top;
          long long topQty = 0;
          // A map is sorted by name, so the first item to reach a quantity wins a tie.
          for (const auto& [item, qty] : stock) {
              if (qty > topQty) {
                  top = item;
                  topQty = qty;
              }
          }
          cout << "rejected " << rejected << "\n";
          if (topQty == 0) cout << "top none\n";
          else cout << "top " << top << " " << topQty << "\n";
          return 0;
      }
  c:
    starter: |
      #include <stdio.h>

      int main(void) {
          // Read with scanf and write with printf.
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>
      #include <string.h>

      #define SLOTS 262144

      static char names[SLOTS][21];
      static long long stock[SLOTS];
      static char used[SLOTS];

      static unsigned slotFor(const char *name) {
          unsigned hash = 5381;
          for (const char *c = name; *c; c++) hash = hash * 33 + (unsigned char)*c;
          hash &= SLOTS - 1;
          while (used[hash] && strcmp(names[hash], name) != 0) hash = (hash + 1) & (SLOTS - 1);
          if (!used[hash]) {
              used[hash] = 1;
              strcpy(names[hash], name);
          }
          return hash;
      }

      int main(void) {
          int q, rejected = 0;
          scanf("%d", &q);
          char command[8], item[21];
          for (int i = 0; i < q; i++) {
              scanf("%7s %20s", command, item);
              unsigned slot = slotFor(item);
              if (strcmp(command, "COUNT") == 0) {
                  printf("%lld\n", stock[slot]);
                  continue;
              }
              long long qty;
              scanf("%lld", &qty);
              if (strcmp(command, "ADD") == 0) stock[slot] += qty;
              else if (stock[slot] < qty) rejected++;
              else stock[slot] -= qty;
          }
          int top = -1;
          for (int i = 0; i < SLOTS; i++) {
              if (!used[i] || stock[i] == 0) continue;
              if (top < 0 || stock[i] > stock[top] ||
                  (stock[i] == stock[top] && strcmp(names[i], names[top]) < 0)) {
                  top = i;
              }
          }
          printf("rejected %d\n", rejected);
          if (top < 0) printf("top none\n");
          else printf("top %s %lld\n", names[top], stock[top]);
          return 0;
      }
