      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>
      #include <string.h>

      #define SLOTS 262144

      static char names[SLOTS][21];
      static long long stock[SLOTS];
      static char used[SLOTS];

      static unsigned slotFor(const char *name) {
          unsigned hash = 5381;
          for (const char *c = name; *c; c++) hash = hash * 33 + (unsigned char)*c;
          hash &= SLOTS - 1;
          while (used[hash] && strcmp(names[hash], name) != 0) hash = (hash + 1) & (SLOTS - 1);
          if (!used[hash]) {
              used[hash] = 1;
              strcpy(names[hash], name);
          }
          return hash;
      }

      int main(void) {
          int q, rejected = 0;
          scanf("%d", &q);
          char command[8], item[21];
          for (int i = 0; i < q; i++) {
              scanf("%7s %20s", command, item);
              unsigned slot = slotFor(item);
              if (strcmp(command, "COUNT") == 0) {
                  printf("%lld\n", stock[slot]);
                  continue;
              }
              long long qty;
              scanf("%lld", &qty);
              if (strcmp(command, "ADD") == 0) stock[slot] += qty;
              else if (stock[slot] < qty) rejected++;
              else stock[slot] -= qty;
          }
          int top = -1;
          for (int i = 0; i < SLOTS; i++) {
              if (!used[i] || stock[i] == 0) continue;
              if (top < 0 || stock[i] > stock[top] ||
                  (stock[i] == stock[top] && strcmp(names[i], names[top]) < 0)) {
                  top = i;
              }
          }
          printf("rejected %d\n", rejected);
          if (top < 0) printf("top none\n");
          else printf("top %s %lld\n", names[top], stock[top]);
          return 0;
      }
