    solution: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              String[] t = new String(System.in.readAllBytes()).trim().split("\\s+");
              int q = Integer.parseInt(t[0]), at = 1, rejected = 0;
              Map<String, Long> stock = new HashMap<>();
              StringBuilder output = new StringBuilder();
              for (int i = 0; i < q; i++) {
                  String command = t[at++], item = t[at++];
                  long current = stock.getOrDefault(item, 0L);
                  if (command.equals("COUNT")) {
                      output.append(current).append('\n');
                      continue;
                  }
                  long qty = Long.parseLong(t[at++]);
                  if (command.equals("ADD")) stock.put(item, current + qty);
                  else if (current < qty) rejected++;
                  else stock.put(item, current - qty);
              }
              String top = null;
              long topQty = 0;
              for (Map.Entry<String, Long> entry : stock.entrySet()) {
                  long qty = entry.getValue();
                  if (qty > topQty || (qty == topQty && qty > 0 && entry.getKey().compareTo(top) < 0)) {
                      top = entry.getKey();
                      topQty = qty;
                  }
              }
              output.append("rejected ").append(rejected).append('\n');
              output.append(top == null ? "top none" : "top " + top + " " + topQty).append('\n');
              System.out.print(output);
          }
      }
