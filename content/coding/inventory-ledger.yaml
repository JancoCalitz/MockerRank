    solution: |
      import sys

      t = sys.stdin.read().split()
      q = int(t[0])
      at = 1
      rejected = 0
      stock = {}
      output = []
      for _ in range(q):
          command, item = t[at], t[at + 1]
          at += 2
          current = stock.get(item, 0)
          if command == 'COUNT':
              output.append(str(current))
              continue
          qty = int(t[at])
          at += 1
          if command == 'ADD':
              stock[item] = current + qty
          elif current < qty:
              rejected += 1
          else:
              stock[item] = current - qty
      output.append(f'rejected {rejected}')
      items = [(-qty, item) for item, qty in stock.items() if qty > 0]
      if items:
          qty, item = min(items)
          output.append(f'top {item} {-qty}')
      else:
          output.append('top none')
      print('\n'.join(output))
