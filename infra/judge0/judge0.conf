# Judge0 configuration. Unset options use Judge0's defaults; see
# https://github.com/judge0/judge0/blob/v1.13.1/judge0.conf
#
# These passwords protect services reachable only on the private Compose network.
# Nothing here is published to the host, so they are local-only defaults, not secrets.

REDIS_HOST=judge0-redis
REDIS_PASSWORD=mockerrank-local-redis

POSTGRES_HOST=judge0-db
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=mockerrank-local-postgres

# Candidate code never gets network access, and a request cannot opt back in.
ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false
