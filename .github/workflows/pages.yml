name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Deploying fails until Pages is turned on, so this waits for the repository variable
    # DEPLOY_PAGES to be set to true. See the README.
    if: vars.DEPLOY_PAGES == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # The published site is public, so its questions are locked with the CONTENT_PASSWORD
      # secret. Without it, nothing is deployed. See the README.
      - name: Require the content password
        env:
          CONTENT_PASSWORD: ${{ secrets.CONTENT_PASSWORD }}
        run: |
          if [ -z "$CONTENT_PASSWORD" ]; then
            echo "::error::Add a repository secret called CONTENT_PASSWORD before deploying."
            exit 1
          fi
      - run: npm run build
        env:
          CONTENT_PASSWORD: ${{ secrets.CONTENT_PASSWORD }}
      - name: Check that no questions are readable
        run: node scripts/check-locked-build.ts dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
